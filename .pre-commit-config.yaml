# Pre-commit configuration for Longhouse (codename: Zerg)
#
# Philosophy: Fast, comprehensive guardrails for AI agents
# - Tier 1 (pre-commit): < 15s, catches type errors and format issues
# - Tier 2 (make validate): < 30s, full contract validation
# - Tier 3 (CI): Full test suite
#
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # =========================================================================
  # Generic file hygiene (fast, universal)
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # trailing-whitespace and end-of-file-fixer run below as self-staging local hooks.
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1500]
        # The landing page's full-page visual baseline is ~1.8 MB (7,800 px tall).
        exclude: ^(server/zerg/vendor/tiktoken/9b5ad71b2ce5302211f9c61530b329a4922fc6a4|e2e/tests/ui_baseline_public\.spec\.ts-snapshots/landing-chromium-linux\.png)$
      - id: check-merge-conflict

  # =========================================================================
  # Secret scanning: catches AWS keys, JWTs, OpenAI/Anthropic keys, GH tokens.
  # If a real new secret-shape lands and gitleaks fires, fix the source. For
  # legitimate test fixtures, add `gitleaks:allow` on the line or extend
  # `[allowlist]` in `.gitleaks.toml` (do not loosen detection rules).
  # =========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  # =========================================================================
  # Python: ruff for lint + format (fast, replaces black/isort/flake8)
  # Only targets main source code, not test scripts
  # =========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff in server/pyproject.toml's dev group. When these
    # drifted (hook 0.8.4, project 0.9.9) the hook and a plain `ruff format`
    # disagreed about the same file, so formatting could never converge.
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --config=server/pyproject.toml]
        files: ^server/zerg/
        exclude: ^server/zerg/generated/
      # ruff-format runs below as a self-staging local hook, with the project's own ruff.

  # =========================================================================
  # Local hooks for project-specific checks
  # =========================================================================
  - repo: local
    hooks:
      # -----------------------------------------------------------------------
      # Self-staging mechanical fixes (scripts/qa/precommit_autofix.py).
      # Each rewrites only what it is given (or a file generated from the
      # commit), carries no meaning, and re-stages the result when the file has
      # no unstaged changes, so one `git commit` succeeds instead of failing and
      # sending the author around again. A fixer that errors still fails loudly.
      # Staging needs the pre-commit.legacy/post-commit shims that
      # `make install-push-gate` installs once per clone; without them a fix is
      # left in the working tree and the commit fails, as before. Lint autofix
      # (`ruff --fix`) is deliberately not here: it deletes "unused" imports.
      # require_serial: the fixers `git add`, which must not race on the index.
      # -----------------------------------------------------------------------
      - id: trailing-whitespace
        name: Trim trailing whitespace (self-staging)
        entry: python scripts/qa/precommit_autofix.py fix --name "trailing whitespace" --cmd trailing-whitespace-fixer --ok-exit 0,1 --how "pre-commit run trailing-whitespace --files <file>"
        language: python
        additional_dependencies: ["pre-commit-hooks==4.6.0"]
        types: [text]
        require_serial: true

      - id: end-of-file-fixer
        name: Fix end of files (self-staging)
        entry: python scripts/qa/precommit_autofix.py fix --name "end of file" --cmd end-of-file-fixer --ok-exit 0,1 --how "pre-commit run end-of-file-fixer --files <file>"
        language: python
        additional_dependencies: ["pre-commit-hooks==4.6.0"]
        types: [text]
        require_serial: true

      - id: ruff-format
        name: ruff format (self-staging)
        # The project's ruff (server/uv.lock), the same one `make validate-format`
        # runs, over the same trees: a separately pinned hook drifted from it
        # once (hook 0.8.4, project 0.9.9) and the two never agreed.
        entry: python3 scripts/qa/precommit_autofix.py fix --name "ruff format" --cmd "uv run --project server --extra dev ruff format --config server/pyproject.toml" --how "cd server && uv run --extra dev ruff format <file>"
        language: system
        types: [python]
        files: ^server/(zerg|tests_lite)/
        exclude: ^server/zerg/generated/
        require_serial: true

      # -----------------------------------------------------------------------
      # Session-mode vocabulary must have one canonical definition
      # -----------------------------------------------------------------------
      - id: session-mode-definitions
        name: Session mode definition check
        entry: python3 scripts/ci/check-session-mode-definitions.py
        language: system
        files: \.md$
        pass_filenames: false

      # -----------------------------------------------------------------------
      # TypeScript type checking (catches most AI errors)
      # -----------------------------------------------------------------------
      - id: typescript-typecheck
        name: TypeScript type check
        entry: bash -c 'cd web && bun run validate:types'
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false

      # -----------------------------------------------------------------------
      # Frontend lint (ESLint) - warn only, don't block on existing warnings
      # -----------------------------------------------------------------------
      - id: frontend-lint
        name: Frontend lint
        entry: bash -c 'cd web && bun run lint --max-warnings 100'
        language: system
        files: ^web/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      # -----------------------------------------------------------------------
      # WebSocket contract drift guard
      # -----------------------------------------------------------------------
      - id: ws-contract-drift
        name: WebSocket contract drift check
        entry: make validate-ws
        language: system
        files: ^(schemas/ws-protocol.*|server/zerg/generated/ws_messages\.py|web/src/generated/ws-messages\.ts)$
        pass_filenames: false

      # -----------------------------------------------------------------------
      # iOS OpenAPI DTO drift guard
      # -----------------------------------------------------------------------
      - id: ios-api-contract-drift
        name: iOS OpenAPI DTO drift check
        entry: make validate-ios-api
        language: system
        files: ^(openapi\.json|scripts/generate/ios_api_models\.py|ios/Sources/Shared/Generated/SessionAPI\.generated\.swift)$
        pass_filenames: false

      # -----------------------------------------------------------------------
      # AsyncAPI spec validation
      # -----------------------------------------------------------------------
      - id: asyncapi-validate
        name: AsyncAPI spec validation
        entry: scripts/qa/validate-asyncapi.sh
        language: system
        files: ^schemas/ws-protocol-asyncapi\.yml$
        pass_filenames: false

      # -----------------------------------------------------------------------
      # CSS rgba alpha validation (catches recolor script bugs)
      # Alpha values >1 are clamped to 1.0, making colors fully opaque
      # -----------------------------------------------------------------------
      - id: css-rgba-validate
        name: CSS rgba alpha validation
        entry: scripts/qa/validate-rgba.sh
        language: system
        files: \.css$
        pass_filenames: false

      # -----------------------------------------------------------------------
      # Check the managed-provider contract digest when an adapter changes
      # -----------------------------------------------------------------------
      - id: coordination-contract
        name: Coordination contract (self-staging)
        entry: python3 scripts/qa/precommit_autofix.py fix --name "coordination contract" --cmd "uv run --project server --extra dev python scripts/generate/generate_coordination_contract.py --write" --watch engine/src/coordination_contract.generated.json --watch server/zerg/config/coordination_contract.json --watch engine/assets/longhouse-omp-helm.ts --how "cd server && uv run --extra dev python ../scripts/generate/generate_coordination_contract.py --write"
        language: system
        require_serial: true
        files: ^(schemas/coordination_contract\.yml|scripts/generate/generate_coordination_contract\.py|engine/assets/longhouse-omp-helm\.ts|engine/src/coordination_contract\.generated\.json|server/zerg/config/coordination_contract\.json)$
        pass_filenames: false
      - id: check-provider-contract-digest
        name: Managed provider contract digest (self-staging)
        # Regenerated from the commit's own adapter/oracle sources and staged
        # (the engine include_str!s it, so a stale digest aborted `make validate`
        # and once blocked a release); see the self-staging note above.
        entry: python3 scripts/qa/precommit_autofix.py fix --name "managed provider contract digest" --cmd "uv run --project server --extra dev python scripts/generate/generate_managed_provider_contracts.py --write" --watch server/zerg/config/managed_provider_contracts.json --watch engine/src/managed_provider_contracts.generated.json --how "cd server && uv run --extra dev python ../scripts/generate/generate_managed_provider_contracts.py --write"
        language: system
        require_serial: true
        # Deliberately unfiltered. The manifest digests every adapter_source
        # AND every oracle_source, and the hand-maintained path list only ever
        # listed the adapters -- so editing an oracle
        # (provider_coordination_oracles.py, cfef3ee8c) left a stale digest that
        # aborted `make validate` on main and stayed red for days. A list that
        # must be updated whenever the schema gains a source is a list that goes
        # stale. The non-mutating check runs in ~0.15s, so running it on every
        # commit is cheaper than the one CI outage it prevents.
        always_run: true
        pass_filenames: false

      # -----------------------------------------------------------------------
      # Regenerate the provider literal census when source files change
      # (self-staging, from the commit's own tree; see the note above). A stale
      # census failed CI's Validation job twice in a day, hours after landing.
      # -----------------------------------------------------------------------
      - id: check-provider-census
        name: Provider literal census (self-staging)
        entry: python3 scripts/qa/precommit_autofix.py fix --name "provider census" --cmd "uv run --no-project --with pyyaml python scripts/generate/generate_provider_census.py --write" --watch docs/generated/provider_census.json --how "make generate-provider-census"
        language: system
        require_serial: true
        files: '\.(py|rs|swift|ts|tsx)$'
        pass_filenames: false

      # -----------------------------------------------------------------------
      # Warn on new db.commit() in routers (prefer WriteSerializer)
      # -----------------------------------------------------------------------
      - id: check-db-commits
        name: Check db.commit() in routers
        entry: scripts/ci/check-db-commits.sh
        language: system
        files: ^server/zerg/routers/.*\.py$
        pass_filenames: false
        verbose: true

      # -----------------------------------------------------------------------
      # Vulture dead code detection (unused functions/classes/variables)
      # -----------------------------------------------------------------------
      - id: python-vulture
        name: Vulture - detect dead code
        entry: bash -c 'cd server && uv run --extra dev vulture zerg/ vulture-whitelist.py --min-confidence 80 --exclude "**/tests/**,**/test_*.py,**/generated/**,**/events/emitter_protocol.py,**/events/null_emitter.py"'
        language: system
        files: ^server/zerg/
        exclude: ^server/zerg/generated/
        pass_filenames: false
