# The provider CLIs the terminal-truth CI lane installs, at exact versions.
#
# .github/workflows/terminal-truth.yml runs `scripts/ci/terminal_truth_providers.py install` then
# `verify`: it installs exactly these and fails if a binary reports anything else, so a failure on the
# runner is never a surprise provider update. Changing a version here is a deliberate edit that
# re-runs the lane (this file is a push path of the lane). Versions are the ones the Linux runner
# measured on 2026-11-11 (run 43105417205); the Mac's differ for pi and opencode.
#
# kind = "npm":   npm install --prefix <root> <package>@<version>
# kind = "omp":   https://omp.sh/install --binary --ref v<version> (the installer takes a release tag)
# kind = "agy":   the versioned tarball and sha512 named here, fetched straight from the vendor's release
#                 bucket. Its installer has no version option and always takes the newest, and agy
#                 updates itself in the background, so the lane never runs the installer.
#
# `reports` is the exact first line of `<binary> --version`.

[codex]
kind = "npm"
package = "@openai/codex"
version = "0.171.0"
binary = "codex"
reports = "codex-cli 0.171.0"

[claude]
kind = "npm"
package = "@anthropic-ai/claude-code"
version = "2.1.330"
binary = "claude"
reports = "2.1.330 (Claude Code)"

[opencode]
kind = "npm"
package = "opencode-ai"
version = "1.19.6"
binary = "opencode"
reports = "1.19.6"

[pi]
kind = "npm"
package = "@earendil-works/pi-coding-agent"
version = "1.6.0"
binary = "pi"
reports = "1.6.0"

[omp]
kind = "omp"
version = "19.1.0"
binary = "omp"
reports = "omp/19.1.0"

[antigravity]
kind = "agy"
version = "1.5.6"
binary = "agy"
reports = "1.5.6"
url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.6-6212266538958848/linux-x64/cli_linux_x64.tar.gz"
sha512 = "0c67824908caf9cc3156699802b8097f2fd02c4608ae9293c9aa7f17e1bcd342c4b9c2e158388253a37804ef6bd9c6b1d25cfaca3c07bbb7587378fc91839bb4"
