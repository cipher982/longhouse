# Review policy: the one checked-in list behind scripts/ops/review_gate.py.
#
# Reviews are off the landing path (workspace AGENTS.md, "Review"): a reversible
# change may land and reach canary before its review completes. Two rules keep that
# safe.
#   * push:      a commit touching a `blocking` path needs a completed review
#                receipt covering it before it lands.
#   * promotion: promote-dogfood/promote-production refuse a range with any commit
#                that is not `exempt` and lacks a completed receipt, or whose
#                receipt holds an unresolved blocking/material finding.
#
# Globs are repo-relative: `*` stays inside a path segment, `**` crosses segments.
# Editing this file, the gate, or the promote scripts is itself on the blocking list.
# scripts/tests/review-gate.test.py fails when a blocking glob matches no tracked
# file, so a rename cannot silently switch a protection off.

# Never need a review: docs and tests.
[exempt]
paths = [
  "**/*.md",
  "docs/**",
  "blog/**",
  "LICENSE",
  "NOTICE",
  "server/tests_lite/**",
  "engine/tests/**",
  "e2e/**",
  "scripts/tests/**",
  "**/test_*.py",
  "**/*.test.py",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
  "**/__tests__/**",
  "tests/**",
]

# `make release` version bookkeeping: exempt only when the subject matches AND every
# file is one of the bump targets, so a dependency edit cannot hide behind the subject.
[release_bump]
subject = '^Bump version to \d+\.\d+\.\d+$'
paths = [
  ".bumpversion.toml",
  "engine/Cargo.toml",
  "engine/Cargo.lock",
  "runner/package.json",
  "server/pyproject.toml",
  "server/uv.lock",
  "ios/XcodeHarness/Configs/Version.xcconfig",
]

