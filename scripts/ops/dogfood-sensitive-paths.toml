# Live-preview paths: a commit that touches one of these must carry a passing `longhouse/terminal-truth`
# commit status before dogfood promotion (scripts/ops/promote-dogfood.sh, both lanes). They are also
# sensitive: the classifier treats them like `paths` above, so such a range never takes the fast lane.
# THIS LIST IS A COPY of `on.push.paths` in .github/workflows/terminal-truth.yml, which is the one
# original; scripts/tests/dogfood-sensitive-paths.test.py fails when the two differ.
