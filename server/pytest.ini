[pytest]
pythonpath = .
testpaths = tests_lite
asyncio_default_fixture_loop_scope = function
# A hang guard for the whole suite, not a speed assertion. At 10s it aborted
# the CI container on I/O-heavy tests that pass in ~3s locally
# (test_demo_database_timeline, test_legacy_corpus_migration), failing whole
# backend jobs on SHAs unrelated to the change under test. Heavier tests raise
# it explicitly.
timeout = 60
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning:testcontainers\..*
markers =
    db_isolation: tests that verify database isolation between API and test fixtures
    first: tests that should run first to detect early issues
    live: live integration tests that require a running backend and auth token (use --timeout=120)
    integration: full pipeline integration tests (longhouse-engine ship → API → DB)
