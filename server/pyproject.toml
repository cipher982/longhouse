[project]
name = "longhouse"
version = "0.1.50"
description = "Keep Claude Code, Codex CLI, and Antigravity CLI sessions in one searchable timeline."
authors = [
    {name = "David Rose", email = "david.github@drose.io"}
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Apache-2.0"}

# Core dependencies — what every Longhouse user needs
dependencies = [
    "python-dotenv>=1.2.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "openai>=2.14.0,<3",
    "sqlalchemy>=2.0.38",
    "python-multipart>=0.0.31",
    "prometheus-client>=0.19.0",
    "cryptography>=50.0.0",
    "httpx[http2]>=0.27.0",
    "jsonschema>=4.23.0",
    "sse-starlette>=1.6.5",
    "PyJWT[crypto]>=2.13.0",
    "boto3>=1.35.0",
    "numpy>=2.4.1",
    "click>=8.2",
    "typer>=0.9.0",
    "tiktoken>=0.7.0",
    "mcp>=1.28.1,<2",
    "pyyaml>=6.0",
    "zstandard>=0.23.0",
    "packaging>=24.2",
    "psutil>=5.9.0",
    "onnxruntime>=1.28.0",
    "tokenizers>=0.23.1",
]

[project.optional-dependencies]
# Dev/test tools — not shipped in production images
dev = [
    "ruff",
    # pytest 9 forces pytest-asyncio 1.x, whose per-test asyncio.Runner joins
    # the default executor on teardown; tests that leave an executor thread
    # parked then hang an xdist worker until the CI job times out. Held until
    # those leaks are hunted down (pytest 9.0.3's fix is a /tmp/pytest-of-user
    # issue that does not apply inside the single-user test container).
    "pytest<9",
    "pytest-xdist>=3.6.1",
    "pytest-timeout>=2.3.1",
    "pytest-asyncio>=0.25.3,<1",
    "vulture>=2.11",
    # tests/integration/test_shipper_e2e.py drives the live API with it.
    "requests>=2.33.0",
]

[project.scripts]
longhouse-server = "zerg.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
packages = ["zerg"]
# zerg/qa/ is the provider factory's test machinery (~940 KB: the universal
# agent harness, per-provider adapters, release canaries, qualification
# profiles). It is repo/CI-only — nothing a Longhouse user installs ever runs
# it, and the hosted Runtime Host image builds from server/ source rather than
# this wheel (docker/runtime.dockerfile), so excluding it here costs hosted
# nothing. zerg/cli/provider_live.py goes with it: it imports the canary
# modules and is not registered on the user-facing CLI.
# Enforced by scripts/qa/check-wheel.py via `make test-wheel-package`.
exclude = [
    "zerg/qa/**",
    "zerg/cli/provider_live.py",
]

[tool.hatch.build.targets.wheel.force-include]
# The declared provider contract, read at request time by
# zerg/services/provider_capability_schema.py to serve
# /api/agents/provider-capabilities. A pip-installed wheel has neither a repo
# checkout above it nor the image's /schemas, so without this the endpoint
# 500s for every self-hoster.
"../schemas/managed_providers.yml" = "zerg/_config/managed_providers.yml"
# Which `longhouse <provider>` commands exist. `longhouse onboard` reads this
# to avoid suggesting an excluded entrypoint, and it runs from the wheel.
"../config/native_device_entrypoints.json" = "zerg/_config/native_device_entrypoints.json"
# Bundle the frontend dist into the package for pip install deployment
# This allows `longhouse serve` to serve the UI without needing the repo
"../web/dist" = "zerg/_frontend_dist"
# Bundle the shared desktop Swift package so source/wheel installs can
# still launch the macOS surface when a prebuilt binary is unavailable.
"../desktop/LonghouseMenuBarHarness/Package.swift" = "zerg/_desktop/LonghouseMenuBarHarness/Package.swift"
"../desktop/LonghouseMenuBarHarness/Sources" = "zerg/_desktop/LonghouseMenuBarHarness/Sources"
"../desktop/LonghouseMenuBarHarness/Fixtures" = "zerg/_desktop/LonghouseMenuBarHarness/Fixtures"
# Bundle the shared model routing config so source/wheel installs can start
# without requiring a sibling monorepo checkout.
"../config/models.json" = "zerg/_config/models.json"
"../config/tool-tiers.json" = "zerg/_config/tool-tiers.json"
# NOTE: build identity is NOT force-included. The generator
# (scripts/build/generate_build_identity.py) stages it directly at
# server/zerg/build_identity.json, so hatch picks it up as a regular
# package file — no force-include needed. See docs/specs/release-and-build-identity.md.

[tool.hatch.build.targets.sdist.force-include]
# Also include frontend in sdist so building from source works
"../schemas/managed_providers.yml" = "zerg/_config/managed_providers.yml"
"../web/dist" = "zerg/_frontend_dist"
"../desktop/LonghouseMenuBarHarness/Package.swift" = "zerg/_desktop/LonghouseMenuBarHarness/Package.swift"
"../desktop/LonghouseMenuBarHarness/Sources" = "zerg/_desktop/LonghouseMenuBarHarness/Sources"
"../desktop/LonghouseMenuBarHarness/Fixtures" = "zerg/_desktop/LonghouseMenuBarHarness/Fixtures"
"../config/models.json" = "zerg/_config/models.json"
"../config/tool-tiers.json" = "zerg/_config/tool-tiers.json"

[tool.uv]
# Keep cache inside repo for hermetic test runs
cache-dir = "./.uv_cache"
# tokenizers declares huggingface-hub (which pulls hf-xet, a Rust network
# client for HF storage, plus fsspec and filelock) for Tokenizer.from_pretrained.
# The local embedder only calls Tokenizer.from_file on a checksum-pinned
# artifact fetched by zerg/services/embedding_artifact.py, which works without
# the hub. Applies to uv-built installs (the runtime image, dev); a plain
# `uv tool install longhouse` from PyPI still resolves tokenizers' metadata.
exclude-dependencies = ["huggingface-hub"]

[tool.ruff]
line-length = 140

# Generated code is regenerated, never hand-edited. Without this a bare
# `ruff check zerg` fails on output nobody is allowed to fix.
exclude = ["zerg/generated"]

[tool.ruff.lint]
select = ["I", "E", "F", "Q000"]
ignore = ["E501"]  # Line length - not a safety issue, and prompt templates are intentionally long

[tool.ruff.lint.per-file-ignores]
# Test modules put an os.environ preamble between their imports so each one can
# run on its own; that is E402 by construction.
"tests/**/*.py" = ["E402", "E501"]
"tests_lite/**/*.py" = ["E402", "E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "pyte>=0.8.2",
]
