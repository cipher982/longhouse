<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
/* __LH_ROOT_BLOCK__ */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  background: var(--page);
}

body {
  min-height: 100%;
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: -apple-system-body;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: anywhere;
}

/* `dvh` tracks the actual WKWebView viewport when the keyboard changes the
   composer inset. Keep the legacy value as a fallback for older WebKit. */
#root {
  min-height: 100vh;
  min-height: 100dvh;
  /* SwiftUI lays the WebView out inside the safe area, so its frame already
     stops above the floating control card. This is only the comfort gap. */
  padding: 12px 16px 18px;
  /* A short tail hugs the composer like a conversation, instead of
     floating at the top over a blank band. Rows space themselves with
     bottom margins only, so the flex column changes nothing else. */
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.empty, .error {
  min-height: 48vh;
  display: grid;
  place-items: center;
  text-align: center;
  color: var(--secondary);
  padding: 24px;
}

.error {
  color: var(--attention);
}

.row {
  width: 100%;
  margin: 0 0 10px;
}

.message {
  max-width: 100%;
  user-select: text;
  -webkit-user-select: text;
}

.message.user {
  display: flex;
  justify-content: flex-end;
  padding-left: 48px;
}

/* Assistant prose: a plain document paragraph, no card, generous leading. */
.message.assistant {
  display: block;
  padding: 0;
  background: transparent;
}

/* The human message: a quiet neutral capsule. Right-alignment + fill is the
   "this is you" signal — no outline needed, and no borrowed signal color. */
.bubble {
  display: inline-block;
  max-width: 100%;
  padding: 9px 14px 10px;
  border-radius: 17px;
  background: var(--user);
  white-space: pre-wrap;
}

/* An unsent message sits exactly where its durable row will land, in
   the same capsule; only its ink and the status line say it is unsent. */
.submitted .bubble {
  background: var(--user-pending);
}

.submitted.submitting .bubble {
  animation: submitted-breathe 1.8s ease-in-out infinite;
}

.submitted.queued .bubble {
  background: transparent;
  /* Outline, not border: the capsule keeps its size when it sends. */
  outline: 1px dashed var(--rule);
  outline-offset: -1px;
  color: var(--secondary);
}

.submitted.couldNotConfirm .bubble,
.submitted.failed .bubble {
  opacity: 0.6;
}

.submitted-status {
  margin-top: 6px;
  color: var(--secondary);
  font-size: 12px;
  font-weight: 600;
  text-align: right;
}

.submitted-attachments {
  margin-top: 6px;
  color: var(--secondary);
  font-size: 11px;
  text-align: right;
  white-space: pre-wrap;
}

.submitted-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 7px;
}

.submitted-actions button {
  border: 0;
  background: transparent;
  color: var(--secondary);
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 0;
}

.submitted.couldNotConfirm .submitted-status,
.submitted.failed .submitted-status {
  color: var(--attention);
}

@keyframes submitted-breathe {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.85; }
}

@media (prefers-reduced-motion: reduce) {
  .submitted.submitting .bubble {
    animation: none;
    opacity: 0.65;
  }
}

.action {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--secondary);
  font-size: 12px;
  user-select: text;
  -webkit-user-select: text;
}

.action-rule {
  width: 22px;
  height: 1px;
  background: var(--rule);
  flex-shrink: 0;
}

.action-title {
  color: var(--primary);
  font-weight: 650;
}

.action.compaction {
  margin: 4px 0;
  color: var(--tertiary);
  font-size: 11px;
}

.action.compaction .action-title {
  color: var(--secondary);
  font-weight: 500;
}

.compaction-detail {
  color: var(--tertiary);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.turn-end {
  margin-top: 8px;
  color: var(--secondary);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.origin {
  margin-top: 6px;
  color: var(--secondary);
  font-size: 11px;
  font-weight: 650;
  text-align: right;
  display: flex;
  gap: 4px;
  align-items: center;
  justify-content: flex-end;
}

.message-content {
  line-height: 1.48;
  color: color-mix(in srgb, var(--text) 88%, transparent);
}

.message-content strong {
  color: var(--text);
  font-weight: 600;
}

.media-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
  gap: 8px;
  margin-top: 8px;
  max-width: 100%;
}

.message.user .media-strip {
  justify-content: end;
}

.media-item {
  display: block;
  max-height: 240px;
  min-width: 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--rule);
  background: var(--code);
}

.media-item img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: rgba(0, 0, 0, 0.16);
}

.media-animated {
  display: block;
  padding: 4px 8px;
  color: var(--secondary);
  font-size: 11px;
  font-weight: 600;
}

.media-placeholder {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px dashed var(--rule);
  color: var(--secondary);
  background: var(--code);
  font-size: 12px;
  font-weight: 600;
}

p {
  margin: 0 0 0.75em;
}

p:last-child {
  margin-bottom: 0;
}

h1, h2, h3 {
  margin: 0.9em 0 0.35em;
  line-height: 1.2;
  color: var(--text);
}

h1:first-child, h2:first-child, h3:first-child {
  margin-top: 0;
}

h1 {
  font-size: 20px;
}

h2 {
  font-size: 17px;
  padding-bottom: 0.2em;
  border-bottom: 1px solid var(--rule);
}

h3 {
  font-size: 15px;
  font-weight: 700;
}

/* A table too wide for the screen scrolls sideways in here instead of
   squeezing its columns. The backgrounds mark an edge that has more behind
   it: the two page-colored covers travel with the table and hide the two
   edge tints, which stay put, once that side is scrolled to its end. */
.table-wrap {
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  margin: 0.5em 0 0.75em;
  border-radius: 7px;
  border: 1px solid var(--rule);
  background:
    linear-gradient(to right, var(--page) 40%, transparent) left / 28px 100% no-repeat local,
    linear-gradient(to left, var(--page) 40%, transparent) right / 28px 100% no-repeat local,
    linear-gradient(to right, var(--edge), transparent) left / 16px 100% no-repeat scroll,
    linear-gradient(to left, var(--edge), transparent) right / 16px 100% no-repeat scroll;
  --edge: color-mix(in srgb, var(--text) 22%, transparent);
}

table {
  border-collapse: collapse;
  min-width: 100%;
  font-size: 0.9em;
}

/* Labels and values stay on one line. */
th, td {
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
  vertical-align: top;
}

/* A column of sentences wraps between words and keeps a readable line. The
   body's `overflow-wrap: anywhere` would let table layout shrink it to one
   letter per line; `break-word` splits only a token wider than max-width. */
th.prose, td.prose {
  white-space: normal;
  overflow-wrap: break-word;
  min-width: 10em;
  max-width: 22em;
}

th {
  font-weight: 650;
  background: var(--code);
}

tr:last-child td {
  border-bottom: none;
}

td[align="center"], th[align="center"] { text-align: center; }
td[align="right"],  th[align="right"]  { text-align: right; }

ul {
  margin: 0.25em 0 0.75em 1.25em;
  padding: 0;
}

li {
  margin: 0.22em 0;
}

ul > li::marker {
  color: var(--secondary);
}

:not(pre) > code {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 0.88em;
  background: var(--code);
  color: #3D7A4E;
  border-radius: 5px;
  padding: 1px 4px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

@media (prefers-color-scheme: dark) {
  :not(pre) > code {
    color: #9BC4A2;
  }
}

h1 :not(pre) > code,
h2 :not(pre) > code,
h3 :not(pre) > code,
table :not(pre) > code {
  background: transparent;
  padding: 0;
}

a code {
  color: inherit;
}

pre {
  margin: 8px 0 0;
  padding: 9px;
  border-radius: 7px;
  background: var(--code);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  white-space: pre;
  -webkit-overflow-scrolling: touch;
  -webkit-user-select: text;
  user-select: text;
}

pre code {
  background: transparent;
  padding: 0;
  white-space: pre;
}

a {
  color: var(--link);
}

.expand {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--link);
  font: inherit;
  font-size: 13px;
  font-weight: 650;
  padding: 8px 0 0;
}

/* Tool rows demoted to footnotes: no box, no purple. A faint left rule
   groups them under the turn; they read as quiet metadata, not cards.
   Still fully expandable (preserve, never erase). */
details.tool, details.passive, div.tool {
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  margin-left: 2px;
  /* The brass trace down the left edge, the web's tool line. */
  border-left: 1.5px solid var(--trace);
  overflow: hidden;
}

summary, .tool-head {
  min-height: 28px;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 4px 10px;
  list-style: none;
}

summary::-webkit-details-marker {
  display: none;
}

.tool-title {
  /* A long edit list must trail off with an ellipsis, not run under the
     right edge and take the count with it. */
  min-width: 0;
  flex: 0 1 auto;
  font-size: 13px;
  font-weight: 600;
  color: var(--secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* A provider's reasoning summary: quiet prose clamped to three lines, the whole
   thought behind a tap. It is the step's narration for models that write no
   prose between tool calls. */
.reasoning summary {
  display: block;
  padding: 4px 10px;
}

.reasoning-prose {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  white-space: pre-line;
  color: var(--secondary);
  font-size: 13px;
  line-height: 1.45;
}

.reasoning[open] .reasoning-prose {
  display: none;
}

.reasoning .details-body {
  color: var(--secondary);
  font-size: 13px;
}

/* A background job's notice with no output to open: the header is the whole
   message, so it wraps instead of trailing off where a tap cannot reach. */
.notice.static .tool-title {
  overflow: visible;
  white-space: normal;
}

/* A job's output is log text: wrap it at the failure preview's size rather
   than scroll a wide block sideways. */
.notice .details-body pre,
.notice .details-body pre code {
  font: 11px ui-monospace, "SF Mono", Menlo, monospace;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.tool-subtitle {
  min-width: 0;
  flex: 1;
  color: var(--tertiary);
  font: 13px ui-monospace, "SF Mono", Menlo, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tool-meta {
  color: var(--tertiary);
  font-size: 11px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.tool-meta.running {
  color: var(--secondary);
}

/* A dropped or orphaned result is the loud tool signal — attention color.
   Both mean "the result is missing/unexpected", the trust case we never
   want to silently hide. */
.tool-meta.dropped,
.tool-meta.orphan {
  color: var(--attention);
  font-style: normal;
}

.tool-meta.failed {
  color: var(--attention);
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Bounded, tap-free preview of a failed call's output (R4). */
.failure-preview {
  margin: 0 10px 8px;
  border: 1px solid rgba(200, 80, 70, 0.28);
  border-radius: 6px;
  background: rgba(40, 12, 10, 0.35);
  padding: 6px 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
}

.failure-preview pre {
  margin: 0;
  font: 11px ui-monospace, "SF Mono", Menlo, monospace;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--secondary);
}

/* Edit diffs (R3). */
.diff {
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0;
}

.diff-line {
  display: flex;
  gap: 6px;
  font: 11px ui-monospace, "SF Mono", Menlo, monospace;
  line-height: 1.5;
  padding: 0 8px;
  white-space: pre;
}

.diff-gutter { opacity: 0.6; user-select: none; }
.diff-line--add { color: var(--diff-add); }
.diff-line--remove { color: var(--diff-remove); }
.diff-line--equal { opacity: 0.75; }

.details-body {
  border-top: 1px solid var(--rule);
  margin: 4px 10px 0;
  padding: 8px 0 8px;
}

.question {
  border-left: 2px solid var(--attention);
  padding: 8px 0 8px 10px;
  user-select: text;
  -webkit-user-select: text;
}

.question-eyebrow {
  color: var(--attention);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0;
  text-transform: uppercase;
}

.question-title {
  margin-top: 2px;
  color: var(--primary);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.25;
}

.question-subtitle {
  margin-top: 2px;
  color: var(--secondary);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
}

.question-body {
  margin-top: 8px;
  color: var(--primary);
  font-size: 14px;
  line-height: 1.42;
  white-space: pre-wrap;
}

.question-options {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

.question-option {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 7px 8px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.025);
  color: var(--secondary);
}

.question-option-title {
  color: var(--primary);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.25;
}

.question-option-subtitle {
  color: var(--secondary);
  font-size: 12px;
  line-height: 1.3;
}

.section-label {
  margin: 10px 0 4px;
  color: var(--secondary);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0;
}

.section-label:first-child {
  margin-top: 0;
}

.passive-call {
  padding: 8px 0;
  border-top: 1px solid var(--rule);
}

.passive-call:first-child {
  border-top: 0;
  padding-top: 0;
}

.passive-call-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--secondary);
}

.passive-call-subtitle {
  color: var(--tertiary);
  font: 13px ui-monospace, "SF Mono", Menlo, monospace;
  margin-top: 2px;
}

/* Under an expanded row whose bodies a lite page sent as previews. */
.body-note {
  margin: 6px 0 0;
  font-size: 11px;
  color: var(--secondary);
}

.attached-chip {
  margin-top: 4px;
  color: var(--secondary);
  font-size: 12px;
  text-align: right;
}

.attached-thumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: flex-end;
  margin-bottom: 4px;
}
.attached-thumb img {
  display: block;
  max-width: 140px;
  max-height: 140px;
  border-radius: 10px;
  object-fit: cover;
}

/* --- Claude Code fidelity signals & subagent tree --- */
/* Narration: the steps under a commentary line or a thought read as one dim line
   each, the way the web timeline shows them. The leader keeps its prose; the
   final answer, with no phase mark, stays at full weight. */
details.trail, .row.trail {
  margin-bottom: 2px;
}

details.trail summary {
  min-height: 24px;
  padding: 2px 10px;
  gap: 8px;
}

details.trail .tool-title {
  font: 500 12px ui-monospace, "SF Mono", Menlo, monospace;
  color: var(--tertiary);
}

details.trail .tool-subtitle {
  font-size: 12px;
  color: var(--secondary);
}

details.trail .tool-intent {
  display: none;
}

details.trail .tool-meta {
  margin-left: auto;
  font-size: 11px;
}

/* A step ends where the next row that is not part of it starts: give it air. */
.trail + :not(.trail):not(.failure-preview):not(.subagents):not(.running-output-tail) {
  margin-top: 10px;
}

.message.assistant.commentary .message-content {
  color: var(--secondary);
  font-size: 13.5px;
}

.reasoning-withheld {
  padding: 4px 10px;
  margin-left: 2px;
  border-left: 1.5px solid var(--trace);
  color: var(--tertiary);
  font-size: 12px;
  font-style: italic;
}

.tool-intent {
  color: var(--secondary);
  font-size: 11px;
  font-style: italic;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 45%;
}

/* A running call is the row it becomes when it returns; a dot and the clock
   say it is live, and the output so far hangs off it on a hairline, two lines
   at most (the web's .tl-run__tail). */
/* In the row's left padding, so the label sits where it will when the call
   returns: nothing shifts on settle. */
summary:has(> .run-dot) {
  position: relative;
}

.run-dot {
  position: absolute;
  left: 0;
  top: calc(50% - 2.5px);
  width: 5px;
  height: 5px;
  border-radius: 999px;
  background: var(--tertiary);
}

.run-dot.live {
  background: #e2a452;
  animation: run-dot-pulse 1.6s ease-out infinite;
}

@keyframes run-dot-pulse {
  0% { box-shadow: 0 0 0 0 rgba(226, 164, 82, 0.55); }
  70% { box-shadow: 0 0 0 3px rgba(226, 164, 82, 0); }
  100% { box-shadow: 0 0 0 0 rgba(226, 164, 82, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .run-dot.live {
    animation: none;
  }
}

.tool-meta.running[data-started-at-ms] {
  color: #e2a452;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}

/* The tail belongs to the row above it: no gap between them. */
.row:has(+ .running-output-tail) {
  margin-bottom: 0;
}

.running-output-tail {
  margin: 0 10px 8px 12px;
  padding: 0 0 0 8px;
  border-left: 1px solid var(--rule);
  overflow: hidden;
}

.running-output-tail pre,
.running-output-tail pre code {
  margin: 0;
  padding: 0;
  background: transparent;
  font: 11px ui-monospace, "SF Mono", Menlo, monospace;
  line-height: 1.45;
  color: var(--tertiary);
  white-space: pre;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-notice-dot,
.subagent-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 999px;
  flex-shrink: 0;
  background: var(--secondary);
}

.task-notice-dot.status-completed {
  background: #67b87a;
}

.task-notice-dot.status-running,
.subagent-dot.status-running {
  background: #e2a452;
}

.task-notice-dot.status-failed,
.task-notice-dot.status-killed {
  background: var(--attention);
}

.subagent-dot.status-waiting {
  background: transparent;
  border: 1.5px solid var(--secondary);
}

.subagent-notice-recovered,
.api-error-notice.recovered {
  border-left-color: var(--trace);
}

.api-error-notice.recovered .api-error-badge {
  border-color: rgba(212, 184, 122, 0.25);
  background: rgba(212, 184, 122, 0.08);
  color: var(--secondary);
}

.api-error-notice.recovered .tool-title {
  color: var(--secondary);
}

.task-notice-note {
  color: var(--secondary);
  font-size: 11px;
}

.waiting-agents-icon {
  color: #e2a452;
  font-weight: 700;
}

.api-error-notice {
  border-left-color: var(--attention);
}

.api-error-badge {
  padding: 1px 6px;
  border: 1px solid rgba(200, 80, 70, 0.4);
  border-radius: 4px;
  background: rgba(200, 80, 70, 0.14);
  color: var(--attention);
  font: 11px ui-monospace, "SF Mono", Menlo, monospace;
  white-space: nowrap;
}

.subagents {
  margin: 2px 0 8px 2px;
  border-left: 1.5px solid var(--trace);
}

.subagents-single {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-left: 8px;
}

.subagents-branch {
  color: var(--tertiary);
  font: 11px ui-monospace, "SF Mono", Menlo, monospace;
  flex-shrink: 0;
