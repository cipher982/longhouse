[package]
name = "longhouse-engine"
version = "0.1.50"
edition = "2021"
description = "Longhouse session shipper — high-performance Rust engine"
license = "Apache-2.0"

[[bin]]
name = "longhouse-engine"
path = "src/main.rs"

[[bin]]
name = "longhouse"
path = "src/longhouse.rs"

[features]
# Negative-control builds only. Never enabled in release artifacts: it lets a
# qualification producer prove its oracle fails when an operation is broken.
# Codex dispatch seam: src/qa_fault.rs. OpenCode: opencode_control::qa_fault.
qa-fault-injection = []

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Compression (zlib-rs backend is fastest per flate2 docs; default miniz_oxide is pure Rust but slower)
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"

# HTTP
base64 = "0.23"
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "signal", "sync", "time", "process", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

# SQLite
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "fallible_uint"] }

# Parallelism
rayon = "1"
crossbeam-channel = "0.5"

# Filesystem watching
notify = "8.2"

# Memory-mapped I/O
memmap2 = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.32.1"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.1", features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }

# Random (jitter for 429 backoff)
rand = "0.9"

# System calls (disk free bytes)
libc = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "v5"] }

# Canonical storage identity framing
unicode-normalization = "0.1"

# Hashing (attachment sha256 verify)
sha2 = "0.10"
# Preview derivation only: decode the provider's screenshots and re-encode a
# small JPEG. Decode-only formats keep the binary from carrying encoders the
# engine never uses.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Signal handling
signal-hook = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

# File traversal
walkdir = "2"

# CPU detection
num_cpus = "1"

# Process-lifetime file locking (bridge state file liveness)
fd-lock = "4"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
temp-env = "0.3.6"
# No tokio `test-util` here: a dev-only feature makes Cargo resolve a second
# dependency graph for test targets, which recompiled tokio's dependents and
# both engine binaries on every `cargo test`. Tests pass short budgets instead.

[profile.dev]
incremental = true
debug = 1

[profile.test]
inherits = "dev"
incremental = true
debug = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.ci]
inherits = "release"
lto = false
codegen-units = 8
incremental = false

# CI test lane (contract-first-ci "Engine tests"). The suite waits on
# subprocesses, sockets, and SQLite, not CPU, so optimizing the 140k-line
# engine crate buys nothing while costing ~4x its compile time. Dependencies
# stay at opt-level 3 (SQLite, zstd, serde_json do the heavy lifting), and
# release semantics (no debug assertions or overflow checks) are kept.
[profile.ci-test]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16
incremental = false

[profile.ci-test.package."*"]
opt-level = 3
