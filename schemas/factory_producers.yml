# The producers the provider factory runs, as the factory itself registers them.
#
# This is the public mirror of the private control-plane registry, `PRODUCER_MODULES` in
# provider_factory/assurance.py. The factory refuses to accept an epoch while a release-gate
# row in schemas/managed_providers.yml has no registered producer (three factory deploys on
# 2026-10-01 were spent on exactly that), and this repository cannot read the control plane,
# so the ids it knows about are listed here and checked where the row is written:
#   * `make validate-factory-registration` (zerg.qa.factory_registration) fails when a
#     `release_gate` row names a producer that is not listed below, when a listed producer
#     does not export the registration its entry names, or when a registration does not
#     cover its row (scenario, revision, evidence class).
#   * control-plane CI compares this file, at the accepted epoch's pinned head, with
#     PRODUCER_MODULES and fails when the two differ.
#
# To add a producer: register it in the control-plane PRODUCER_MODULES and list it here in the
# same unit of work (the factory pin has to reach a head that carries the module), and author
# its rows `assurance_priority: ordinary_ci` or `sampled` until both have landed. The path is
# derived from the module (zerg.qa.x -> server/zerg/qa/x.py).
schema_version: 1
producers:
  - producer_id: codex.native_resume.v1
    module: zerg.qa.codex_native_resume
  - producer_id: claude.native_resume.v1
