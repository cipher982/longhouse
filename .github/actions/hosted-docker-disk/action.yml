name: Hosted runner Docker disk
description: >-
  Move Docker's data root to the hosted runner's large /mnt disk. The fixture
  image unpacks to ~9 GB and the root disk has ~20 GB free, so every job that
  pulls it runs this first.
runs:
  using: composite
  steps:
    - name: Put Docker storage on /mnt
      shell: bash
      run: |
        set -euo pipefail
        sudo systemctl stop docker docker.socket
        echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo mkdir -p /mnt/docker
        sudo systemctl start docker
        docker info --format 'docker root={{.DockerRootDir}} cpus={{.NCPU}} mem={{.MemTotal}}'
