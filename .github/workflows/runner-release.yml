name: Runner Binary Release

on:
  push:
    tags:
      - "runner-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., runner-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: longhouse-runner-darwin-arm64
          # darwin-x64 skipped: no free Intel macOS runner available
          # Can build locally or use self-hosted runner if needed
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: longhouse-runner-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: longhouse-runner-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: runner
        run: bun install

      - name: Build binary
        working-directory: runner
        run: |
          bun build --compile --target=${{ matrix.target }} --minify src/index.ts --outfile=dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: runner/dist/${{ matrix.artifact }}
          retention-days: 1

  release:
    timeout-minutes: 30
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: binaries
          merge-multiple: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: List binaries
        run: ls -la binaries/

      - name: Make binaries executable
        run: chmod +x binaries/*

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#runner-}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build update manifest + checksums
        run: |
          bun runner/scripts/build-update-manifest.ts \
            --binaries-dir binaries \
            --output-dir release-metadata \
            --tag "${{ steps.version.outputs.tag }}" \
            --version "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}"

      - name: Sign update manifest
        env:
          RUNNER_RELEASE_SIGNING_KEY: ${{ secrets.RUNNER_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RUNNER_RELEASE_SIGNING_KEY" ]; then
            echo "RUNNER_RELEASE_SIGNING_KEY is not configured" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RUNNER_RELEASE_SIGNING_KEY" > runner-release-signing-key.pem
          openssl pkeyutl \
            -sign \
            -rawin \
            -inkey runner-release-signing-key.pem \
            -in release-metadata/longhouse-runner-manifest.json \
            -out release-metadata/longhouse-runner-manifest.json.sig
          rm -f runner-release-signing-key.pem

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Longhouse Runner ${{ steps.version.outputs.version }}
          body: |
            ## Installation

            ```bash
            curl -fsSL https://api.longhouse.ai/api/runners/install.sh?enroll_token=YOUR_TOKEN | bash
            ```

            ## Binaries

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | Apple Silicon (arm64) | `longhouse-runner-darwin-arm64` |
            | Linux | x64 | `longhouse-runner-linux-x64` |
            | Linux | arm64 | `longhouse-runner-linux-arm64` |

            Signed release metadata is published as:
            - `longhouse-runner-manifest.json`
            - `longhouse-runner-manifest.json.sig`
            - `checksums.txt`

            ## Manual Installation

            1. Download the binary for your platform
            2. Make it executable: `chmod +x longhouse-runner-*`
            3. Register with Longhouse API to get credentials
            4. Run: `./longhouse-runner-* --envfile /path/to/runner.env`
          draft: false
          prerelease: false
          files: |
            binaries/longhouse-runner-darwin-arm64
            binaries/longhouse-runner-linux-x64
            binaries/longhouse-runner-linux-arm64
            release-metadata/longhouse-runner-manifest.json
            release-metadata/longhouse-runner-manifest.json.sig
            release-metadata/checksums.txt

      - name: Attest runner release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            binaries/longhouse-runner-darwin-arm64
            binaries/longhouse-runner-linux-x64
            binaries/longhouse-runner-linux-arm64
            release-metadata/longhouse-runner-manifest.json
            release-metadata/longhouse-runner-manifest.json.sig
            release-metadata/checksums.txt
