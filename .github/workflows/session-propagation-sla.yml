name: Session Propagation SLA

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      attempts:
        description: 'Profiler attempts; contaminated attempts retry'
        required: false
        default: '3'
        type: string
      iterations:
        description: 'Clean distribution samples requested per provider'
        required: false
        default: '20'
        type: string
      subdomain:
        description: 'Hosted instance subdomain'
        required: false
        default: 'demo'
        type: string
      project:
        description: 'Longhouse project label'
        required: false
        default: 'zerg'
        type: string
      expected_hosted_commit:
        description: 'Exact already-deployed Runtime Host commit (defaults to workflow SHA)'
        required: false
        default: ''
        type: string
      include_experimental:
        description: 'Also run report-only provider and secondary-path cases'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: session-propagation-sla-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-pair:
    name: Build exact Longhouse profiler pair
    runs-on: cube
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Build native pair once
        run: |
          python3 scripts/build/generate_build_identity.py
          cargo build --manifest-path engine/Cargo.toml --profile ci --bin longhouse --bin longhouse-engine
          mkdir -p .build/session-propagation-native
          install -m 755 engine/target/ci/longhouse .build/session-propagation-native/longhouse
          install -m 755 engine/target/ci/longhouse-engine .build/session-propagation-native/longhouse-engine
      - uses: actions/upload-artifact@v7
        with:
          name: session-propagation-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/session-propagation-native
          if-no-files-found: error
          retention-days: 1

  profiler:
    name: "${{ matrix.name }}"
    needs: native-pair
    runs-on: cube-deploy
    timeout-minutes: 120
    if: ${{ github.repository == 'cipher982/longhouse' && (github.event_name != 'schedule' || vars.SESSION_PROPAGATION_SLA_ENABLED == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: managed-codex-warm-realtime
            case: managed_codex_warm_live_graceful_close
            profile: warm-live
            provider: codex
            ownership: managed
            experimental: false
            provider_to_pixel_only: true
          - name: managed-codex-cold-timeline
            case: managed_codex_cold_timeline_closed
            profile: cold-timeline
            provider: codex
            ownership: managed
            experimental: true
            provider_to_pixel_only: false
          - name: managed-codex-durable-archive
            case: managed_codex_durable_archive
            profile: warm-live
            provider: codex
            ownership: managed
            experimental: true
            provider_to_pixel_only: false
          - name: managed-claude-warm-realtime
            case: managed_claude_warm_live_graceful_close
            profile: warm-live
            provider: claude
            ownership: managed
            experimental: false
            provider_to_pixel_only: true
          - name: managed-cursor-warm-realtime
            case: managed_cursor_helm_content_promotion
            profile: warm-live
            provider: cursor
            ownership: managed
            experimental: false
            provider_to_pixel_only: true
          - name: managed-opencode-warm-realtime
            case: managed_opencode_warm_lifecycle
            profile: warm-live
            provider: opencode
            ownership: managed
            experimental: false
            provider_to_pixel_only: true
          - name: unmanaged-codex-baseline
            case: unmanaged_codex_direct_graceful_close
            profile: baseline
            provider: codex
            ownership: unmanaged
            experimental: true
            provider_to_pixel_only: false
    env:
      SESSION_PROPAGATION_ATTEMPTS: ${{ inputs.attempts || '3' }}
      SESSION_PROPAGATION_ITERATIONS: ${{ inputs.iterations || '20' }}
      SESSION_PROPAGATION_SUBDOMAIN: ${{ inputs.subdomain || vars.HOSTED_CANARY_SUBDOMAIN || 'demo' }}
      SESSION_PROPAGATION_PROJECT: ${{ inputs.project || 'zerg' }}
      SESSION_PROPAGATION_SLA_CASE: ${{ matrix.case }}
      SESSION_PROPAGATION_PROFILE: ${{ matrix.profile }}
      SESSION_PROPAGATION_PROVIDER: ${{ matrix.provider }}
      SESSION_PROPAGATION_OWNERSHIP: ${{ matrix.ownership }}
      SESSION_PROPAGATION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case }}
      SESSION_PROPAGATION_OUTPUT_ROOT: ${{ github.workspace }}/artifacts/session-propagation-sla/gha-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}
      SESSION_PROPAGATION_CODEX_EFFORT: low
      SESSION_PROPAGATION_PROVIDER_TO_PIXEL_ONLY: ${{ matrix.provider_to_pixel_only || false }}
      SESSION_PROPAGATION_EXPECTED_HOSTED_COMMIT: ${{ inputs.expected_hosted_commit || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental || 'false' }}
      LONGHOUSE_DEVICE_TOKEN: ${{ secrets.LONGHOUSE_DEVICE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.LONGHOUSE_CI_ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.LONGHOUSE_CI_CURSOR_API_KEY }}
      OPENCODE_CONFIG_CONTENT: '{"model":"openrouter/openai/gpt-5.2-codex"}'
      SESSION_PROPAGATION_BOOTSTRAP_ENGINE: 'true'
      SESSION_PROPAGATION_MACHINE_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}
      SESSION_PROPAGATION_SSH_TARGET: unavailable-in-ci

    steps:
      - uses: actions/checkout@v6

      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: longhouse-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            longhouse-bun-${{ runner.os }}-

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: longhouse-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'e2e/package.json') }}
          restore-keys: |
            longhouse-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - uses: astral-sh/setup-uv@v7

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        # --with-deps installs the shared libraries chromium links against.
        # Without it the runner downloads a browser it cannot execute, and the
        # profiler fails as "browser observer did not reach ready state" rather
        # than as a missing libnspr4.so.
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Select matrix case
        id: selection
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          should_run=true
          blocked_reason=""
          if [[ "${{ matrix.experimental }}" == "true" && "$INCLUDE_EXPERIMENTAL" != "true" ]]; then
            should_run=false
            blocked_reason="experimental case not requested"
          fi
          case "$PROVIDER" in
            codex) credential="$OPENAI_API_KEY" ;;
            claude) credential="$ANTHROPIC_API_KEY" ;;
            cursor) credential="$CURSOR_API_KEY" ;;
            opencode) credential="$OPENROUTER_API_KEY" ;;
            *) credential="" ;;
          esac
          if [[ "$should_run" == "true" && -z "$credential" ]]; then
            should_run=false
            blocked_reason="missing $PROVIDER CI credential"
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "blocked_reason=$blocked_reason" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" != "true" ]]; then
            echo "Skipping $SESSION_PROPAGATION_SLA_CASE: $blocked_reason"
          fi

      - name: Install exact Longhouse pair
        if: steps.selection.outputs.should_run == 'true'
        uses: actions/download-artifact@v8
        with:
          name: session-propagation-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/session-propagation-native

      - name: Verify exact Longhouse pair
        if: steps.selection.outputs.should_run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 755 .build/session-propagation-native/longhouse "$HOME/.local/bin/longhouse"
          install -m 755 .build/session-propagation-native/longhouse-engine "$HOME/.local/bin/longhouse-engine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/longhouse" verify-pair
          "$HOME/.local/bin/longhouse" build-identity --json

      - name: Install provider CLI
        if: steps.selection.outputs.should_run == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          case "$PROVIDER" in
            codex) npm install --global @openai/codex@latest ;;
            claude) npm install --global @anthropic-ai/claude-code@latest ;;
            opencode) npm install --global opencode-ai@latest ;;
            cursor)
              curl https://cursor.com/install -fsS | bash
              cursor_bin="$(command -v cursor-agent || true)"
              if [[ -z "$cursor_bin" && -x "$HOME/.cursor/bin/cursor-agent" ]]; then
                cursor_bin="$HOME/.cursor/bin/cursor-agent"
              fi
              if [[ -z "$cursor_bin" && -x "$HOME/.local/bin/agent" ]]; then
                cursor_bin="$HOME/.local/bin/agent"
              fi
              [[ -n "$cursor_bin" ]]
              ln -sf "$cursor_bin" "$HOME/.local/bin/agent"
              ;;
          esac
          command -v "$([[ "$PROVIDER" == "cursor" ]] && echo agent || echo "$PROVIDER")"

      - name: Run session propagation SLA
        id: profiler
        if: steps.selection.outputs.should_run == 'true'
        run: |
          set +e
          ./scripts/ci/session-propagation-sla.sh
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.experimental }}" != "true" && ( "$code" == "1" || "$code" == "3" ) ]]; then
            exit 1
          fi
          if [[ "${{ matrix.experimental }}" == "true" && "$code" == "3" ]]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          summary="$SESSION_PROPAGATION_OUTPUT_ROOT/summary.md"
          {
            echo "## Session Propagation SLA"
            echo ""
            echo "- Case: \`$SESSION_PROPAGATION_SLA_CASE\`"
            echo "- Experimental: \`${{ matrix.experimental }}\`"
            echo "- Ran: \`${{ steps.selection.outputs.should_run || 'false' }}\`"
            echo "- Blocked reason: \`${{ steps.selection.outputs.blocked_reason || 'none' }}\`"
            echo "- Instance: \`$SESSION_PROPAGATION_SUBDOMAIN\`"
            echo "- Project: \`$SESSION_PROPAGATION_PROJECT\`"
            echo "- Exit code: \`${{ steps.profiler.outputs.exit_code || 'skipped' }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            if [[ -f "$summary" ]]; then
              cat "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profiler artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-propagation-sla-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SESSION_PROPAGATION_OUTPUT_ROOT }}
          if-no-files-found: ignore
          retention-days: 30
