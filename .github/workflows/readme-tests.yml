name: README Tests

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "packages/*/README.md"
      - "*/README.md"
      - "scripts/qa/run-readme-tests.py"
  schedule:
    # Nightly at 6am UTC — catches silent drift even without README changes
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode (smoke or full)"
        default: "smoke"
        required: false

jobs:
  readme-smoke:
    name: README smoke tests
    # Public repo: hosted runners are free, so this no longer holds a cube slot.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run readme-test blocks
        run: make test-readmes MODE=${{ github.event.inputs.mode || 'smoke' }}
