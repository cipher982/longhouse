name: README Tests

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "packages/*/README.md"
      - "*/README.md"
      - "scripts/qa/run-readme-tests.py"
  schedule:
    # Nightly at 6am UTC — catches silent drift even without README changes
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode (smoke or full)"
        default: "smoke"
        required: false

jobs:
  readme-smoke:
    name: README smoke tests
    runs-on: cube-fast
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run readme-test blocks
        run: make test-readmes MODE=${{ github.event.inputs.mode || 'smoke' }}
