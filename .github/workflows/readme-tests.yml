name: README Tests

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "packages/*/README.md"
      - "*/README.md"
      - "scripts/qa/run-readme-tests.py"
  schedule:
    # Nightly at 6am UTC — catches silent drift even without README changes
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode (smoke or full)"
        default: "smoke"
        required: false

jobs:
  readme-smoke:
    name: README smoke tests
    # Public repo: hosted runners are free, so this no longer holds a cube slot.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run readme-test blocks
        run: make test-readmes MODE=${{ github.event.inputs.mode || 'smoke' }}
