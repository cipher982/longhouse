name: Provider release weekly full columns

on:
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  matrix:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.matrix.outputs.providers }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - id: matrix
        run: |
          matrix=$(uv run --project server python scripts/qa/provider-release-schedule.py matrix)
          echo "providers=$(printf '%s' "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  full-column:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.providers) }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    name: ${{ matrix.provider }} unconditional full column
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Run unconditional provider column
        run: make provider-release-proof-universal-smoke UNIVERSAL_PROVIDER=${{ matrix.provider }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-release-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/canaries/provider-release-proof-universal-smoke/**
          if-no-files-found: error
          retention-days: 14
