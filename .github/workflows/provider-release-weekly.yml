name: Provider release weekly full columns

on:
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  matrix:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.matrix.outputs.providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - id: matrix
        run: |
          matrix=$(uv run --project server python scripts/qa/provider-release-schedule.py matrix)
          echo "providers=$(printf '%s' "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  full-column:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.providers) }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    name: ${{ matrix.provider }} unconditional full column
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run unconditional provider column
        run: make provider-release-proof-universal-smoke UNIVERSAL_PROVIDER=${{ matrix.provider }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-release-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/canaries/provider-release-proof-universal-smoke/**
          if-no-files-found: error
          retention-days: 14
