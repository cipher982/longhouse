name: Provider release weekly full columns

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  matrix:
    timeout-minutes: 30
    runs-on: crunch
    outputs:
      providers: ${{ steps.matrix.outputs.providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - id: matrix
        run: |
          matrix=$(uv run --project server python scripts/qa/provider-release-schedule.py matrix)
          echo "providers=$(printf '%s' "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  full-column:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.providers) }}
    runs-on: crunch
    continue-on-error: ${{ matrix.allow_failure }}
    name: ${{ matrix.provider }} unconditional full column
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run unconditional provider column
        # A block scalar: a plain multi-line scalar folds each backslash-newline
        # into backslash-space, so bash passed " --target" as one argument and
        # every run from 2026-08-10 died in argparse.
        run: |
          python3 scripts/qa/test-isolation.py \
            --target provider-release-proof-universal-smoke \
            --set "UNIVERSAL_PROVIDER=${{ matrix.provider }}"
