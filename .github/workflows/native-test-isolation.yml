# ROLE: credential-free native fixtures (iOS, mobile chat, simlab, packaging). No provider
# credentials may ever be added here.
name: Native test isolation
run-name: Native isolation ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact pushed source revision to test
        required: true
        type: string
      request_id:
        description: Unique dispatch receipt identity
        required: true
        type: string
      target:
        description: Credential-free native fixture target
        required: true
        type: choice
        options:
          - test-install
          - test-ios
          - test-ios-perf
          - test-ios-session-open
          - test-mobile-chat
          - test-mobile-chat-stress
          - test-runtime-packaging-macos
          - menubar-harness
          - simlab-run
          - test-e2e-onboarding
          - ios-ui-shot
          - ios-previews
          - benchmark-ios-transcript
      options_json:
        description: Explicit test selection options, never credentials
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

jobs:
  native:
    # The wisp bench Mac (a MacBook Neo that is a fixture machine, not a login): hosted macOS is
    # metered 10x for a private repository. Jobs run one at a time under the bench lock, in a
    # scratch HOME; scripts/qa/native-test-bootstrap.py refuses any other runner.
    runs-on: wisp
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ inputs.target == 'test-install' }}
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ inputs.target == 'simlab-run' || inputs.target == 'test-e2e-onboarding' || startsWith(inputs.target, 'test-mobile-chat') }}
        with:
          bun-version: "1.2.20"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05
        if: ${{ inputs.target == 'simlab-run' || inputs.target == 'test-install' }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: ${{ inputs.target == 'simlab-run' || inputs.target == 'test-e2e-onboarding' }}
      - name: Install XcodeGen
        # The menu bar harness needs it only for its XCUITest lane.
        if: ${{ (inputs.target != 'menubar-harness' || contains(inputs.options_json, '"xcuitest"')) && inputs.target != 'test-runtime-packaging-macos' && inputs.target != 'test-e2e-onboarding' && inputs.target != 'test-install' }}
        run: scripts/ci/install_xcodegen.sh
      - name: Run native fixtures in disposable VM
        env:
          NATIVE_TARGET: ${{ inputs.target }}
          NATIVE_OPTIONS_JSON: ${{ inputs.options_json }}
        run: python3 scripts/qa/native-test-bootstrap.py --target "$NATIVE_TARGET"
      - name: Keep isolated evidence on the runner
        # The dispatcher (scripts/qa/native-test-isolation.py) copies this directory back over ssh.
        # It is evidence about one run, so it stays on the machine that ran it, in /tmp, which
        # macOS ages out by itself.
        if: always()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p "/tmp/longhouse-native-evidence/$REQUEST_ID"
          cp -R "$RUNNER_TEMP/native-isolation-evidence/." "/tmp/longhouse-native-evidence/$REQUEST_ID/" || true
