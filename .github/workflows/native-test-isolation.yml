name: Native test isolation
run-name: Native isolation ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact pushed source revision to test
        required: true
        type: string
      request_id:
        description: Unique dispatch receipt identity
        required: true
        type: string
      target:
        description: Credential-free native fixture target
        required: true
        type: choice
        options:
          - test-ios
          - test-ios-perf
          - test-ios-session-open
          - test-mobile-chat
          - test-mobile-chat-stress
          - test-runtime-packaging-macos
          - menubar-harness
          - simlab-run
          - test-e2e-onboarding
          - ios-ui-shot
          - ios-previews
          - benchmark-ios-transcript
      options_json:
        description: Explicit test selection options, never credentials
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

jobs:
  native:
    # Standard public-repository runners: no billed larger runner or self-hosted Mac.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ inputs.target == 'simlab-run' || inputs.target == 'test-e2e-onboarding' || startsWith(inputs.target, 'test-mobile-chat') }}
        with:
          bun-version: "1.2.20"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05
        if: ${{ inputs.target == 'simlab-run' }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: ${{ inputs.target == 'simlab-run' || inputs.target == 'test-e2e-onboarding' }}
      - name: Install XcodeGen
        if: ${{ inputs.target != 'menubar-harness' && inputs.target != 'test-runtime-packaging-macos' && inputs.target != 'test-e2e-onboarding' }}
        run: brew install xcodegen
      - name: Run native fixtures in disposable VM
        env:
          NATIVE_TARGET: ${{ inputs.target }}
          NATIVE_OPTIONS_JSON: ${{ inputs.options_json }}
        run: python3 scripts/qa/native-test-bootstrap.py --target "$NATIVE_TARGET"
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-isolation-${{ inputs.request_id }}
          path: ${{ runner.temp }}/native-isolation-evidence
          if-no-files-found: ignore
          retention-days: 1
