name: WebSocket Code Drift Guard

on:
  pull_request:
    paths:
      - "schemas/**"
      - "scripts/generate/generate-ws-types-modern.py"
      - "Makefile"
      - ".github/workflows/ws-code-drift.yml"
  workflow_dispatch: {}

jobs:
  codegen-diff:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run drift check
        run: make validate-ws

      - name: Print note if diff detected (should not reach here)
        if: failure()
        run: |
          echo '❌ WebSocket generated code is out of sync with schemas/ws-protocol-asyncapi.yml.'
          echo '   Please run `make regen-ws` and commit the changes.'
