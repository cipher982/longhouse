name: Local Runtime Binary Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing git tag to publish from (for example v0.1.6)"
        required: true
        type: string
      notary_wait_timeout:
        description: "How long to wait for Apple notarization before failing (for example 330m)"
        required: false
        default: "330m"
        type: string

permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write

jobs:
  require-launch-reliability-attestation:
    name: Require source-bound launch qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      qualification_run_id: ${{ steps.resolve.outputs.qualification_run_id }}

    steps:
      - name: Classify release tier
        id: release_tier
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tier=stable" >> "$GITHUB_OUTPUT"
          else
            echo "tier=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Require protected-main dispatch for stable manual releases
        if: ${{ steps.release_tier.outputs.tier == 'stable' && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Stable manual releases must be dispatched from protected main." >&2
          exit 1

      - name: Checkout trusted gate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/main
          path: trusted-release-gate
          persist-credentials: false

      - name: Install the trusted gate runtime
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.10'
          checksum: '3e1027f26ce8c7e4c32e2277a7fed2cb410f2f1f9320d3df97653d40e21f415b'

      - name: Resolve and qualify the release source
        id: resolve
        working-directory: trusted-release-gate
        run: |
          args=(
            --repository "${{ github.repository }}"
            --release-tag "$RELEASE_TAG"
          )
          if [[ "${{ steps.release_tier.outputs.tier }}" != "stable" ]]; then
            args+=(--resolve-only)
          fi
          result="$(uv run --frozen --project server python scripts/ci/require-launch-reliability-attestation.py "${args[@]}")"
          release_sha="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["release_sha"])' "$result")"
          if [[ "${{ steps.release_tier.outputs.tier }}" == "stable" ]]; then
            comparison="$(gh api "repos/${{ github.repository }}/compare/main...$release_sha" --jq .status)"
            case "$comparison" in
              behind|identical) ;;
              *)
                echo "Qualified release source is not on protected main history: $comparison." >&2
                exit 1
                ;;
            esac
          fi
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.release_tier.outputs.tier }}" == "stable" ]]; then
            qualification_run_id="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["run_id"])' "$result")"
            printf 'qualification_run_id=%s\n' "$qualification_run_id" >> "$GITHUB_OUTPUT"
          fi

  build-engine-linux-x64:
    needs: require-launch-reliability-attestation
    permissions:
      contents: read
      actions: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      RELEASE_SHA: ${{ needs.require-launch-reliability-attestation.outputs.release_sha }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Generate build identity
        run: env -u GITHUB_SHA GITHUB_REF="refs/tags/${RELEASE_TAG}" python3 scripts/build/generate_build_identity.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libcap-dev

      - name: Build native device binaries
        run: cargo build --manifest-path engine/Cargo.toml --release --bin longhouse --bin longhouse-engine

      - name: Collect engine binary
        run: |
          mkdir -p binaries
          cp engine/target/release/longhouse binaries/longhouse-linux-x64
          cp engine/target/release/longhouse-engine binaries/longhouse-engine-linux-x64
          chmod +x binaries/longhouse-linux-x64
          chmod +x binaries/longhouse-engine-linux-x64

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v6
        with:
          name: runtime-longhouse-engine-linux-x64
          path: |
            binaries/longhouse-linux-x64
            binaries/longhouse-engine-linux-x64
          retention-days: 7

  build-engine-linux-arm64:
    needs: require-launch-reliability-attestation
    permissions:
      contents: read
      actions: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      RELEASE_SHA: ${{ needs.require-launch-reliability-attestation.outputs.release_sha }}
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Generate build identity
        run: env -u GITHUB_SHA GITHUB_REF="refs/tags/${RELEASE_TAG}" python3 scripts/build/generate_build_identity.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libcap-dev

      - name: Build native device binaries
        run: cargo build --manifest-path engine/Cargo.toml --release --bin longhouse --bin longhouse-engine

      - name: Collect engine binary
        run: |
          mkdir -p binaries
          cp engine/target/release/longhouse binaries/longhouse-linux-arm64
          cp engine/target/release/longhouse-engine binaries/longhouse-engine-linux-arm64
          chmod +x binaries/longhouse-linux-arm64
          chmod +x binaries/longhouse-engine-linux-arm64

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v6
        with:
          name: runtime-longhouse-engine-linux-arm64
          path: |
            binaries/longhouse-linux-arm64
            binaries/longhouse-engine-linux-arm64
          retention-days: 7

  build-macos:
    needs: require-launch-reliability-attestation
    permissions:
      contents: read
      actions: write
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      RELEASE_SHA: ${{ needs.require-launch-reliability-attestation.outputs.release_sha }}
      LONGHOUSE_NOTARY_WAIT_TIMEOUT: ${{ inputs.notary_wait_timeout || '330m' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Generate build identity
        run: env -u GITHUB_SHA GITHUB_REF="refs/tags/${RELEASE_TAG}" python3 scripts/build/generate_build_identity.py

      - name: Classify release tier
        id: release_tier
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tier=stable" >> "$GITHUB_OUTPUT"
          else
            echo "tier=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native device binaries
        run: cargo build --manifest-path engine/Cargo.toml --release --bin longhouse --bin longhouse-engine

      - name: Collect engine binary
        run: |
          mkdir -p binaries
          cp engine/target/release/longhouse binaries/longhouse-darwin-arm64
          cp engine/target/release/longhouse-engine binaries/longhouse-engine-darwin-arm64
          chmod +x binaries/longhouse-darwin-arm64
          chmod +x binaries/longhouse-engine-darwin-arm64

      - name: Build macOS ambient app payload
        run: |
          PRODUCT_PATH="$(scripts/resolve-swift-product-path.sh \
            --package-path desktop/LonghouseMenuBarHarness \
            --product LonghouseMenuBarHarnessMenuBar \
            --configuration release)"
          cp "$PRODUCT_PATH" "$RUNNER_TEMP/LonghouseMenuBarHarnessMenuBar"
          chmod +x "$RUNNER_TEMP/LonghouseMenuBarHarnessMenuBar"
          resource_bundle_count=0
          while IFS= read -r -d '' RESOURCE_BUNDLE; do
            cp -R "$RESOURCE_BUNDLE" "$RUNNER_TEMP/$(basename "$RESOURCE_BUNDLE")"
            resource_bundle_count=$((resource_bundle_count + 1))
          done < <(find "$(dirname "$PRODUCT_PATH")" -maxdepth 1 -type d -name '*.bundle' -print0)
          test "$resource_bundle_count" -gt 0 || {
            echo "The macOS menu-bar product has no resource bundle." >&2
            exit 1
          }

      - name: Configure macOS signing keychain
        id: macos_signing
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_TIER: ${{ steps.release_tier.outputs.tier }}
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${MACOS_SIGNING_CERT_P12_BASE64:-}" || -z "${MACOS_SIGNING_CERT_PASSWORD:-}" || -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            if [[ "${RELEASE_TIER}" == "stable" ]]; then
              echo "Stable macOS releases require Developer ID signing credentials." >&2
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "signing_mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "codesign_identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/longhouse-release-cert.p12"
          G2_CERT_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          KEYCHAIN_PATH="$RUNNER_TEMP/longhouse-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 18)"

          printf '%s' "$MACOS_SIGNING_CERT_P12_BASE64" | base64 -D -o "$CERT_PATH"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$G2_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security import "$G2_CERT_PATH" -k "$KEYCHAIN_PATH" -f x509 -t cert
          SEARCH_KEYCHAINS=(
            "$KEYCHAIN_PATH"
            "/System/Library/Keychains/SystemRootCertificates.keychain"
            "/Library/Keychains/System.keychain"
          )
          if [[ -f "$HOME/Library/Keychains/login.keychain-db" ]]; then
            SEARCH_KEYCHAINS+=("$HOME/Library/Keychains/login.keychain-db")
          fi
          security list-keychains -d user -s "${SEARCH_KEYCHAINS[@]}"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning | grep -F "$MACOS_SIGNING_IDENTITY" >/dev/null; then
            echo "Configured signing identity is not available in the signing keychain." >&2
            exit 1
          fi
          rm -f "$CERT_PATH" "$G2_CERT_PATH"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "signing_mode=developer-id" >> "$GITHUB_OUTPUT"
          echo "codesign_identity=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Configure notarytool profile
        id: macos_notary
        env:
          RELEASE_TIER: ${{ steps.release_tier.outputs.tier }}
          SIGNING_ENABLED: ${{ steps.macos_signing.outputs.enabled }}
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${MACOS_NOTARY_APPLE_ID:-}" || -z "${MACOS_NOTARY_TEAM_ID:-}" || -z "${MACOS_NOTARY_APP_PASSWORD:-}" ]]; then
            if [[ "${RELEASE_TIER}" == "stable" ]]; then
              echo "Stable macOS releases require notarization credentials." >&2
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          xcrun notarytool store-credentials "longhouse-notary" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "profile=longhouse-notary" >> "$GITHUB_OUTPUT"

      - name: Re-sign macOS runtime binaries for stable release
        if: ${{ steps.release_tier.outputs.tier == 'stable' && steps.macos_signing.outputs.enabled == 'true' }}
        env:
          CODESIGN_IDENTITY: ${{ steps.macos_signing.outputs.codesign_identity }}
        run: |
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$CODESIGN_IDENTITY" \
            binaries/longhouse-darwin-arm64
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$CODESIGN_IDENTITY" \
            binaries/longhouse-engine-darwin-arm64
          codesign --verify --strict --verbose=2 binaries/longhouse-darwin-arm64
          codesign --verify --strict --verbose=2 binaries/longhouse-engine-darwin-arm64

      - name: Package macOS desktop app bundle
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP_STAGE_DIR="$RUNNER_TEMP/macos-app-bundles"

          mkdir -p "$APP_STAGE_DIR"

          scripts/release/macos-package-app.sh \
            --binary "$RUNNER_TEMP/LonghouseMenuBarHarnessMenuBar" \
            --app-name Longhouse \
            --exec-name Longhouse \
            --bundle-id ai.longhouse.app \
            --version "$VERSION" \
            --short-version "$VERSION" \
            --output-dir "$APP_STAGE_DIR" \
            --icon-png web/public/favicon-512.png \
            --build-identity .build/build-identity.json \
            --lsuielement true

      - name: Verify packaged macOS resources
        run: |
          shopt -s nullglob
          staged_bundles=("$RUNNER_TEMP"/*.bundle)
          test "${#staged_bundles[@]}" -gt 0 || {
            echo "No staged Swift resource bundles were found." >&2
            exit 1
          }
          for staged_bundle in "${staged_bundles[@]}"; do
            packaged_bundle="$RUNNER_TEMP/macos-app-bundles/Longhouse.app/Contents/Resources/$(basename "$staged_bundle")"
            test -d "$packaged_bundle" || {
              echo "Packaged app is missing resource bundle: $packaged_bundle" >&2
              exit 1
            }
            for required_file in LonghouseMenuIcon.png desktop-app-setup.sh; do
              test -f "$packaged_bundle/$required_file" || {
                echo "Packaged resource bundle is missing $required_file: $packaged_bundle" >&2
                exit 1
              }
            done
          done

      - name: Sign macOS desktop app bundle
        env:
          RELEASE_TIER: ${{ steps.release_tier.outputs.tier }}
          SIGNING_MODE: ${{ steps.macos_signing.outputs.signing_mode }}
          CODESIGN_IDENTITY: ${{ steps.macos_signing.outputs.codesign_identity }}
        run: |
          if [[ "$RELEASE_TIER" == "stable" && "$SIGNING_MODE" != "developer-id" ]]; then
            echo "Stable macOS releases require Developer ID signing mode." >&2
            exit 1
          fi

          scripts/release/macos-sign-app.sh \
            --app "$RUNNER_TEMP/macos-app-bundles/Longhouse.app" \
            --identity "$CODESIGN_IDENTITY" \
            --mode "$SIGNING_MODE"

      - name: Launch-test signed macOS app bundle
        run: |
          python3 - \
            "$RUNNER_TEMP/macos-app-bundles/Longhouse.app" \
            "desktop/LonghouseMenuBarHarness/Fixtures/healthy.json" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          app_path = Path(sys.argv[1])
          fixture_path = Path(sys.argv[2])
          executable = app_path / "Contents" / "MacOS" / "Longhouse"
          if not executable.exists():
              raise SystemExit(f"Missing packaged executable: {executable}")
          try:
              completed = subprocess.run(
                  [str(executable), "--input", str(fixture_path), "--quit-after", "1"],
                  capture_output=True,
                  text=True,
                  timeout=10,
              )
          except subprocess.TimeoutExpired as exc:
              raise SystemExit(f"Signed macOS app launch smoke timed out: {exc}") from exc
          if completed.returncode != 0:
              raise SystemExit(
                  "Signed macOS app launch smoke failed:\n"
                  f"exit={completed.returncode}\n"
                  f"stdout={completed.stdout}\n"
                  f"stderr={completed.stderr}"
              )
          PY

      - name: Initialize macOS packaging manifest
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_TIER: ${{ steps.release_tier.outputs.tier }}
          SIGNING_MODE: ${{ steps.macos_signing.outputs.signing_mode }}
          NOTARY_ENABLED: ${{ steps.macos_notary.outputs.enabled }}
          NOTARY_PROFILE: ${{ steps.macos_notary.outputs.profile }}
          LONGHOUSE_NOTARY_WAIT_TIMEOUT: ${{ env.LONGHOUSE_NOTARY_WAIT_TIMEOUT }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          AMBIENT_APP_PATH="$RUNNER_TEMP/macos-app-bundles/Longhouse.app"
          DESKTOP_RUNTIME_ARCHIVE="binaries/Longhouse-macos-arm64.zip"
          PUBLIC_DMG_ARCHIVE="binaries/Longhouse-macos-arm64.dmg"

          if [[ "$RELEASE_TIER" == "stable" && ( "$NOTARY_ENABLED" != "true" || -z "${NOTARY_PROFILE:-}" ) ]]; then
            echo "Stable macOS releases require notarization." >&2
            exit 1
          fi

          NOTARIZATION_STATUS="not-configured"
          PUBLIC_DOWNLOAD_NOTARIZATION_STATUS="not-configured"
          if [[ "$NOTARY_ENABLED" == "true" ]]; then
            NOTARIZATION_STATUS="awaiting-submission"
            PUBLIC_DOWNLOAD_NOTARIZATION_STATUS="awaiting-build"
          else
            ditto -c -k --sequesterRsrc --keepParent "$AMBIENT_APP_PATH" "$DESKTOP_RUNTIME_ARCHIVE"
          fi

          NOTARIZATION_STATUS="$NOTARIZATION_STATUS" \
          PUBLIC_DOWNLOAD_NOTARIZATION_STATUS="$PUBLIC_DOWNLOAD_NOTARIZATION_STATUS" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 3,
              "release_tag": os.environ["RELEASE_TAG"],
              "release_tier": os.environ["RELEASE_TIER"],
              "version": os.environ["RELEASE_TAG"].removeprefix("v"),
              "signing_mode": os.environ["SIGNING_MODE"],
              "notarization_status": os.environ["NOTARIZATION_STATUS"],
              "public_download_notarization_status": os.environ["PUBLIC_DOWNLOAD_NOTARIZATION_STATUS"],
              "notary_wait_timeout": os.environ["LONGHOUSE_NOTARY_WAIT_TIMEOUT"],
              "notarization_submission_id": None,
              "public_download_submission_id": None,
              "artifacts": [
                  {
                      "component": "desktop-app",
                      "bundle_id": "ai.longhouse.app",
                      "app_name": "Longhouse",
                      "app_archive": "Longhouse-macos-arm64.zip",
                      "disk_image": "Longhouse-macos-arm64.dmg",
                  }
              ],
          }
          Path("binaries/local-runtime-macos-packaging.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
        shell: bash

      - name: Submit macOS app for notarization
        if: ${{ steps.macos_notary.outputs.enabled == 'true' }}
        env:
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
          NOTARY_PROFILE: ${{ steps.macos_notary.outputs.profile }}
        run: |
          SUBMISSION_FILE="$RUNNER_TEMP/local-runtime-macos-notary-submission.txt"
          scripts/release/macos-notarize-app.sh \
            --app "$RUNNER_TEMP/macos-app-bundles/Longhouse.app" \
            --archive binaries/Longhouse-macos-arm64.zip \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --submission-id-file "$SUBMISSION_FILE" \
            --submit-only

          SUBMISSION_ID="$(cat "$SUBMISSION_FILE")"
          SUBMISSION_ID="$SUBMISSION_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("binaries/local-runtime-macos-packaging.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload["notarization_status"] = "submitted"
          payload["notarization_submission_id"] = os.environ["SUBMISSION_ID"]
          manifest_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Wait for Apple notarization and staple app
        if: ${{ steps.macos_notary.outputs.enabled == 'true' }}
        env:
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
          NOTARY_PROFILE: ${{ steps.macos_notary.outputs.profile }}
        run: |
          SUBMISSION_ID="$(cat "$RUNNER_TEMP/local-runtime-macos-notary-submission.txt")"
          scripts/release/macos-notarize-app.sh \
            --app "$RUNNER_TEMP/macos-app-bundles/Longhouse.app" \
            --archive binaries/Longhouse-macos-arm64.zip \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --submission-id "$SUBMISSION_ID"

      - name: Mark macOS notarization complete
        if: ${{ success() && steps.macos_notary.outputs.enabled == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("binaries/local-runtime-macos-packaging.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload["notarization_status"] = "notarized"
          manifest_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Mark macOS notarization pending
        if: ${{ failure() && steps.macos_notary.outputs.enabled == 'true' }}
        run: |
          if [[ ! -f binaries/local-runtime-macos-packaging.json ]]; then
            exit 0
          fi

          SUBMISSION_ID=""
          if [[ -f "$RUNNER_TEMP/local-runtime-macos-notary-submission.txt" ]]; then
            SUBMISSION_ID="$(cat "$RUNNER_TEMP/local-runtime-macos-notary-submission.txt")"
          fi

          SUBMISSION_ID="$SUBMISSION_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("binaries/local-runtime-macos-packaging.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload["notarization_status"] = "pending-apple"
          if os.environ["SUBMISSION_ID"]:
              payload["notarization_submission_id"] = os.environ["SUBMISSION_ID"]
          manifest_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build public macOS disk image
        env:
          SIGNING_MODE: ${{ steps.macos_signing.outputs.signing_mode }}
          CODESIGN_IDENTITY: ${{ steps.macos_signing.outputs.codesign_identity }}
        run: |
          PUBLIC_DMG_ARCHIVE="binaries/Longhouse-macos-arm64.dmg"

          scripts/release/macos-package-dmg.sh \
            --app "$RUNNER_TEMP/macos-app-bundles/Longhouse.app" \
            --output "$PUBLIC_DMG_ARCHIVE"

          scripts/release/macos-sign-disk-image.sh \
            --dmg "$PUBLIC_DMG_ARCHIVE" \
            --identity "$CODESIGN_IDENTITY" \
            --mode "$SIGNING_MODE"

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("binaries/local-runtime-macos-packaging.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          if payload.get("public_download_notarization_status") == "awaiting-build":
              payload["public_download_notarization_status"] = "awaiting-submission"
          manifest_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Launch-test packaged macOS disk image
        run: |
          MOUNT_INFO="$(hdiutil attach -nobrowse -readonly -plist binaries/Longhouse-macos-arm64.dmg)"
          MOUNT_DEVICE="$(MOUNT_INFO="$MOUNT_INFO" python3 - <<'PY'
          import os
          import plistlib

          payload = plistlib.loads(os.environ["MOUNT_INFO"].encode())
          for entity in payload.get("system-entities") or []:
              device = entity.get("dev-entry")
              if device:
                  print(device)
                  break
          else:
              raise SystemExit("Unable to determine attached DMG device")
          PY
          )"
          MOUNT_POINT=""
          cleanup() {
            if [[ -n "$MOUNT_POINT" ]]; then
              hdiutil detach "$MOUNT_POINT" >/dev/null || hdiutil detach "$MOUNT_DEVICE" >/dev/null || true
            else
              hdiutil detach "$MOUNT_DEVICE" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          MOUNT_POINT="$(MOUNT_INFO="$MOUNT_INFO" python3 - <<'PY'
          import os
          import plistlib

          payload = plistlib.loads(os.environ["MOUNT_INFO"].encode())
          for entity in payload.get("system-entities") or []:
              mount_point = entity.get("mount-point")
              if mount_point:
                  print(mount_point)
                  break
          else:
              raise SystemExit("Unable to determine mounted DMG path")
          PY
          )"
          python3 - \
            "$MOUNT_POINT/Longhouse.app" \
            "desktop/LonghouseMenuBarHarness/Fixtures/healthy.json" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          app_path = Path(sys.argv[1])
          fixture_path = Path(sys.argv[2])
          executable = app_path / "Contents" / "MacOS" / "Longhouse"
          if not executable.exists():
              raise SystemExit(f"Missing DMG executable: {executable}")
          try:
              completed = subprocess.run(
                  [str(executable), "--input", str(fixture_path), "--quit-after", "1"],
                  capture_output=True,
                  text=True,
                  timeout=10,
              )
          except subprocess.TimeoutExpired as exc:
              raise SystemExit(f"Packaged DMG launch smoke timed out: {exc}") from exc
          if completed.returncode != 0:
              raise SystemExit(
                  "Packaged DMG launch smoke failed:\n"
                  f"exit={completed.returncode}\n"
                  f"stdout={completed.stdout}\n"
                  f"stderr={completed.stderr}"
              )
          PY

      - name: Submit macOS disk image for notarization
        if: ${{ steps.macos_notary.outputs.enabled == 'true' }}
        env:
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
          NOTARY_PROFILE: ${{ steps.macos_notary.outputs.profile }}
        run: |
          SUBMISSION_FILE="$RUNNER_TEMP/local-runtime-macos-dmg-notary-submission.txt"
          scripts/release/macos-notarize-file.sh \
            --file binaries/Longhouse-macos-arm64.dmg \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --submission-id-file "$SUBMISSION_FILE" \
            --submit-only

          SUBMISSION_ID="$(cat "$SUBMISSION_FILE")"
          SUBMISSION_ID="$SUBMISSION_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("binaries/local-runtime-macos-packaging.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload["public_download_notarization_status"] = "submitted"
          payload["public_download_submission_id"] = os.environ["SUBMISSION_ID"]
          manifest_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Wait for Apple notarization and staple disk image
        if: ${{ steps.macos_notary.outputs.enabled == 'true' }}
        env:
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
          NOTARY_PROFILE: ${{ steps.macos_notary.outputs.profile }}
        run: |
          SUBMISSION_ID="$(cat "$RUNNER_TEMP/local-runtime-macos-dmg-notary-submission.txt")"
          scripts/release/macos-notarize-file.sh \
            --file binaries/Longhouse-macos-arm64.dmg \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --submission-id "$SUBMISSION_ID" \
            --staple binaries/Longhouse-macos-arm64.dmg

      - name: Mark macOS disk image notarization complete
        if: ${{ success() && steps.macos_notary.outputs.enabled == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("binaries/local-runtime-macos-packaging.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload["public_download_notarization_status"] = "notarized"
          manifest_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate final macOS release artifacts
        env:
          RELEASE_TIER: ${{ steps.release_tier.outputs.tier }}
        run: |
          APP_PATH="$RUNNER_TEMP/macos-app-bundles/Longhouse.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          if [[ "$RELEASE_TIER" == "stable" ]]; then
            codesign --verify --strict --verbose=2 binaries/Longhouse-macos-arm64.dmg
            spctl --assess --type execute --verbose=4 "$APP_PATH"
            spctl --assess --type open --context context:primary-signature --verbose=4 binaries/Longhouse-macos-arm64.dmg
            xcrun stapler validate "$APP_PATH"
            xcrun stapler validate binaries/Longhouse-macos-arm64.dmg
          fi
          python3 - "$APP_PATH" "desktop/LonghouseMenuBarHarness/Fixtures/healthy.json" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          app_path = Path(sys.argv[1])
          fixture_path = Path(sys.argv[2])
          executable = app_path / "Contents" / "MacOS" / "Longhouse"
          try:
              completed = subprocess.run(
                  [str(executable), "--input", str(fixture_path), "--quit-after", "1"],
                  capture_output=True,
                  text=True,
                  timeout=10,
              )
          except subprocess.TimeoutExpired as exc:
              raise SystemExit(f"Final macOS app launch smoke timed out: {exc}") from exc
          if completed.returncode != 0:
              raise SystemExit(
                  "Final macOS app launch smoke failed:\n"
                  f"exit={completed.returncode}\n"
                  f"stdout={completed.stdout}\n"
                  f"stderr={completed.stderr}"
              )
          PY

          MOUNT_INFO="$(hdiutil attach -nobrowse -readonly -plist binaries/Longhouse-macos-arm64.dmg)"
          MOUNT_DEVICE="$(MOUNT_INFO="$MOUNT_INFO" python3 - <<'PY'
          import os
          import plistlib

          payload = plistlib.loads(os.environ["MOUNT_INFO"].encode())
          for entity in payload.get("system-entities") or []:
              device = entity.get("dev-entry")
              if device:
                  print(device)
                  break
          else:
              raise SystemExit("Unable to determine attached final DMG device")
          PY
          )"
          MOUNT_POINT=""
          cleanup() {
            if [[ -n "$MOUNT_POINT" ]]; then
              hdiutil detach "$MOUNT_POINT" || hdiutil detach "$MOUNT_DEVICE" || true
            else
              hdiutil detach "$MOUNT_DEVICE" || true
            fi
          }
          trap cleanup EXIT
          MOUNT_POINT="$(MOUNT_INFO="$MOUNT_INFO" python3 - <<'PY'
          import os
          import plistlib

          payload = plistlib.loads(os.environ["MOUNT_INFO"].encode())
          for entity in payload.get("system-entities") or []:
              mount_point = entity.get("mount-point")
              if mount_point:
                  print(mount_point)
                  break
          else:
              raise SystemExit("Unable to determine mounted final DMG path")
          PY
          )"
          if [[ "$RELEASE_TIER" == "stable" ]]; then
            spctl --assess --type execute --verbose=4 "$MOUNT_POINT/Longhouse.app"
          fi
          python3 - "$MOUNT_POINT/Longhouse.app" "desktop/LonghouseMenuBarHarness/Fixtures/healthy.json" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          app_path = Path(sys.argv[1])
          fixture_path = Path(sys.argv[2])
          executable = app_path / "Contents" / "MacOS" / "Longhouse"
          try:
              completed = subprocess.run(
                  [str(executable), "--input", str(fixture_path), "--quit-after", "1"],
                  capture_output=True,
                  text=True,
                  timeout=10,
              )
          except subprocess.TimeoutExpired as exc:
              raise SystemExit(f"Final DMG launch smoke timed out: {exc}") from exc
          if completed.returncode != 0:
              raise SystemExit(
                  "Final DMG launch smoke failed:\n"
                  f"exit={completed.returncode}\n"
                  f"stdout={completed.stdout}\n"
                  f"stderr={completed.stderr}"
              )
          PY

      - name: Mark macOS disk image notarization pending
        if: ${{ failure() && steps.macos_notary.outputs.enabled == 'true' }}
        run: |
          if [[ ! -f binaries/local-runtime-macos-packaging.json ]]; then
            exit 0
          fi

          SUBMISSION_ID=""
          if [[ -f "$RUNNER_TEMP/local-runtime-macos-dmg-notary-submission.txt" ]]; then
            SUBMISSION_ID="$(cat "$RUNNER_TEMP/local-runtime-macos-dmg-notary-submission.txt")"
          fi

          SUBMISSION_ID="$SUBMISSION_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("binaries/local-runtime-macos-packaging.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload["public_download_notarization_status"] = "pending-apple"
          if os.environ["SUBMISSION_ID"]:
              payload["public_download_submission_id"] = os.environ["SUBMISSION_ID"]
          manifest_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove temporary signing keychain
        if: ${{ always() && steps.macos_signing.outputs.enabled == 'true' }}
        env:
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload runtime artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: runtime-macos
          if-no-files-found: ignore
          path: binaries/*
          retention-days: 7

  release:
    needs:
      - build-engine-linux-x64
      - build-macos
      - require-launch-reliability-attestation
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      EXPECTED_RELEASE_SHA: ${{ needs.require-launch-reliability-attestation.outputs.release_sha }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write

    steps:
      - name: Classify release tier
        id: release_tier
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tier=stable" >> "$GITHUB_OUTPUT"
          else
            echo "tier=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS runtime artifacts
        uses: actions/download-artifact@v5
        with:
          path: binaries
          name: runtime-macos

      - name: Download linux x64 runtime artifacts
        uses: actions/download-artifact@v5
        with:
          path: binaries
          name: runtime-longhouse-engine-linux-x64

      - name: List runtime artifacts
        run: ls -la binaries

      - name: Assert release tag still points to the qualified source
        run: |
          actual_sha="$(gh api "repos/${{ github.repository }}/commits/${RELEASE_TAG}" --jq .sha)"
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA" || {
            echo "Release tag moved after qualification: expected $EXPECTED_RELEASE_SHA, got $actual_sha." >&2
            exit 1
          }

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum * > local-runtime-checksums.txt

      - name: Assert stable macOS trust metadata
        if: ${{ steps.release_tier.outputs.tier == 'stable' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("binaries/local-runtime-macos-packaging.json").read_text())
          if payload.get("signing_mode") != "developer-id":
              raise SystemExit(f"Expected developer-id signing, got {payload.get('signing_mode')!r}")
          if payload.get("notarization_status") != "notarized":
              raise SystemExit(
                  f"Expected notarized macOS packaging, got {payload.get('notarization_status')!r}"
              )
          if payload.get("public_download_notarization_status") != "notarized":
              raise SystemExit(
                  "Expected notarized public macOS disk image, "
                  f"got {payload.get('public_download_notarization_status')!r}"
              )
          PY

      - name: Upload runtime assets to release
        run: gh release upload "$RELEASE_TAG" binaries/* --clobber --repo "${{ github.repository }}"

      - name: Attest runtime release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            binaries/longhouse-engine-darwin-arm64
            binaries/longhouse-darwin-arm64
            binaries/longhouse-engine-linux-x64
            binaries/longhouse-linux-x64
            binaries/Longhouse-macos-arm64.dmg
            binaries/Longhouse-macos-arm64.zip
            binaries/local-runtime-macos-packaging.json
            binaries/local-runtime-checksums.txt

  release-attach-arm64:
    needs:
      - release
      - require-launch-reliability-attestation
      - build-engine-linux-arm64
    if: ${{ needs.build-engine-linux-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      EXPECTED_RELEASE_SHA: ${{ needs.require-launch-reliability-attestation.outputs.release_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download linux arm64 runtime artifact
        uses: actions/download-artifact@v5
        with:
          name: runtime-longhouse-engine-linux-arm64
          path: binaries

      - name: List arm64 artifacts
        run: ls -la binaries

      - name: Assert release tag still points to the qualified source
        run: |
          actual_sha="$(gh api "repos/${{ github.repository }}/commits/${RELEASE_TAG}" --jq .sha)"
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA" || {
            echo "Release tag moved before arm64 publication: expected $EXPECTED_RELEASE_SHA, got $actual_sha." >&2
            exit 1
          }

      - name: Add arm64 checksums to the release manifest
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern local-runtime-checksums.txt \
            --dir binaries \
            --repo "${{ github.repository }}"
          cd binaries
          sha256sum longhouse-linux-arm64 longhouse-engine-linux-arm64 >> local-runtime-checksums.txt

      - name: Upload arm64 assets to release
        run: gh release upload "$RELEASE_TAG" binaries/longhouse-linux-arm64 binaries/longhouse-engine-linux-arm64 binaries/local-runtime-checksums.txt --clobber --repo "${{ github.repository }}"

      - name: Attest arm64 release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            binaries/longhouse-engine-linux-arm64
            binaries/longhouse-linux-arm64
            binaries/local-runtime-checksums.txt

  verify-install-from-release:
    name: "verify-install-from-release--${{ matrix.os }}"
    needs:
      - release
    if: ${{ github.event.release.tag_name != '' || inputs.tag_name != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install longhouse wheel from the published release
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --pattern 'longhouse-*-py3-none-any.whl' \
            --dir "$work" \
            --repo "${{ github.repository }}"
          wheel="$(ls "$work"/longhouse-*-py3-none-any.whl | head -1)"
          echo "Installing $wheel"
          uv tool install --force --no-cache "$wheel"
          echo "LONGHOUSE_VERIFY_WHEEL=$wheel" >> "$GITHUB_ENV"

      - name: Verify installed CLI version matches release tag
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          version_line="$(longhouse-server --version 2>&1 | tail -1)"
          actual="$(awk '{print $2}' <<< "$version_line")"
          echo "expected=$expected actual=$actual line=$version_line"
          if [[ "$actual" != "$expected" ]]; then
            echo "CLI version mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

      - name: Verify installed CLI build identity matches release commit
        run: |
          set -euo pipefail
          expected_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          python3 scripts/ci/assert-installed-build-identity.py \
            --expected-commit "$expected_commit" \
            --expected-version "${RELEASE_TAG#v}" \
            --longhouse-bin longhouse-server

      - name: Fetch engine binary from the same release via the installed wheel
        env:
          LONGHOUSE_SKIP_UPDATE_NOTIFIER: '1'
        run: |
          set -euo pipefail
          LONGHOUSE_VERIFY_HOME="$RUNNER_TEMP/longhouse-verify-home"
          rm -rf "$LONGHOUSE_VERIFY_HOME"
          mkdir -p "$LONGHOUSE_VERIFY_HOME"
          export HOME="$LONGHOUSE_VERIFY_HOME"
          expected_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          # Drive the wheel's own runtime-artifact fetcher. This proves the
          # engine URL derived from the wheel's version resolves to the exact
          # build identity expected for this release.
          uv tool run --from "$LONGHOUSE_VERIFY_WHEEL" python scripts/ci/runtime-artifact-smoke.py \
            --component engine \
            --overwrite \
            --expected-build-commit "$expected_commit" \
            --expected-build-version "${RELEASE_TAG#v}"

      - name: Assert engine binary is executable
        run: |
          set -euo pipefail
          LONGHOUSE_VERIFY_HOME="$RUNNER_TEMP/longhouse-verify-home"
          engine="$LONGHOUSE_VERIFY_HOME/.local/bin/longhouse-engine"
          if [[ ! -x "$engine" ]]; then
            echo "engine binary missing or not executable at $engine" >&2
            ls -la "$(dirname "$engine")" || true
            exit 1
          fi
          "$engine" --version
