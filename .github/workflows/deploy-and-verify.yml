name: Deploy and Verify

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - 'bun.lock'
      - 'package.json'
      - 'e2e/package.json'
      - 'runner/package.json'
      - 'config/**'
      - 'docker/entrypoint.sh'
      - 'docker/runtime.dockerfile'
      - 'engine/**'
      - 'schemas/**'
      - 'server/**'
      - 'web/**'
      # video/src is a web-runtime input: the landing hero imports the demo
      # script + recordings from @longhouse/video (workspace source).
      - 'video/src/**'
      - 'video/scripts/**'
      - 'video/package.json'
      - 'scripts/ci/setup-deploy-ssh.sh'
      - 'scripts/ci/wait-for-http.sh'
      - 'scripts/lib/hosted-instance.sh'
      - 'scripts/ops/runtime-deploy.sh'
      - 'deploy/zerg/**'
      - 'scripts/qa/**'
      - '.github/actions/wait-for-ci/**'
      - 'scripts/ops/runtime-schema.py'
      - 'scripts/ops/release-artifacts.py'
      - '.github/workflows/deploy-and-verify.yml'
      - '.github/workflows/runtime-image.yml'
  workflow_dispatch:
    inputs:
      runtime_image_tag:
        description: "Override runtime image tag for manual deploys (defaults to the current SHA)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  # Each exact source SHA has its own durable deployment graph, ordered by its
  # publishing run number. Pushes to main share one group: a running deploy
  # always finishes, and only the newest queued one waits behind it, because a
  # newer main commit contains every older one. A deploy whose prerequisites
  # were dropped for a newer commit stands down green (see the gate's
  # "Stand down if a newer main commit superseded this one" step).
  group: deploy-${{ github.repository }}-${{ github.event_name == 'push' && 'main' || github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    timeout-minutes: 10
    runs-on: cube-fast
    name: "Detect runtime deploy scope"
    outputs:
      deploy_verify: ${{ steps.decide.outputs.deploy_verify }}
      runtime_image: ${{ steps.decide.outputs.runtime_image }}
      no_runtime_change: ${{ steps.decide.outputs.no_runtime_change }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ github.event_name == 'push' }}
        id: filter
        with:
          filters: .github/path-filters.yml
      - name: Resolve runtime deploy scope
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            candidate_deploy="${{ steps.filter.outputs.deploy_verify }}"
            candidate_image="${{ steps.filter.outputs.runtime_image }}"
            if [[ "$candidate_deploy" == "true" && "$candidate_image" != "true" ]]; then
              {
                echo "deploy_verify=false"
                echo "runtime_image=false"
                echo "no_runtime_change=true"
              } >> "$GITHUB_OUTPUT"
              echo "::notice::No runtime image changed; this workflow records no-runtime-mutation and does not deploy mutable latest."
            else
              {
                echo "deploy_verify=$candidate_deploy"
                echo "runtime_image=$candidate_image"
                echo "no_runtime_change=false"
              } >> "$GITHUB_OUTPUT"
            fi
          else
            {
              echo "deploy_verify=true"
              echo "runtime_image=true"
              echo "no_runtime_change=false"
            } >> "$GITHUB_OUTPUT"
          fi

  no_runtime_change:
    name: "No runtime mutation required"
    runs-on: cube-gate
    needs: changes
    if: ${{ needs.changes.outputs.no_runtime_change == 'true' }}
    steps:
      - name: Record explicit disposition
        run: |
          {
            echo "## Runtime Deploy Disposition"
            echo ""
            echo "No runtime image changed for this SHA; no hosted mutation was submitted."
            echo "The mutable \`latest\` tag was not used as a release artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    # Source qualification and publication each get 45m of waiting, and they
    # run independently, so this job must outlast their sum plus metadata
    # resolution. It was 75m against a 20m source wait; on 2026-09-18 the
    # core-E2E gate alone burned its 20m budget while `Core E2E tests` was
    # still queued behind other runs and then ran 15m, so every `Deploy and
    # Verify` from 14:20 onward failed and nothing deployed. A job timeout
    # below the waits inside it is how the gate kills itself mid-wait.
    timeout-minutes: 120
    name: "Resolve exact-SHA deploy metadata"
    # Waiting on CI and image publication must not occupy the two runners
    # reserved for actual canary/demo mutation. This gate still needs Docker
    # once the prerequisites finish to inspect the immutable image identity.
    runs-on: cube-gate
    needs: changes
    if: ${{ needs.changes.outputs.deploy_verify == 'true' }}
    outputs:
      superseded_by: ${{ steps.superseded.outputs.by }}
      predecessor_sha: ${{ steps.meta.outputs.predecessor_sha }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      head_branch: ${{ steps.meta.outputs.head_branch }}
      runtime_image_name: ${{ steps.meta.outputs.runtime_image_name }}
      runtime_image_tag: ${{ steps.meta.outputs.runtime_image_tag }}
      runtime_image_ref: ${{ steps.digest.outputs.image_ref }}
      runtime_image_digest: ${{ steps.digest.outputs.image_digest }}
      runtime_source_sha: ${{ steps.artifact_schema.outputs.source_sha }}
      runtime_build_identity: ${{ steps.identity.outputs.build_identity }}
      runtime_source_order: ${{ steps.source.outputs.source_order }}
      runtime_source_run_id: ${{ steps.source.outputs.source_run_id }}
      runtime_source_attempt: ${{ steps.source.outputs.source_attempt }}
      runtime_source_workflow: ${{ steps.source.outputs.source_workflow }}
      runtime_qualification_id: ${{ steps.source.outputs.qualification_id }}
      runtime_schema_version: ${{ steps.artifact_schema.outputs.schema_version }}
      runtime_schema_min_reader: ${{ steps.artifact_schema.outputs.schema_min_reader }}
      runtime_schema_max_reader: ${{ steps.artifact_schema.outputs.schema_max_reader }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            .github/actions
            scripts/lib/hosted-instance.sh
            scripts/ops/release-artifacts.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1



      - name: Resolve target commit
        id: meta
        run: |
          HEAD_SHA="${{ github.sha }}"
          HEAD_BRANCH="${{ github.ref_name }}"
          PREDECESSOR_SHA=""
          IMAGE_TAG=""

          if [[ "${{ github.event_name }}" == "push" ]]; then
            PREDECESSOR_SHA="${{ github.event.before }}"
            if [[ "$PREDECESSOR_SHA" =~ ^0+$ ]]; then
              PREDECESSOR_SHA=""
            fi
          else
            IMAGE_TAG="${{ github.event.inputs.runtime_image_tag || '' }}"
            if [[ -z "$IMAGE_TAG" ]]; then
              IMAGE_TAG="$HEAD_SHA"
            fi
            # A manual override selects its own immutable source. Every
            # downstream checkout and gate must use that same source rather
            # than silently qualifying the workflow dispatch commit.
            HEAD_SHA="$IMAGE_TAG"
            HEAD_BRANCH=""
          fi

          if [[ -z "$IMAGE_TAG" ]]; then
            if [[ "${{ needs.changes.outputs.runtime_image }}" != "true" ]]; then
              echo "No immutable runtime artifact is available for this SHA; no-runtime-change must remain mutation-free." >&2
              exit 1
            fi
            IMAGE_TAG="$HEAD_SHA"
          fi
          [[ "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Runtime image tag must be a full source SHA: $IMAGE_TAG" >&2
            exit 1
          }

          {
            echo "predecessor_sha=$PREDECESSOR_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "head_branch=$HEAD_BRANCH"
            echo "runtime_image_name=ghcr.io/${{ github.repository_owner }}/longhouse-runtime"
            echo "runtime_image_tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the suites that can invalidate this deploy
        id: wait_suites
        if: ${{ needs.changes.outputs.runtime_image == 'true' && vars.DEPLOY_WAIT_FULL_CI != 'true' }}
        uses: ./.github/actions/wait-for-ci
        with:
          head_sha: ${{ steps.meta.outputs.runtime_image_tag }}
          superseded_branch: ${{ github.event_name == 'push' && github.ref_name || '' }}
          # The action's 20m default is shorter than a queued run: on 2026-09-18
          # `Core E2E tests` took 15m of runtime but only started ~20m after the
          # push, so the gate expired first and reported a timeout against a job
          # that was still healthy.
          timeout_seconds: "2700"
          github_token: ${{ github.token }}
          event: ""
          # A deploy waits on the suites whose failure would make *this* image
          # wrong. Browser E2E, accessibility, model smoke and onboarding smoke
          # verify after the fact -- hosted live QA is dispatched below -- and
          # must not hold a deploy: on 2026-09-24 an unrelated E2E red stalled
          # this gate for 30m41s and then failed it with no runtime mutation.
          # Path detection and fixture publication are prerequisites for every
          # filtered suite; a failed prerequisite cannot turn skipped tests green.
          required_jobs: Changed paths,Prepare immutable fixture image,Backend tests,Engine tests,Frontend + runner tests
          ignored_failure_jobs: Core E2E tests,Accessibility E2E tests,Model smoke tests,OSS onboarding smoke

      - name: Wait for full CI gate (temporary opt-in)
        id: wait_full
        if: ${{ needs.changes.outputs.runtime_image == 'true' && vars.DEPLOY_WAIT_FULL_CI == 'true' }}
        uses: ./.github/actions/wait-for-ci
        with:
          head_sha: ${{ steps.meta.outputs.runtime_image_tag }}
          superseded_branch: ${{ github.event_name == 'push' && github.ref_name || '' }}
          github_token: ${{ github.token }}
          event: ""
          required_jobs: Changed paths,Prepare immutable fixture image,Backend tests,Engine tests,Core E2E tests,Accessibility E2E tests,CLI wheel packaging
          ignored_failure_jobs: OSS onboarding smoke

      - name: Wait for exact runtime image publication
        id: wait_image
        if: ${{ needs.changes.outputs.runtime_image == 'true' && steps.wait_suites.outputs.superseded_by == '' && steps.wait_full.outputs.superseded_by == '' }}
        uses: ./.github/actions/wait-for-ci
        with:
          head_sha: ${{ steps.meta.outputs.runtime_image_tag }}
          superseded_branch: ${{ github.event_name == 'push' && github.ref_name || '' }}
          github_token: ${{ github.token }}
          workflow_id: runtime-image.yml
          event: ""
          timeout_seconds: "2700"

      # main CI drops queued runs for commits that are no longer main's head
      # (one concurrency group per branch), because only the newest verified
      # commit deploys and it contains the older ones. A dropped prerequisite
      # is therefore not a failure: this deploy stands down, green, and names
      # the commit whose deploy carries it.
      - name: Stand down if a newer main commit superseded this one
        id: superseded
        env:
          BY: ${{ steps.wait_suites.outputs.superseded_by || steps.wait_full.outputs.superseded_by || steps.wait_image.outputs.superseded_by }}
        run: |
          echo "by=$BY" >> "$GITHUB_OUTPUT"
          if [[ -n "$BY" ]]; then
            {
              echo "## Superseded"
              echo ""
              echo "A prerequisite run for \`${{ steps.meta.outputs.head_sha }}\` was dropped from the queue because main moved to \`$BY\`, which contains it."
              echo "No hosted mutation was submitted; that commit's Deploy and Verify ships this change."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve publishing workflow and publication artifact
        id: source
        if: ${{ needs.changes.outputs.runtime_image == 'true' && steps.superseded.outputs.by == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.meta.outputs.runtime_image_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Runtime image tag must be a full source SHA for deployment metadata: $SOURCE_SHA" >&2
            exit 1
          }
          run_info="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/runtime-image.yml/runs?head_sha=$SOURCE_SHA&status=success&per_page=1" \
            | jq -c '.workflow_runs[0] // empty')"
          [[ -n "$run_info" ]] || {
            echo "No successful runtime-image publishing run for $SOURCE_SHA" >&2
            exit 1
          }
          run_id="$(jq -r '.id // empty' <<<"$run_info")"
          run_number="$(jq -r '.run_number // empty' <<<"$run_info")"
          run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_info")"
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_number" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]] || {
            echo "Successful runtime-image publishing run has incomplete identity metadata." >&2
            exit 1
          }
          artifact_id="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
            | jq -r --arg run_id "$run_id" --arg run_attempt "$run_attempt" \
              '[.artifacts[] | select(.expired == false and .name == ("runtime-publication-" + $run_id + "-" + $run_attempt))] | if length == 1 then .[0].id else empty end')"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "Publishing run $run_id does not have its immutable publication receipt artifact." >&2
            exit 1
          }
          {
            echo "source_run_id=$run_id"
            echo "source_order=$run_number"
            echo "source_attempt=$run_attempt"
            echo "source_artifact_id=$artifact_id"
            echo "source_workflow=Publish Runtime Image"
            echo "qualification_id=runtime-image-${run_id}-${run_attempt}"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve immutable runtime image from publication receipt
        id: digest
        if: ${{ needs.changes.outputs.runtime_image == 'true' && steps.superseded.outputs.by == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ORDER: ${{ steps.source.outputs.source_order }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
          SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.source_artifact_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.runtime_image_tag }}
          IMAGE_NAME: ${{ steps.meta.outputs.runtime_image_name }}
        run: |
          set -euo pipefail
          receipt_zip="$RUNNER_TEMP/runtime-publication.zip"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$receipt_zip" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"
          receipt_path="$RUNNER_TEMP/runtime-publication.json"
          unzip -p "$receipt_zip" runtime-publication.json > "$receipt_path"
          validated="$(python3 scripts/ops/release-artifacts.py verify-publication \
            --receipt "$receipt_path" \
            --source-sha "$SOURCE_SHA" \
            --source-order "$SOURCE_ORDER" \
            --build-run-id "$SOURCE_RUN_ID" \
            --build-attempt "$SOURCE_ATTEMPT")"
          digest="$(jq -er '.image_digest' <<<"$validated")"
          {
            echo "image_ref=$IMAGE_NAME@$digest"
            echo "image_digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve exact artifact catalog schema and source
        id: artifact_schema
        if: ${{ steps.superseded.outputs.by == '' }}
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$(python3 scripts/ops/release-artifacts.py inspect --image "$IMAGE_REF")"
          SCHEMA_METADATA="$metadata" HEAD_SHA="$HEAD_SHA" python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import re
          import sys

          metadata = json.loads(os.environ["SCHEMA_METADATA"])
          source_sha = metadata.get("source_sha")
          if not isinstance(source_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("selected immutable image has no full source revision label; bootstrap historical images before deployment")
          if source_sha != os.environ["HEAD_SHA"]:
              raise SystemExit(
                  f"selected immutable image source {source_sha} does not match selected workflow source {os.environ['HEAD_SHA']}"
              )
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              print(f"source_sha={source_sha}", file=output)
              for name in ("schema_version", "schema_min_reader", "schema_max_reader"):
                  value = metadata.get(name)
                  if type(value) is not int or value < 0:
                      raise SystemExit(f"artifact schema metadata {name} is not a non-negative integer")
                  print(f"{name}={value}", file=output)
          PY
      - name: Resolve immutable runtime build identity
        id: identity
        if: ${{ steps.superseded.outputs.by == '' }}
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          EXPECTED_SOURCE_SHA: ${{ steps.artifact_schema.outputs.source_sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          . scripts/lib/hosted-instance.sh
          _lh_hosted_resolve_build_identity "$IMAGE_REF"
          normalized="$(_lh_hosted_normalize_build_identity \
            "$EXPECTED_SOURCE_SHA" "$LH_DEPLOYMENT_BUILD_IDENTITY")"
          printf 'build_identity=%s\n' "$normalized" >> "$GITHUB_OUTPUT"


  deploy_demo:
    name: "Deploy public demo runtime"
    runs-on: cube-deploy
    if: github.repository == 'cipher982/longhouse' && needs.gate.outputs.superseded_by == ''
    timeout-minutes: 60
    needs: [changes, gate, fast_smoke, reprovision_canary]
    outputs:
      deployment_id: ${{ steps.submit_demo.outputs.deployment_id }}
    env:
      PUBLIC_DEMO_URL: https://longhouse.ai
      # The public demo is served by its own host-local stack, so this job
      # records a disposition instead of submitting a deployment. See the
      # step summary; the canary remains the automated gate.
      INSTANCE_SUBDOMAIN: demo
      RUNTIME_SOURCE_SHA: ${{ needs.gate.outputs.runtime_source_sha }}
      RUNTIME_BUILD_IDENTITY: ${{ needs.gate.outputs.runtime_build_identity }}
      RUNTIME_SOURCE_WORKFLOW: ${{ needs.gate.outputs.runtime_source_workflow }}
      RUNTIME_SOURCE_ORDER: ${{ needs.gate.outputs.runtime_source_order }}
      RUNTIME_QUALIFICATION_ID: ${{ needs.gate.outputs.runtime_qualification_id }}
      RUNTIME_SCHEMA_VERSION: ${{ needs.gate.outputs.runtime_schema_version }}
      RUNTIME_SCHEMA_MIN_READER: ${{ needs.gate.outputs.runtime_schema_min_reader }}
      RUNTIME_SCHEMA_MAX_READER: ${{ needs.gate.outputs.runtime_schema_max_reader }}
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ github.token }}
      RUNTIME_DEPLOYMENT_IDEMPOTENCY_KEY: deploy-and-verify-${{ github.run_id }}-${{ github.run_attempt }}-demo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 1
          filter: blob:none
          show-progress: false



      - name: Resolve the deployed image build identity
        env:
          IMAGE_REF: ${{ needs.gate.outputs.runtime_image_ref }}
        run: |
          set -euo pipefail
          # Same identity contract as the canary: the control plane refuses a
          # ready deployment that carries no build identity, and compares the
          # submitted value with what the served runtime reports.
          identity="$(docker run --rm --network none --entrypoint cat "$IMAGE_REF" /app/zerg/build_identity.json | jq -c .)"
          [[ "$identity" == "{"*"}" ]] || {
            echo "Runtime image $IMAGE_REF carries no readable build identity" >&2
            exit 1
          }
          echo "RUNTIME_BUILD_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "resolved build identity for $IMAGE_REF"

      - name: Verify runtime image exists
        run: docker manifest inspect "${{ needs.gate.outputs.runtime_image_ref }}" >/dev/null

      - name: Record demo deploy disposition
        id: submit_demo
        run: |
          set -euo pipefail
          image_ref="${{ needs.gate.outputs.runtime_image_ref }}"
          {
            echo "## Public demo runtime"
            echo ""
            echo "Not submitted by this workflow. \`longhouse.ai\` is a host-local"
            echo "manual app (\`/home/zerg/manual-apps/longhouse-demo\` on zerg, direct"
            echo "Docker Compose plus a static Caddy route), not a control-plane tenant:"
            echo "registering it as one removes the container the site is served from."
            echo "\`promote-dogfood.sh\` refuses the same target for the same reason."
            echo ""
            echo "Image qualified for this SHA: \`$image_ref\`"
            echo "Promote it by hand, from the demo's own stack:"
            echo ""
            echo '```'
            echo "LONGHOUSE_DEMO_IMAGE=$image_ref docker compose up -d --force-recreate"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "deployment_id=" >> "$GITHUB_OUTPUT"

  reprovision_canary:
    name: "Reprovision hosted canary"
    runs-on: cube-deploy
    if: github.repository == 'cipher982/longhouse' && needs.gate.outputs.superseded_by == ''
    timeout-minutes: 60
    needs: [changes, gate]
    outputs:
      instance_id: ${{ steps.instance.outputs.instance_id }}
      instance_url: ${{ steps.instance.outputs.instance_url }}
      frontend_url: ${{ steps.instance.outputs.frontend_url }}
      api_url: ${{ steps.instance.outputs.api_url }}
      deployment_id: ${{ steps.submit_canary.outputs.deployment_id }}
    env:
      CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.HOSTED_CANARY_CONTROL_PLANE_ADMIN_TOKEN }}
      CONTROL_PLANE_URL: ${{ vars.HOSTED_CANARY_CONTROL_PLANE_URL }}
      INSTANCE_SUBDOMAIN: ${{ vars.HOSTED_CANARY_SUBDOMAIN }}
      LH_DEPLOYMENT_SOURCE_SHA: ${{ needs.gate.outputs.runtime_source_sha }}
      LH_DEPLOYMENT_BUILD_IDENTITY: ${{ needs.gate.outputs.runtime_build_identity }}
      LH_DEPLOYMENT_SOURCE_WORKFLOW: ${{ needs.gate.outputs.runtime_source_workflow }}
      LH_DEPLOYMENT_SOURCE_ORDER: ${{ needs.gate.outputs.runtime_source_order }}
      LH_DEPLOYMENT_QUALIFICATION_ID: ${{ needs.gate.outputs.runtime_qualification_id }}
      LH_DEPLOYMENT_SCHEMA_VERSION: ${{ needs.gate.outputs.runtime_schema_version }}
      LH_DEPLOYMENT_SCHEMA_MIN_READER: ${{ needs.gate.outputs.runtime_schema_min_reader }}
      LH_DEPLOYMENT_SCHEMA_MAX_READER: ${{ needs.gate.outputs.runtime_schema_max_reader }}
      LH_DEPLOYMENT_IDEMPOTENCY_KEY: deploy-and-verify-${{ github.run_id }}-${{ github.run_attempt }}-canary
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 1
          filter: blob:none
          show-progress: false

      - name: Require isolated canary authority
        run: |
          . scripts/lib/hosted-instance.sh
          lh_hosted_require_env CONTROL_PLANE_URL CONTROL_PLANE_ADMIN_TOKEN INSTANCE_SUBDOMAIN
          if [[ "${INSTANCE_SUBDOMAIN,,}" == "david010" || "${INSTANCE_SUBDOMAIN,,}" == "demo" ]]; then
            echo "Refusing automated reprovision of personal dogfood or public demo; configure a dedicated hosted canary." >&2
            exit 1
          fi

      - name: Wait for control plane
        run: ./scripts/ci/wait-for-http.sh "$CONTROL_PLANE_URL/health" "Control plane"

      - name: Resolve the deployed image build identity
        env:
          IMAGE_REF: ${{ needs.gate.outputs.runtime_image_ref }}
        run: |
          set -euo pipefail
          # The control plane compares the submitted build identity against the
          # one the served runtime reports, and refuses a ready deployment that
          # carries none. Read it from the image being deployed.
          identity="$(docker run --rm --network none --entrypoint cat "$IMAGE_REF" /app/zerg/build_identity.json | jq -c .)"
          [[ "$identity" == "{"*"}" ]] || {
            echo "Runtime image $IMAGE_REF carries no readable build identity" >&2
            exit 1
          }
          echo "LH_DEPLOYMENT_BUILD_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "resolved build identity for $IMAGE_REF"


      - name: Resolve hosted canary instance
        id: instance
        run: |
          . scripts/lib/hosted-instance.sh
          lh_hosted_prepare_target "$INSTANCE_SUBDOMAIN" "" ""
          {
            echo "instance_id=$LH_INSTANCE_ID"
            echo "instance_url=$LH_INSTANCE_URL"
            echo "frontend_url=$LH_TARGET_FRONTEND_URL"
            echo "api_url=$LH_TARGET_API_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Reprovision hosted canary
        id: submit_canary
        run: |
          . scripts/lib/hosted-instance.sh
          lh_hosted_reprovision "${{ steps.instance.outputs.instance_id }}" "${{ needs.gate.outputs.runtime_image_ref }}"
          printf 'deployment_id=%s\n' "$LH_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"


  fast_smoke:
    name: "Canary qualification smoke"
    runs-on: cube-deploy
    if: github.repository == 'cipher982/longhouse' && needs.gate.outputs.superseded_by == ''
    timeout-minutes: 20
    needs: [gate, reprovision_canary]
    env:
      CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.HOSTED_CANARY_CONTROL_PLANE_ADMIN_TOKEN }}
      CONTROL_PLANE_URL: ${{ vars.HOSTED_CANARY_CONTROL_PLANE_URL }}
      SMOKE_RUNTIME_TOKEN: ${{ secrets.HOSTED_CANARY_RUNTIME_TOKEN }}
      PUBLIC_DEMO_URL: ${{ needs.reprovision_canary.outputs.instance_url }}
      INSTANCE_SUBDOMAIN: ${{ vars.HOSTED_CANARY_SUBDOMAIN }}
      API_URL: ${{ needs.reprovision_canary.outputs.api_url }}
      FRONTEND_URL: ${{ needs.reprovision_canary.outputs.frontend_url }}
      INSTANCE_URL: ${{ needs.reprovision_canary.outputs.instance_url }}
      CANARY_DEPLOYMENT_ID: ${{ needs.reprovision_canary.outputs.deployment_id }}
      RUNTIME_IMAGE_DIGEST: ${{ needs.gate.outputs.runtime_image_digest }}
      RUNTIME_SOURCE_SHA: ${{ needs.gate.outputs.runtime_source_sha }}
      RUNTIME_SOURCE_WORKFLOW: ${{ needs.gate.outputs.runtime_source_workflow }}
      RUNTIME_SOURCE_ORDER: ${{ needs.gate.outputs.runtime_source_order }}
      RUNTIME_SOURCE_RUN_ID: ${{ needs.gate.outputs.runtime_source_run_id }}
      RUNTIME_SOURCE_ATTEMPT: ${{ needs.gate.outputs.runtime_source_attempt }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 1
          filter: blob:none
          show-progress: false

      - name: Wait for control plane and hosted canary
        run: |
          ./scripts/ci/wait-for-http.sh "$CONTROL_PLANE_URL/health" "Control plane"
          ./scripts/ci/wait-for-http.sh "$API_URL/api/health" "Hosted canary"

      - name: Run fast smoke tests
        id: fast_smoke
        run: |
          . scripts/lib/hosted-instance.sh
          lh_hosted_require_env CONTROL_PLANE_URL CONTROL_PLANE_ADMIN_TOKEN INSTANCE_SUBDOMAIN SMOKE_RUNTIME_TOKEN CANARY_DEPLOYMENT_ID
          echo "Qualifying hosted canary deployment receipt $CANARY_DEPLOYMENT_ID"
          ./scripts/qa/smoke-prod.sh --fast --no-llm

      - name: Summary
        if: always()
        run: |
          {
            echo "## Canary Qualification Results"
            echo ""
            echo "- **Hosted canary:** $INSTANCE_SUBDOMAIN"
            echo "- **Hosted canary URL:** $INSTANCE_URL"
            echo "- **Control plane:** $CONTROL_PLANE_URL"
            echo "- **Commit:** ${{ needs.gate.outputs.head_sha }}"
            echo "- **Candidate image:** \`${{ needs.gate.outputs.runtime_image_ref }}\`"
            echo "- **Canary deployment receipt:** \`$CANARY_DEPLOYMENT_ID\`"
            echo "- **canary smoke:** \`${{ steps.fast_smoke.outcome || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write successful canary verification receipt
        if: steps.fast_smoke.outcome == 'success'
        run: |
          set -euo pipefail
          receipt_path="$RUNNER_TEMP/runtime-verification.json"
          python3 - "$receipt_path" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schema": "longhouse.runtime-verification.v1",
                      "image_digest": os.environ["RUNTIME_IMAGE_DIGEST"],
                      "source_sha": os.environ["RUNTIME_SOURCE_SHA"],
                      "source_workflow": os.environ["RUNTIME_SOURCE_WORKFLOW"],
                      "source_order": int(os.environ["RUNTIME_SOURCE_ORDER"]),
                      "build_run_id": os.environ["RUNTIME_SOURCE_RUN_ID"],
                      "build_attempt": int(os.environ["RUNTIME_SOURCE_ATTEMPT"]),
                      "qualification_id": (
                          f"runtime-image-{os.environ['RUNTIME_SOURCE_RUN_ID']}-"
                          f"{os.environ['RUNTIME_SOURCE_ATTEMPT']}"
                      ),
                      "verification": {
                          "functional_smoke": "success",
                          "canary_deployment_id": os.environ["CANARY_DEPLOYMENT_ID"],
                      },
                  },
                  handle,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
          python3 scripts/ops/release-artifacts.py verify-publication \
            --receipt "$receipt_path" \
            --source-sha "$RUNTIME_SOURCE_SHA" \
            --source-workflow "$RUNTIME_SOURCE_WORKFLOW" \
            --source-order "$RUNTIME_SOURCE_ORDER" \
            --build-run-id "$RUNTIME_SOURCE_RUN_ID" \
            --build-attempt "$RUNTIME_SOURCE_ATTEMPT" \
            --require-verification >/dev/null

      - name: Upload successful canary verification receipt
        if: steps.fast_smoke.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-verification.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload live QA artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-live-qa-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/qa-live-fail-*.png
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Create GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI is not installed on this runner; skipping issue creation."
            exit 0
          fi
          COMMIT_SHA="${{ needs.gate.outputs.head_sha }}"
          gh issue create \
            --title "Runtime deploy smoke failed for ${COMMIT_SHA:0:7}" \
            --body "$(cat <<EOF_BODY
          Runtime deploy and/or hosted QA failed for commit ${COMMIT_SHA}.

          - Hosted canary: ${INSTANCE_URL:-unresolved}
          - Public demo: $PUBLIC_DEMO_URL
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the workflow logs for which step failed.
          EOF_BODY
          )"
  hosted_live_qa:
    name: "Dispatch hosted live QA (async)"
    needs: [gate, reprovision_canary, fast_smoke, deploy_demo]
    if: github.repository == 'cipher982/longhouse' && needs.gate.outputs.superseded_by == ''
    runs-on: cube-deploy
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch durable hosted QA observer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.gate.outputs.head_sha }}
          RUNTIME_IMAGE_TAG: ${{ needs.gate.outputs.runtime_image_tag }}
          # The durable receipt this observer follows is the canary's: the demo
          # is served by its own host-local stack and records a disposition
          # rather than a control-plane deployment.
          DEPLOYMENT_ID: ${{ needs.reprovision_canary.outputs.deployment_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn \
              --arg ref "${GITHUB_REF_NAME:-main}" \
              --arg source_sha "$SOURCE_SHA" \
              --arg runtime_image_tag "$RUNTIME_IMAGE_TAG" \
              --arg deployment_id "$DEPLOYMENT_ID" \
              '{ref:$ref,inputs:{source_sha:$source_sha,runtime_image_tag:$runtime_image_tag,deployment_id:$deployment_id}}')" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hosted-live-qa.yml/dispatches"
          echo "Dispatched hosted-live-qa for deployment receipt $DEPLOYMENT_ID"

  profile-deploy:
    timeout-minutes: 30
    name: "Profile deploy wall time"
    runs-on: cube-fast
    needs: [changes, deploy_demo, reprovision_canary, fast_smoke]
    if: ${{ always() && needs.changes.outputs.deploy_verify == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ops/ci-profile.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Write deploy wall-time summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t RUN_IDS < <(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=push&per_page=100" \
              | jq -r --arg sha "${{ github.sha }}" '.workflow_runs[] | select(.head_sha == $sha) | .id'
          )
          PROFILE_ARGS=()
          for run_id in "${RUN_IDS[@]}"; do
            PROFILE_ARGS+=(--run-id "$run_id")
          done
          if [[ "${#PROFILE_ARGS[@]}" -eq 0 ]]; then
            PROFILE_ARGS=(--run-id "${{ github.run_id }}")
          fi

          {
            echo "## Deploy Wall Time"
            echo ""
            echo '```text'
            python3 scripts/ops/ci-profile.py \
              "${PROFILE_ARGS[@]}" \
              --top 20 \
              --exclude-job "Profile deploy wall time" || echo "Profile unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
