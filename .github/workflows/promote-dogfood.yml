name: Promote Dogfood

# Pushes deploy demo and canary only. The dogfood instance takes the newest
# canary-verified image once a day, or an explicit commit on demand.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to promote (defaults to the newest canary-verified main commit)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: promote-dogfood
  cancel-in-progress: false

jobs:
  promote:
    name: "Promote canary-verified image"
    runs-on: cube-deploy
    if: github.repository == 'cipher982/longhouse'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          show-progress: false

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.CONTROL_PLANE_ADMIN_TOKEN }}
          SUBDOMAIN: ${{ vars.LONGHOUSE_DEFAULT_SUBDOMAIN }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: ./scripts/ops/promote-dogfood.sh "${REQUESTED_SHA:-}"
