name: Promote Dogfood

# Pushes deploy demo and canary only. The dogfood instance takes a
# canary-verified image on demand: the canary does not run the owner's machines,
# and a verified image has broken them before, so promotion stays deliberate.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact commit SHA to promote; must have a successful canary-qualified Deploy and Verify run"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: promote-dogfood
  cancel-in-progress: false

jobs:
  promote:
    name: "Promote canary-verified image"
    runs-on: cube-deploy
    if: github.repository == 'cipher982/longhouse'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The script refuses a SHA absent from the checkout, and the one
          # promoted is usually behind the dispatch ref's tip.
          fetch-depth: 0
          show-progress: false

      # The cube deploy runner has no GitHub CLI and promote-dogfood.sh needs
      # it; install a pinned, checksum-verified copy into the job's temp dir.
      - name: Install GitHub CLI
        env:
          GH_VERSION: "2.101.0"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          name="gh_${GH_VERSION}_linux_${arch}"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${name}.tar.gz"
          curl -fsSL "${base}/gh_${GH_VERSION}_checksums.txt" | grep " ${name}.tar.gz\$" | sha256sum -c -
          tar -xzf "${name}.tar.gz"
          echo "$RUNNER_TEMP/${name}/bin" >> "$GITHUB_PATH"
          for tool in jq python3 curl unzip; do command -v "$tool" >/dev/null || { echo "missing $tool" >&2; exit 1; }; done

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_URL: https://control.longhouse.ai
          CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.CONTROL_PLANE_ADMIN_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          SUBDOMAIN: ${{ vars.LONGHOUSE_DEFAULT_SUBDOMAIN }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: ./scripts/ops/promote-dogfood.sh "${REQUESTED_SHA}"
