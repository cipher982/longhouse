name: CI probe (experiment branch only)

on:
  push:
    branches: [ci2-lab2]

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/cipher982/longhouse-test@sha256:7f3fb268defae5d3a5b06cd9128eb9e5050aad08f65c381662d2cb7c05028584

jobs:
  pull:
    name: "pull ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [mnt, root, mnt-snapshotter, mnt-conc16, tmpfs-probe]
    steps:
      - name: Machine
        run: |
          nproc; free -g; df -h / /mnt
          lsblk -o NAME,SIZE,ROTA,MODEL || true
          docker version --format '{{.Server.Version}}'
          cat /etc/docker/daemon.json 2>/dev/null || true
      - name: Raw disk and network
        run: |
          for d in / /mnt; do
            f="$d/probe.bin"; [ "$d" = / ] && f=/tmp/probe.bin
            sudo dd if=/dev/zero of=$f bs=1M count=3072 oflag=direct 2>&1 | tail -1 | sed "s#^#write $d: #"
            sudo rm -f $f
          done
          sudo mkdir -p /mnt/blobs && sudo chown "$USER" /mnt/blobs && rmdir /mnt/blobs
          echo "${{ github.token }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          s=$(date +%s.%N); skopeo copy --quiet "docker://$IMAGE" "dir:/mnt/blobs"; e=$(date +%s.%N)
          echo "download-only (skopeo, compressed blobs): $(echo "$e - $s" | bc) s, $(du -sh /mnt/blobs | cut -f1)"
          # biggest layer unpack cost, isolated from docker
          big=$(ls -S /mnt/blobs | head -1)
          sudo mkdir -p /mnt/unpack /tmp/unpack
          s=$(date +%s.%N); sudo tar -I zstd -xf /mnt/blobs/$big -C /mnt/unpack; e=$(date +%s.%N)
          echo "unpack biggest layer to /mnt: $(echo "$e - $s" | bc) s ($(sudo du -sh /mnt/unpack | cut -f1), $(sudo find /mnt/unpack | wc -l) files)"
          s=$(date +%s.%N); sudo tar -I zstd -xf /mnt/blobs/$big -C /tmp/unpack; e=$(date +%s.%N)
          echo "unpack biggest layer to /: $(echo "$e - $s" | bc) s"
          sudo rm -rf /mnt/blobs /mnt/unpack /tmp/unpack
      - name: Configure docker (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            mnt|tmpfs-probe) cfg='{"data-root":"/mnt/docker"}' ;;
            root) cfg='{}' ;;
            mnt-snapshotter) cfg='{"data-root":"/mnt/docker","features":{"containerd-snapshotter":true}}' ;;
            mnt-conc16) cfg='{"data-root":"/mnt/docker","max-concurrent-downloads":16}' ;;
          esac
          sudo systemctl stop docker docker.socket
          echo "$cfg" | sudo tee /etc/docker/daemon.json
          sudo mkdir -p /mnt/docker
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}} driver={{.Driver}}'
      - name: Pull
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          s=$(date +%s.%N); docker pull -q "$IMAGE"; e=$(date +%s.%N)
          echo "PULL ${{ matrix.variant }}: $(echo "$e - $s" | bc) s"
          s=$(date +%s.%N); docker run --rm --entrypoint true "$IMAGE"; e=$(date +%s.%N)
          echo "first container start: $(echo "$e - $s" | bc) s"
          df -h / /mnt

