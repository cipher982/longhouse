name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing git tag to publish from (for example v0.1.5)"
        required: true
        type: string

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
    permissions:
      contents: write
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build frontend
        working-directory: web
        run: |
          bun install
          bun run build

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Generate build identity
        run: python3 scripts/build/generate_build_identity.py

      - name: Build package
        working-directory: server
        run: uv build --wheel

      - name: Verify wheel archive
        run: python3 scripts/qa/check-wheel.py server/dist/longhouse-*.whl

      - name: Upload release wheel assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHEEL=$(find server/dist -maxdepth 1 -name 'longhouse-*.whl' | head -1)
          gh release upload "$RELEASE_TAG" "$WHEEL" --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: server/dist/
