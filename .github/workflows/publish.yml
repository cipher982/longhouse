name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing git tag to publish from (for example v0.1.5)"
        required: true
        type: string

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
    permissions:
      contents: write
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build frontend
        working-directory: web
        run: |
          bun install
          bun run build

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Generate build identity
        run: python3 scripts/build/generate_build_identity.py

      - name: Build package
        working-directory: server
        run: uv build --wheel

      - name: Verify wheel archive
        run: python3 scripts/qa/check-wheel.py server/dist/longhouse-*.whl

      - name: Upload release wheel assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHEEL=$(find server/dist -maxdepth 1 -name 'longhouse-*.whl' | head -1)
          gh release upload "$RELEASE_TAG" "$WHEEL" --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: server/dist/
