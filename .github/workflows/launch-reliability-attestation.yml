name: Launch reliability attestation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit recorded by the dogfood report
        required: true
        type: string
      report_path:
        description: Absolute path to the retained report on the qualification runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    name: Sign launch reliability report
    # The report and sampled binaries remain on the protected qualification
    # runner. Do not move this job to a general hosted runner: the signer is
    # only useful when it is separated from the operator who collected the
    # report.
    runs-on: [self-hosted, longhouse-release-qualification]
    environment: longhouse-release-attestation
    timeout-minutes: 10
    env:
      ATTESTATION_KEY_ID: longhouse-ci-2026
      SOURCE_SHA: ${{ inputs.source_sha }}
      REPORT_PATH: ${{ inputs.report_path }}
      PRIVATE_KEY_PEM: ${{ secrets.LONGHOUSE_DOGFOOD_ATTESTATION_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7

      - name: Require the protected signer key
        shell: bash
        run: |
          test -n "$PRIVATE_KEY_PEM" || {
            echo "LONGHOUSE_DOGFOOD_ATTESTATION_PRIVATE_KEY_PEM is not configured." >&2
            exit 1
          }
          test -s "$REPORT_PATH" || {
            echo "Report does not exist on the qualification runner: $REPORT_PATH" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo "Checked-out source does not match the requested source SHA." >&2
            exit 1
          }
          test "$(jq -r '.provenance.git_sha // empty' "$REPORT_PATH")" = "$SOURCE_SHA" || {
            echo "Report provenance does not match the requested source SHA." >&2
            exit 1
          }

      - name: Derive and sign the exact report subject
        shell: bash
        env:
          KEY_PATH: ${{ runner.temp }}/longhouse-attestation-private-key.pem
          SUBJECT_PATH: ${{ runner.temp }}/launch-reliability-attestation-subject.json
          RECEIPT_PATH: ${{ runner.temp }}/launch-reliability-attestation.json
        run: |
          umask 077
          printf '%s' "$PRIVATE_KEY_PEM" > "$KEY_PATH"
          uv run --project server python scripts/qa/launch-reliability-attestation.py \
            create-from-report \
            --report "$REPORT_PATH" \
            --private-key "$KEY_PATH" \
            --subject-output "$SUBJECT_PATH" \
            --output "$RECEIPT_PATH" \
            --key-id "$ATTESTATION_KEY_ID"
          uv run --project server python scripts/qa/launch-reliability-attestation.py \
            verify \
            --receipt "$RECEIPT_PATH" \
            --subject "$SUBJECT_PATH"

      - name: Upload signed qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: launch-reliability-attestation-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/launch-reliability-attestation-subject.json
            ${{ runner.temp }}/launch-reliability-attestation.json
