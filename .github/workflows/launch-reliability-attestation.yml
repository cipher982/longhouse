name: Launch reliability attestation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: launch-reliability-attestation-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure retained launch evidence
    # This runner may access the retained evidence and the measured source,
    # but it never receives the release signing secret.
    runs-on: [self-hosted, longhouse-release-qualification]
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EVIDENCE_ROOT: /var/lib/longhouse/qualification
    steps:
      - name: Require a supported qualification runner
        shell: bash
        run: |
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64|Linux:ARM64|macOS:X64|macOS:ARM64) ;;
            *) echo "Unsupported qualification runner: $RUNNER_OS/$RUNNER_ARCH." >&2; exit 1 ;;
          esac

      - name: Checkout the measured source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: measured-source

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.10'
          checksum: ${{ runner.os == 'Linux' && runner.arch == 'X64' && '3e1027f26ce8c7e4c32e2277a7fed2cb410f2f1f9320d3df97653d40e21f415b' || runner.os == 'Linux' && runner.arch == 'ARM64' && '2b80457b950deda12e8d5dc3b9b7494ac143eae47f1fb11b1c6e5a8495a6421e' || runner.os == 'macOS' && runner.arch == 'X64' && 'dd18420591d625f9b4ca2b57a7a6fe3cce43910f02e02d90e47a4101428de14a' || runner.os == 'macOS' && runner.arch == 'ARM64' && '8a09f0ef51ee7f7170731b4cb8bde5bf9ba6da5304f49a7df6cdab42a1f37b5d' || '' }}

      - name: Snapshot evidence and rebuild the report
        id: measure
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "cipher982/longhouse" || {
            echo "Launch reliability attestation must run in cipher982/longhouse." >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Launch reliability attestation must be dispatched from protected main." >&2
            exit 1
          }
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "source_sha must be a lowercase full 40-character commit SHA." >&2
            exit 1
          }
          measured_root="$GITHUB_WORKSPACE/measured-source"
          test "$(git -C "$measured_root" rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo "Measured checkout does not match the requested source SHA." >&2
            exit 1
          }
          git -C "$measured_root" fetch --no-tags origin main:refs/remotes/origin/main
          git -C "$measured_root" rev-list --first-parent refs/remotes/origin/main | grep -Fxq "$SOURCE_SHA" || {
            echo "The measured source SHA is not a protected main first-parent commit." >&2
            exit 1
          }
          snapshot_root="$RUNNER_TEMP/launch-reliability-evidence"
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          assert_no_symlink_path() {
            local path="$1"
            local current="/"
            local component
            local -a components
            IFS=/ read -r -a components <<< "${path#/}"
            for component in "${components[@]}"; do
              test -n "$component" || continue
              current="${current%/}/$component"
              test ! -L "$current" || {
                echo "Symlinks are not allowed in retained evidence path: $current" >&2
                return 1
              }
            done
          }
          manifest_tree() {
            local base="$1"
            local check_ancestors="${2:-false}"
            local rel path file digest special
            if test "$check_ancestors" = true; then
              assert_no_symlink_path "$base"
            else
              test ! -L "$base" || { echo "Evidence snapshot must not be a symlink: $base" >&2; return 1; }
            fi
            for rel in matrix native-health provider-harness dogfood/episodes dogfood/challenges; do
              path="$base/$rel"
              test -d "$path" || { echo "Missing retained evidence tree: $path" >&2; return 1; }
              special="$(find "$path" ! -type f ! -type d -print -quit)"
              if test -n "$special"; then
                echo "Only regular files and directories are allowed in retained evidence: $special" >&2
                return 1
              fi
              while IFS= read -r file; do
                case "$file" in
                  *$'\n'*|*$'\r'*)
                    echo "Newlines are not allowed in retained evidence paths: $file" >&2
                    return 1
                    ;;
                esac
                digest="$(sha256_file "$file" | awk '{print $1}')"
                printf '%s  %s\n' "$digest" "${file#"$base"/}"
              done < <(find "$path" -type f -print | LC_ALL=C sort)
            done
          }
          canonical_evidence_root="$(
            python -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "$EVIDENCE_ROOT"
          )" || {
            echo "Evidence root does not resolve to an existing directory." >&2
            exit 1
          }
          case "$RUNNER_OS:$canonical_evidence_root" in
            Linux:/var/lib/longhouse/qualification|macOS:/private/var/lib/longhouse/qualification) ;;
            *) echo "Evidence root resolved outside the fixed qualification location: $canonical_evidence_root." >&2; exit 1 ;;
          esac
          umask 077
          assert_no_symlink_path "$canonical_evidence_root"
          run_root="$canonical_evidence_root/$SOURCE_SHA"
          assert_no_symlink_path "$run_root"
          test -d "$run_root" || { echo "No retained evidence exists for $SOURCE_SHA." >&2; exit 1; }
          before_manifest="$RUNNER_TEMP/launch-reliability-evidence.before.manifest"
          after_manifest="$RUNNER_TEMP/launch-reliability-evidence.after.manifest"
          snapshot_manifest="$RUNNER_TEMP/launch-reliability-evidence.snapshot.manifest"
          rm -rf -- "$snapshot_root"
          mkdir -p "$snapshot_root/matrix" "$snapshot_root/native-health" \
            "$snapshot_root/provider-harness" "$snapshot_root/dogfood/episodes" \
            "$snapshot_root/dogfood/challenges"
          manifest_tree "$run_root" true > "$before_manifest"
          cp -R "$run_root/matrix/." "$snapshot_root/matrix/"
          cp -R "$run_root/native-health/." "$snapshot_root/native-health/"
          cp -R "$run_root/provider-harness/." "$snapshot_root/provider-harness/"
          cp -R "$run_root/dogfood/episodes/." "$snapshot_root/dogfood/episodes/"
          cp -R "$run_root/dogfood/challenges/." "$snapshot_root/dogfood/challenges/"
          manifest_tree "$run_root" true > "$after_manifest"
          manifest_tree "$snapshot_root" false > "$snapshot_manifest"
          cmp "$before_manifest" "$after_manifest" || {
            echo "Retained evidence changed while it was being snapshotted." >&2
            exit 1
          }
          cmp "$after_manifest" "$snapshot_manifest" || {
            echo "Evidence snapshot does not match the retained source." >&2
            exit 1
          }
          matrix_root="$snapshot_root/matrix"
          health_root="$snapshot_root/native-health"
          harness_root="$snapshot_root/provider-harness"
          dogfood_root="$snapshot_root/dogfood"
          shopt -s nullglob
          harness=("$harness_root"/*.json)
          health=("$health_root"/*.json)
          dogfood=("$dogfood_root"/episodes/*.json)
          challenges=("$dogfood_root"/challenges/*.json)
          test "${#harness[@]}" -gt 0 || { echo "No provider harness artifacts retained." >&2; exit 1; }
          test "${#health[@]}" -gt 0 || { echo "No native health artifacts retained." >&2; exit 1; }
          test "${#dogfood[@]}" -gt 0 || { echo "No dogfood episodes retained." >&2; exit 1; }
          test "${#dogfood[@]}" = "${#challenges[@]}" || { echo "Dogfood episode/challenge counts differ." >&2; exit 1; }
          report_path="$RUNNER_TEMP/launch-reliability-measurements.json"
          subject_path="$RUNNER_TEMP/launch-reliability-attestation-subject.json"
          rm -f -- "$report_path" "$subject_path" "$RUNNER_TEMP/report.sha256"
          args=(
            --matrix-root "$matrix_root"
            --output "$report_path"
            --attestation-subject "$subject_path"
          )
          for path in "${harness[@]}"; do args+=(--provider-harness-artifact "$path"); done
          for path in "${health[@]}"; do args+=(--health-artifact "$path"); done
          for path in "${dogfood[@]}"; do args+=(--dogfood-series "$path"); done
          for path in "${challenges[@]}"; do args+=(--dogfood-challenge "$path"); done
          cd "$measured_root"
          uv run --frozen --project "$measured_root/server" python \
            "$measured_root/scripts/qa/launch-reliability-measurements.py" "${args[@]}"
          manifest_tree "$snapshot_root" false > "$RUNNER_TEMP/launch-reliability-evidence.after-report.manifest"
          cmp "$snapshot_manifest" "$RUNNER_TEMP/launch-reliability-evidence.after-report.manifest" || {
            echo "Evidence snapshot changed while the report was being built." >&2
            exit 1
          }
          test -s "$report_path" || { echo "Report generation produced no report." >&2; exit 1; }
          test -s "$subject_path" || { echo "No qualifying attestation subject was produced." >&2; exit 1; }
          sha256_file "$report_path" > "$RUNNER_TEMP/report.sha256"

      - name: Upload measured report for the isolated signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: launch-reliability-measurement-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/launch-reliability-measurements.json
            ${{ runner.temp }}/launch-reliability-attestation-subject.json
            ${{ runner.temp }}/report.sha256

  sign:
    name: Sign the measured report
    needs: measure
    # This is a separate protected runner. The measured checkout and its
    # dependencies are never present in the key-bearing job.
    runs-on: [self-hosted, longhouse-release-signer]
    environment: longhouse-release-attestation
    timeout-minutes: 10
    env:
      ATTESTATION_KEY_ID: longhouse-ci-2026
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require a supported signing runner
        shell: bash
        run: |
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64|Linux:ARM64|macOS:X64|macOS:ARM64) ;;
            *) echo "Unsupported signing runner: $RUNNER_OS/$RUNNER_ARCH." >&2; exit 1 ;;
          esac

      - name: Checkout the reviewed signer source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: trusted-source

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.10'
          checksum: ${{ runner.os == 'Linux' && runner.arch == 'X64' && '3e1027f26ce8c7e4c32e2277a7fed2cb410f2f1f9320d3df97653d40e21f415b' || runner.os == 'Linux' && runner.arch == 'ARM64' && '2b80457b950deda12e8d5dc3b9b7494ac143eae47f1fb11b1c6e5a8495a6421e' || runner.os == 'macOS' && runner.arch == 'X64' && 'dd18420591d625f9b4ca2b57a7a6fe3cce43910f02e02d90e47a4101428de14a' || runner.os == 'macOS' && runner.arch == 'ARM64' && '8a09f0ef51ee7f7170731b4cb8bde5bf9ba6da5304f49a7df6cdab42a1f37b5d' || '' }}

      - name: Download the measured report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: launch-reliability-measurement-${{ github.run_id }}
          path: ${{ runner.temp }}/launch-reliability-measurement

      - name: Sign and independently verify the report
        shell: bash
        env:
          KEY_PATH: ${{ runner.temp }}/longhouse-attestation-private-key.pem
          PRIVATE_KEY_PEM: ${{ secrets.LONGHOUSE_DOGFOOD_ATTESTATION_PRIVATE_KEY_PEM }}
        run: |
          test "$GITHUB_REPOSITORY" = "cipher982/longhouse" || {
            echo "Launch reliability attestation must run in cipher982/longhouse." >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Launch reliability attestation must be dispatched from protected main." >&2
            exit 1
          }
          trusted_root="$GITHUB_WORKSPACE/trusted-source"
          input_root="$RUNNER_TEMP/launch-reliability-measurement"
          report_path="$input_root/launch-reliability-measurements.json"
          measured_subject_path="$input_root/launch-reliability-attestation-subject.json"
          receipt_path="$RUNNER_TEMP/launch-reliability-attestation.json"
          trusted_subject_path="$RUNNER_TEMP/trusted-launch-reliability-attestation-subject.json"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "Trusted checkout does not match the workflow commit." >&2
            exit 1
          }
          if command -v sha256sum >/dev/null 2>&1; then
            report_sha="$(sha256sum "$report_path" | cut -d' ' -f1)"
          else
            report_sha="$(shasum -a 256 "$report_path" | cut -d' ' -f1)"
          fi
          test "$report_sha" = "$(cut -d' ' -f1 "$input_root/report.sha256")" || {
            echo "The measured report changed during artifact transfer." >&2
            exit 1
          }
          test -n "$PRIVATE_KEY_PEM" || {
            echo "LONGHOUSE_DOGFOOD_ATTESTATION_PRIVATE_KEY_PEM is not configured." >&2
            exit 1
          }
          umask 077
          printf '%s' "$PRIVATE_KEY_PEM" > "$KEY_PATH"
          cd "$trusted_root"
          uv run --frozen --project "$trusted_root/server" python \
            "$trusted_root/scripts/qa/launch-reliability-attestation.py" \
            create-from-report \
            --report "$report_path" \
            --private-key "$KEY_PATH" \
            --subject-output "$trusted_subject_path" \
            --output "$receipt_path" \
            --key-id "$ATTESTATION_KEY_ID" \
            --expected-source-sha "$SOURCE_SHA"
          cmp "$trusted_subject_path" "$measured_subject_path" || {
            echo "Trusted subject derivation differs from measured subject." >&2
            exit 1
          }
          uv run --frozen --project "$trusted_root/server" python \
            "$trusted_root/scripts/qa/launch-reliability-attestation.py" \
            verify \
            --receipt "$receipt_path" \
            --subject "$trusted_subject_path"

      - name: Remove the signing key from the self-hosted runner
        if: ${{ always() }}
        shell: bash
        env:
          KEY_PATH: ${{ runner.temp }}/longhouse-attestation-private-key.pem
        run: rm -f -- "$KEY_PATH"

      - name: Upload signed qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: launch-reliability-attestation-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/launch-reliability-measurement/launch-reliability-measurements.json
            ${{ runner.temp }}/launch-reliability-measurement/launch-reliability-attestation-subject.json
            ${{ runner.temp }}/trusted-launch-reliability-attestation-subject.json
            ${{ runner.temp }}/launch-reliability-attestation.json
