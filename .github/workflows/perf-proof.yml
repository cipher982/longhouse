name: Perf Proof

on:
  workflow_dispatch:
    inputs:
      startup_iterations:
        description: "Startup probe iterations"
        required: false
        default: "20"
        type: string
  schedule:
    - cron: "43 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/perf-proof.yml"
      - "Makefile"
      - "scripts/ci/perf-proof.py"
      - "scripts/ci/perf-soak.py"
      - "scripts/ci/perf_soak_fixtures.py"
      - "scripts/tests/perf-proof.test.py"
      - "desktop/LonghouseMenuBarHarness/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-proof-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  perf-proof:
    name: "Perf proof artifact"
    runs-on: cube-maint
    timeout-minutes: 30
    if: ${{ github.repository == 'cipher982/longhouse' }}
    env:
      PERF_PROOF_OUTPUT: artifacts/perf-proof/perf-proof-${{ github.sha }}.json
      PERF_PROOF_STARTUP_ITERATIONS: ${{ inputs.startup_iterations || '20' }}
      PERF_SOAK_OUTPUT: artifacts/perf-proof/perf-soak-linux-${{ github.sha }}.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05


      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Validate perf proof collector
        run: make validate-perf-proof

      - name: Run perf proof
        run: make perf-proof

      - name: Run Linux steady-state soak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/perf-soak.py \
            --output "$PERF_SOAK_OUTPUT" \
            --summary "${PERF_SOAK_OUTPUT%.json}.md"

      - name: Write job summary
        if: always()
        run: |
          for summary in "${PERF_PROOF_OUTPUT%.json}.md" "${PERF_SOAK_OUTPUT%.json}.md"; do
            if [[ -f "$summary" ]]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Perf proof summary missing: $summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload perf proof artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-proof-${{ github.sha }}
          path: |
            artifacts/perf-proof/*.json
            artifacts/perf-proof/*.md
          if-no-files-found: warn

  perf-soak-macos:
    name: "macOS engine and Desktop soak"
    runs-on: macos-15
    timeout-minutes: 45
    if: ${{ github.repository == 'cipher982/longhouse' }}
    env:
      PERF_SOAK_OUTPUT: artifacts/perf-proof/perf-soak-macos-${{ github.sha }}.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05

      - name: Build release engine
        run: |
          python3 scripts/build/generate_build_identity.py
          python3 scripts/build/cargo.py exec -- build --manifest-path engine/Cargo.toml --release --bin longhouse-engine

      - name: Build Desktop harness
        run: swift build -c release
        working-directory: desktop/LonghouseMenuBarHarness

      - name: Run macOS steady-state soak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/perf-soak.py \
            --output "$PERF_SOAK_OUTPUT" \
            --summary "${PERF_SOAK_OUTPUT%.json}.md"

      - name: Write job summary
        if: always()
        run: |
          summary="${PERF_SOAK_OUTPUT%.json}.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS soak summary missing: $summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload macOS perf proof artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-proof-macos-${{ github.sha }}
          path: |
            artifacts/perf-proof/*.json
            artifacts/perf-proof/*.md
          if-no-files-found: warn
