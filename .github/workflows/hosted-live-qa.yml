name: Hosted Live QA

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_call:
    inputs:
      source_sha:
        description: "Exact QA checkout commit"
        required: true
        type: string
      runtime_image_tag:
        description: "Image tag selected by the deployment"
        required: true
        type: string
      deployment_id:
        description: "The canary deployment receipt of the same commit (informational: QA deploys the image to its own instance)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA that triggered this async QA run"
        required: false
        type: string
      runtime_image_tag:
        description: "Image tag; defaults to source_sha or the observed clean build"
        required: false
        type: string
      deployment_id:
        description: "The canary deployment receipt of the same commit (informational: QA deploys the image to its own instance)"
        required: false
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  # QA owns one dedicated hosted instance (HOSTED_QA_SUBDOMAIN) for the whole
  # run: it deploys the exact commit under test there itself, so a push
  # redeploying the deploy canary (release-canary-a) cannot replace QA's target
  # (that was 19 of 100 runs failing on 09-26..09-29). The instance is a
  # mutex: one run holds it, the rest wait in arrival order and none is dropped
  # (`queue: max`, up to 100), so every commit that reaches QA gets its own
  # verdict. Measured on the 107 canary deploys since 09-26 with a 7 to 9.5 min
  # run, 17 to 29% of runs wait and the wait is p90 3 to 7 min, max 6 to 11 min.
  # `queue` is GitHub's 2026-05 addition (docs.github.com, "Control the
  # concurrency of workflows and jobs"); actionlint 1.7.12 does not know it yet.
  group: hosted-live-qa-${{ github.repository }}-${{ vars.HOSTED_QA_SUBDOMAIN }}
  queue: max

jobs:
  hosted-live-qa:
    name: "hosted-live-qa"
    runs-on: cube-browser
    if: github.repository == 'cipher982/longhouse'
    timeout-minutes: 25
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      deployed: ${{ steps.deploy_qa.outcome }}
    env:
      CONTROL_PLANE_URL: ${{ vars.HOSTED_CANARY_CONTROL_PLANE_URL }}
      CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.HOSTED_CANARY_CONTROL_PLANE_ADMIN_TOKEN }}
      # The QA instance's own device token (a tenant of the canary control plane
      # that only this workflow deploys to), not the deploy canary's.
      SMOKE_RUNTIME_TOKEN: ${{ secrets.HOSTED_QA_RUNTIME_TOKEN }}
      LONGHOUSE_MACHINE_TOKEN: ${{ secrets.HOSTED_QA_RUNTIME_TOKEN }}
      LONGHOUSE_CANARY_TOKEN: ${{ secrets.HOSTED_QA_TELEMETRY_TOKEN }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

      QA_INSTANCE_SUBDOMAIN: ${{ vars.HOSTED_QA_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      # The checkout above is the commit under QA, which can predate the deploy
      # and verdict tooling (a run dispatched today for an older commit), so the
      # tooling comes from the workflow's own commit, like the tests come from
      # the commit under test.
      - name: Check out the QA tooling at the workflow's commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: .qa-tools
          sparse-checkout: |
            scripts/lib/hosted-instance.sh
            scripts/ops/release-artifacts.py
            scripts/ops/runtime-deploy.sh
            scripts/qa/hosted-qa-verdict.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          show-progress: false

      - name: Validate the dedicated QA instance
        env:
          DEPLOY_CANARY_SUBDOMAIN: ${{ vars.HOSTED_CANARY_SUBDOMAIN }}
        run: |
          set -euo pipefail
          case "${QA_INSTANCE_SUBDOMAIN,,}" in
            ""|david010|demo|dogfood|personal)
              echo "::error::Configure a dedicated HOSTED_QA_SUBDOMAIN; refusing personal dogfood or demo." >&2
              exit 1
              ;;
          esac
          if [[ "${QA_INSTANCE_SUBDOMAIN,,}" == "${DEPLOY_CANARY_SUBDOMAIN,,}" ]]; then
            echo "::error::HOSTED_QA_SUBDOMAIN is the deploy canary ($DEPLOY_CANARY_SUBDOMAIN); QA needs an instance no push redeploys." >&2
            exit 1
          fi
          for name in CONTROL_PLANE_URL CONTROL_PLANE_ADMIN_TOKEN SMOKE_RUNTIME_TOKEN LONGHOUSE_MACHINE_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required QA configuration: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve exact published fixture image
        run: |
          set -euo pipefail
          key="$(python3 scripts/qa/test-isolation.py --print-image-key | jq -r '.tag')"
          image="ghcr.io/${{ github.repository_owner }}/longhouse-test:${key}"
          # CI publishes this multi-arch tag after its amd64 build, which runs
          # off CI's critical path; after a dependency change the deploy can
          # finish first, so wait for the tag (registry calls, no API quota).
          for attempt in $(seq 1 40); do
            if digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')"; then
              break
            fi
            [[ "$attempt" -lt 40 ]] || { echo "fixture image $image never appeared" >&2; exit 1; }
            echo "waiting for fixture image $image ($attempt/40)"
            sleep 30
          done
          echo "LONGHOUSE_TEST_IMAGE_REF=${image%:*}@${digest}" >> "$GITHUB_ENV"

      - name: Pull credential-free isolation image by digest
        id: prepare
        run: |
          set -euo pipefail
          echo "image=$(python3 scripts/qa/test-isolation.py --prepare)" >> "$GITHUB_OUTPUT"

      # Deploy the exact image under test to the QA instance, then hold it for
      # the run. The queue guarantees no other run deploys here meanwhile and
      # nothing else targets this instance. A scheduled run has no commit to
      # deploy: it re-measures whatever the instance last served.
      - name: Deploy the image under test to the QA instance
        id: deploy_qa
        if: ${{ inputs.runtime_image_tag != '' || inputs.source_sha != '' }}
        env:
          IMAGE_TAG: ${{ inputs.runtime_image_tag || inputs.source_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          INSTANCE_SUBDOMAIN: ${{ vars.HOSTED_QA_SUBDOMAIN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          RUNTIME_SOURCE_WORKFLOW: Hosted Live QA
          RUNTIME_QUALIFICATION_ID: hosted-live-qa-${{ github.run_id }}-${{ github.run_attempt }}
          RUNTIME_DEPLOYMENT_IDEMPOTENCY_KEY: hosted-live-qa-${{ github.run_id }}-${{ github.run_attempt }}
          RUNTIME_DEPLOY_TIMEOUT: "600"
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/longhouse-runtime"
          if [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            expected="$IMAGE_TAG"
          else
            expected="$(docker buildx imagetools inspect "$image:$IMAGE_TAG" --format '{{json .Image}}' |
              jq --exit-status --raw-output '.config.Labels["org.opencontainers.image.revision"] | select(type == "string" and test("^[0-9a-f]{40}$"))')"
          fi
          if [[ -n "$SOURCE_SHA" && "$expected" != "$SOURCE_SHA" ]]; then
            echo "::error::image $IMAGE_TAG holds $expected, not the commit under test $SOURCE_SHA" >&2
            exit 1
          fi
          # The control plane fences a deployment whose source order is below a
          # successful one already on the instance. QA order is the order runs
          # deploy, not commit order: a re-run of an older commit after a newer
          # one is a legitimate deployment here, not a late candidate.
          RUNTIME_SOURCE_ORDER="$(date +%s)"
          export RUNTIME_SOURCE_ORDER
          # The image's own revision label must equal this (the helper refuses a mismatch).
          export RUNTIME_SOURCE_SHA="$expected"
          export RUNTIME_DEPLOYMENT_REASON="hosted live QA of $expected"
          .qa-tools/scripts/ops/runtime-deploy.sh "$INSTANCE_SUBDOMAIN" --docker-image "$image" --docker-tag "$IMAGE_TAG"
          echo "expected_sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Verify the QA instance serves the commit under test
        id: runtime_before
        env:
          EXPECTED_SHA: ${{ steps.deploy_qa.outputs.expected_sha }}
        run: |
          set -euo pipefail
          # The verdict step needs the moment this run started depending on the
          # instance serving the commit below; any deployment overlapping the
          # run after this instant replaced the thing under test.
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          health="$(curl --fail --silent --show-error --max-time 15 --retry 3 --retry-all-errors --retry-delay 3 \
            "https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai/api/health")"
          printf '%s\n' "$health" | jq '{source_sha,build_identity,build}'
          actual_sha="$(printf '%s\n' "$health" | jq --exit-status --raw-output '(.source_sha // .build.source_sha // .build.commit) | select(type == "string" and test("^[0-9a-f]{40}$"))')"
          actual_build_identity="$(printf '%s\n' "$health" | jq --raw-output '(.build_identity // .build.build_identity // "-")')"
          if [[ -n "$EXPECTED_SHA" && "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "The QA instance serves $actual_sha, not the deployed $EXPECTED_SHA (build identity $actual_build_identity)" >&2
            exit 1
          fi
          {
            printf 'runtime_sha=%s\n' "$actual_sha"
            printf 'started_at=%s\n' "$started_at"
            printf 'runtime_build_identity=%s\n' "$actual_build_identity"
          } >> "$GITHUB_OUTPUT"

      # The four QA steps below that touch the instance are continue-on-error:
      # their outcomes are judged together, against the instance's deployment
      # receipts, by the verdict step. Nothing but this workflow deploys to the
      # instance, so a failure there is the commit's; if something did (an
      # operator), the run stands down as superseded instead of failing. The
      # step that never touches the instance (cohort contracts) still fails the
      # run directly.
      - name: Run hosted live QA
        id: qa_live
        continue-on-error: true
        run: |
          set -euo pipefail
          credentials="$(mktemp "$RUNNER_TEMP/hosted-live-credentials.XXXXXX.json")"
          trap 'rm -f "$credentials"' EXIT INT TERM
          chmod 600 "$credentials"
          python3 - "$credentials" <<'PY'
          import json
          import os
          import sys

          keys = (
              "CONTROL_PLANE_ADMIN_TOKEN",
              "SMOKE_RUNTIME_TOKEN",
              "LONGHOUSE_MACHINE_TOKEN",
          )
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(
                  {key: os.environ[key] for key in keys if os.environ.get(key)},
                  stream,
              )
          PY
          attempts=0
          until python3 scripts/qa/test-isolation.py \
            --live \
            --image "${{ steps.prepare.outputs.image }}" \
            --credentials "$credentials" \
            --target qa-live \
            --set "CONTROL_PLANE_URL=$CONTROL_PLANE_URL" \
            --set "QA_INSTANCE_SUBDOMAIN=$QA_INSTANCE_SUBDOMAIN" \
            --set "LONGHOUSE_API_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "PLAYWRIGHT_BASE_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "PLAYWRIGHT_API_BASE_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai"; do
            attempts=$((attempts + 1))
            if [[ "$attempts" -ge 2 ]]; then
              exit 1
            fi
            echo "qa-live failed; retrying once after 5s..." >&2
            sleep 5
          done

      - name: Run hosted mixed live/archive shipper bench
        id: hosted_shipper_bench
        continue-on-error: true
        if: always() && steps.qa_live.outcome == 'success' && env.SMOKE_RUNTIME_TOKEN != ''
        env:
          CARGO_PROFILE: ci
        run: |
          set -euo pipefail
          credentials="$(mktemp "$RUNNER_TEMP/hosted-bench-credentials.XXXXXX.json")"
          trap 'rm -f "$credentials"' EXIT INT TERM
          chmod 600 "$credentials"
          python3 - "$credentials" <<'PY'
          import json
          import os
          import sys

          keys = (
              "CONTROL_PLANE_ADMIN_TOKEN",
              "SMOKE_RUNTIME_TOKEN",
          )
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(
                  {key: os.environ[key] for key in keys if os.environ.get(key)},
                  stream,
              )
          PY
          python3 scripts/qa/test-isolation.py \
            --live \
            --image "${{ steps.prepare.outputs.image }}" \
            --credentials "$credentials" \
            --target hosted-shipper-mixed-bench \
            --set "CONTROL_PLANE_URL=$CONTROL_PLANE_URL" \
            --set "QA_INSTANCE_SUBDOMAIN=$QA_INSTANCE_SUBDOMAIN" \
            --set "LONGHOUSE_API_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "PLAYWRIGHT_API_BASE_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai"

      - name: Run render-canary SLA check
        id: render_canary
        continue-on-error: true
        if: always() && steps.qa_live.outcome == 'success' && env.SMOKE_RUNTIME_TOKEN != '' && env.LONGHOUSE_CANARY_TOKEN != ''
        run: |
          set -euo pipefail
          credentials="$(mktemp "$RUNNER_TEMP/render-canary-credentials.XXXXXX.json")"
          trap 'rm -f "$credentials"' EXIT INT TERM
          chmod 600 "$credentials"
          python3 - "$credentials" <<'PY'
          import json
          import os
          import sys

          keys = (
              "SMOKE_RUNTIME_TOKEN",
              "LONGHOUSE_CANARY_TOKEN",
          )
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(
                  {key: os.environ[key] for key in keys if os.environ.get(key)},
                  stream,
              )
          PY
          python3 scripts/qa/test-isolation.py \
            --live \
            --image "${{ steps.prepare.outputs.image }}" \
            --credentials "$credentials" \
            --target render-canary \
            --set "QA_INSTANCE_SUBDOMAIN=$QA_INSTANCE_SUBDOMAIN" \
            --set "LONGHOUSE_API_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "PLAYWRIGHT_BASE_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "PLAYWRIGHT_API_BASE_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai"

      - name: Validate cohort journey contracts
        id: cohort_contracts
        # Never touches the QA instance.
        if: always() && steps.qa_live.outcome == 'success'
        run: python3 scripts/qa/test-isolation.py --target validate-cohort-journey

      - name: Run privacy-safe isolated cohort journey
        id: cohort_journey
        continue-on-error: true
        if: always() && steps.qa_live.outcome == 'success'
        run: |
          set -euo pipefail
          credentials="$(mktemp "$RUNNER_TEMP/cohort-journey-credentials.XXXXXX.json")"
          trap 'rm -f "$credentials"' EXIT INT TERM
          chmod 600 "$credentials"
          python3 - "$credentials" <<'PY'
          import json
          import os
          import sys

          keys = (
              "CONTROL_PLANE_ADMIN_TOKEN",
              "SMOKE_RUNTIME_TOKEN",
          )
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(
                  {key: os.environ[key] for key in keys if os.environ.get(key)},
                  stream,
              )
          PY
          python3 scripts/qa/test-isolation.py \
            --live \
            --image "${{ steps.prepare.outputs.image }}" \
            --credentials "$credentials" \
            --target cohort-journey \
            --set "CONTROL_PLANE_URL=$CONTROL_PLANE_URL" \
            --set "QA_INSTANCE_SUBDOMAIN=$QA_INSTANCE_SUBDOMAIN" \
            --set "LONGHOUSE_API_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "PLAYWRIGHT_BASE_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "PLAYWRIGHT_API_BASE_URL=https://${QA_INSTANCE_SUBDOMAIN}.longhouse.ai" \
            --set "LONGHOUSE_JOURNEY_OUTPUT=/work/artifacts/cohort-journey/cohort-journey.json"

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Hosted Live QA"
            echo ""
            echo "- Instance: \`$QA_INSTANCE_SUBDOMAIN\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- QA source SHA: \`${{ inputs.source_sha || github.sha }}\`"
            echo "- Requested runtime image: \`${{ inputs.runtime_image_tag || inputs.source_sha || 'none (scheduled run: re-measures what the instance last served)' }}\`"
            echo "- QA deployment (this run's own): \`${{ steps.deploy_qa.outputs.deployment_id || 'none' }}\`"
            echo "- Canary deployment of the same commit (informational): \`${{ inputs.deployment_id || 'none' }}\`"
            echo "- Observed runtime SHA: \`${{ steps.runtime_before.outputs.runtime_sha || 'unavailable' }}\`"
            echo "- qa-live: \`${{ steps.qa_live.outcome || 'skipped' }}\`"
            echo "- hosted shipper mixed bench: \`${{ steps.hosted_shipper_bench.outcome || 'skipped' }}\`"
            echo "- render-canary: \`${{ steps.render_canary.outcome || 'skipped' }}\`"
            echo "- cohort contracts: \`${{ steps.cohort_contracts.outcome || 'skipped' }}\`"
            echo "- cohort journey: \`${{ steps.cohort_journey.outcome || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The verdict is judged against the QA instance's deployment receipts. The
      # instance is deployed only by this workflow, one run at a time, so a
      # deployment overlapping the run is someone else's (an operator); such a
      # run says nothing about its commit and stands down as superseded instead
      # of failing. The rules and the 09-26..09-29 run data that shaped them are
      # in scripts/qa/hosted-qa-verdict.py.
      - name: Decide verdict (passed, superseded or failed)
        id: verdict
        if: always() && steps.runtime_before.outcome == 'success'
        env:
          EXPECTED_RUNTIME_SHA: ${{ steps.runtime_before.outputs.runtime_sha }}
          QA_STARTED_AT: ${{ steps.runtime_before.outputs.started_at }}
          OWN_DEPLOYMENT: ${{ steps.deploy_qa.outputs.deployment_id }}
        run: |
          set -euo pipefail
          python3 .qa-tools/scripts/qa/hosted-qa-verdict.py \
            --expected-sha "$EXPECTED_RUNTIME_SHA" \
            --started-at "$QA_STARTED_AT" \
            --subdomain "$QA_INSTANCE_SUBDOMAIN" \
            --own-deployment "$OWN_DEPLOYMENT" \
            --step "qa_live=${{ steps.qa_live.outcome }}" \
            --step "hosted_shipper_bench=${{ steps.hosted_shipper_bench.outcome }}" \
            --step "render_canary=${{ steps.render_canary.outcome }}" \
            --step "cohort_journey=${{ steps.cohort_journey.outcome }}" \
            --step "cohort_contracts=${{ steps.cohort_contracts.outcome }}" \
            --receipt "$RUNNER_TEMP/hosted-live-qa-verdict.json"

      # The verdict, not the run's conclusion, is the QA evidence: a superseded
      # run also concludes success. `make promote-production` reads this
      # artifact by name, per commit, and accepts only verdict "passed"
      # (scripts/ops/promotion_gates.py). A re-run of the same commit replaces it.
      # Only a run that deployed its own image uploads one: the receipt names
      # the digest it tested, and the promotion compares it with the digest it
      # promotes. A scheduled run re-measures whatever the instance last served
      # (drift detection, not qualification) and would replace a digest-bearing
      # receipt with one that names none.
      - name: Upload verdict receipt
        if: always() && steps.verdict.outcome != 'skipped' && steps.deploy_qa.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-live-qa-verdict-${{ steps.runtime_before.outputs.runtime_sha }}
          path: ${{ runner.temp }}/hosted-live-qa-verdict.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

      - name: Stand down, QA instance redeployed by someone else
        if: always() && steps.verdict.outputs.verdict == 'superseded'
        run: echo "Something other than this run deployed to the QA instance while it ran, so QA says nothing about this commit. Re-run it; see the summary."

      - name: Upload privacy-safe cohort journey artifact
        # A failed journey writes no artifact; its failure is already reported
        # (and its evidence uploaded below), so a second "no files" failure here
        # would only bury the first.
        if: always() && steps.cohort_journey.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-isolation/**/files/1/cohort-journey/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload live QA artifacts
        # QA steps are continue-on-error so a superseded run can stand down;
        # their failures reach here through the verdict step's output.
        if: failure() || steps.verdict.outputs.failed_steps != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-live-qa-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-isolation/**
          if-no-files-found: ignore
          retention-days: 14

  # A passed verdict on the commit QA deployed can unblock production, so wake
  # the promoter. Its workflow_run trigger never fires for this workflow: Deploy
  # and Verify dispatches QA with GITHUB_TOKEN, and GitHub creates no run from an
  # event that token caused, except workflow_dispatch (which is what this is).
  # Promote Rings waits for this run to complete (`after_run`) before it reads
  # the verdict, because the gate accepts only a completed run. A job of its own
  # so only it holds `actions: write`; continue-on-error so a failed wake cannot
  # fail the run the QA gate reads (Sauron longhouse-ring-wake covers a lost one).
  wake-promoter:
    name: "Wake Promote Rings"
    needs: hosted-live-qa
    if: >-
      github.ref == 'refs/heads/main' && needs.hosted-live-qa.result == 'success' &&
      needs.hosted-live-qa.outputs.verdict == 'passed' && needs.hosted-live-qa.outputs.deployed == 'success'
    runs-on: cube-gate
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Dispatch Promote Rings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn --arg run "$GITHUB_RUN_ID" '{ref:"main",inputs:{after_run:$run}}')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/promote-rings.yml/dispatches"
          echo "Dispatched Promote Rings (after_run=$GITHUB_RUN_ID)"
