# ROLE: every terminal-truth check on every push that can change the result: live reply text and live thinking, tool
# and subagent rows, terminal to client, for the stock provider CLIs in Console and Helm against the fake model on the
# Linux pool, and the mutation tests that prove the gate still fails each known defect. Credential-free.
name: Terminal Truth

# How long after a provider paints (Helm) or the fake model writes (Console) a piece of live output does it reach a
# Longhouse client, and under the right kind? server/zerg/qa/terminal_truth.py measures and judges one cell;
# server/zerg/qa/terminal_truth_parallel.py (make terminal-truth-all) runs every cell of all five scenarios and the
# mutation tests side by side. Plan and measurements: control-plane/docs/specs/terminal-truth-ci-gate.md.
#
# One run is the whole gate: 58 unmutated cell runs (14 reply cells in two scenarios, 29 thinking, tool and subagent
# cells, one unmutated cell a mutation needs with other options) and 43 mutation checks (41 known defects put back one
# at a time, each of which the gate must fail at its stage, and two checks with no edit). Until 2026-11-13 a push ran
# the 14 long_reply cells in 9 to 13 minutes and everything else ran once a week in 75. What changed:
#   - Cells run side by side, each group on its own scratch host. A cell is 20 to 40 seconds of waiting on a paced
#     stream, and no cell needs another to have finished.
#   - Scratch is on the pod's RAM-backed work volume (TT_SCRATCH_ROOT). On a busy disk the Machine Agent holds live
#     text for seconds (three red push runs on 2026-11-12 and 13, and three of twelve cells on a bench with six hosts
#     writing to one NVMe); with scratch in memory the same twelve passed with medians under a quarter second.
#   - A mutation test reads its unmutated half from the gate's own run of that cell and runs only the mutated half.
#   - Mutated engines, the engine itself and the provider installs are kept under /ci-cache by a hash of what they are
#     built from. A push that does not touch engine/, config/ or schemas/ builds nothing. One that does builds the 33
#     mutated engines three at a time with incremental compilation (they were 18 minutes one after another).
#   - A row that came out wrong beside the others is run once more alone; the first result stays in the record.
#
# Triggers
#   push to main, paths below    the whole gate. The verdict is the commit status `longhouse/terminal-truth` and a CI
#                                receipt. Nothing consumes the status yet (promotion is unchanged).
#   schedule (nightly)           the whole gate with reruns off, so a red night is the raw rate. New failing cells are
#                                annotated as errors, and the Sauron job ci-scheduled-red pages after three red nights
#                                in a row. GitHub starts this repository's schedules 7 to 10 hours late.
#   workflow_dispatch            the same by hand, or narrowed (inputs below).
#
# THE PATH LIST BELOW IS THE ONE COPY. It is the push filter. When the promotion requirement is switched on (branch
# terminal-truth-promotion-gate), scripts/ops/dogfood-sensitive-paths.toml carries the same list in a marked block and
# a test fails if the two differ.
#
# No provider secret is passed to this job; every provider talks to the loopback scripted model and a cell fails
# closed if that model served no request. The only secrets in the environment are the CI receipt store's, used after
# the run. Provider versions are pinned in scripts/ci/terminal-truth-providers.toml and verified after install or
# unpack; a mismatch fails the job before any cell runs.
#
# Evidence: every cell's result, each shard's log, the verdict (gate.json), fleet.json (the plan, every shard's time,
# what was run again) and, for every shard with a row that came out wrong, the provider PTY recordings and host logs
# are kept as a CI receipt (scripts/ops/ci_receipts.py), not GitHub artifact storage, which
# scripts/ci/check-actions-storage.py forbids.

on:
  push:
    branches: [main]
    paths:
      # --- the Machine Agent and what it embeds; every mutated engine is rebuilt when these change
      - "engine/**"
      - "config/**"
      - "schemas/**"
      # --- the Runtime Host: ingest, live preview, stream, and the harness, scripted model and ledger under zerg/qa
      - "server/zerg/**"
      - "server/pyproject.toml"
      - "server/uv.lock"
      # --- clients that render the live preview
      - "web/src/features/session/useSessionWorkspace.ts"
      - "web/src/features/session/sessionActivityFeed.ts"
      - "web/src/features/session/TimelinePane.tsx"
      - "web/src/features/session/SessionRuntimeStrip.tsx"
      - "ios/Sources/Shared/Streams/SessionWorkspaceStream.swift"
      - "ios/Sources/LonghouseApp/Session/Runtime/ActivityPulseStore.swift"
      # --- the build wrapper, the pinned versions and this lane
      - "scripts/build/**"
      - "scripts/ci/terminal-truth-*"
      - "scripts/ci/terminal_truth_*.py"
      - ".github/workflows/terminal-truth.yml"
  schedule:
    # Nightly. GitHub starts this repository's schedules 7 to 10 hours late, so this lands at about 09:00 to 11:00Z.
    - cron: "13 1 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider (codex, claude, opencode, pi, omp, antigravity), a comma list, or 'all'"
        required: false
        default: "all"
        type: string
      mode:
        description: "Cells to run"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - console
          - helm
      tokens:
        description: "Tokens in the scripted reply"
        required: false
        default: "100"
        type: string
      rate:
        description: "Tokens per second"
        required: false
        default: "20"
        type: string
      repeats:
        description: "Passes of the reply cells (20 for the budget record); passes after the first run no other check and no rerun"
        required: false
        default: "1"
        type: string
      mutations:
        description: "Run the mutation tests"
        required: false
        default: true
        type: boolean
      mutation_names:
        description: "Run only these mutation checks, names separated by spaces (empty runs all 43)"
        required: false
        default: ""
        type: string
      rerun:
        description: "Run a row that came out wrong once more alone (off gives the raw rate, as the nightly)"
        required: false
        default: true
        type: boolean
      jobs:
        description: "Shards running at once"
        required: false
        default: "8"
        type: string
      publish_status:
        description: "Publish the commit status for this SHA (only honoured on main for the whole gate: every provider, both modes, the short stream, one pass, every mutation check, reruns on)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

# One run at a time. Two runs on the pool's two slots share one host: on 2026-11-12 a mutation run beside a pass made
# the pass fail (run 43311962428: an engine rebuild wrote 326 MB in one second and the scratch host's catalog call
# missed its deadline).
concurrency:
  group: terminal-truth-${{ github.repository }}
  cancel-in-progress: false

jobs:
  terminal-truth:
    name: "terminal-truth"
    runs-on: grind-browser
    if: github.repository == 'cipher982/longhouse'
    # A push that changes the engine also rebuilds it and every mutated engine. Only a run started by hand may use the
    # long limit (20 passes, or 400 tokens at 5/s). Every run shares one concurrency group, so a stuck run holds every
    # later one: the 2026-11-12 nightly sat on the queue for 3 h 40 min under the old flat 330.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 240 || 45 }}
    env:
      TT_EVENT: ${{ github.event_name }}
      TT_PROVIDER: ${{ inputs.provider || 'all' }}
      TT_MODE: ${{ inputs.mode || 'both' }}
      TT_TOKENS: ${{ inputs.tokens || '100' }}
      TT_RATE: ${{ inputs.rate || '20' }}
      TT_REPEATS: ${{ inputs.repeats || '1' }}
      TT_JOBS: ${{ inputs.jobs || '8' }}
      # The nightly measures the raw rate: nothing is run a second time.
      TT_RERUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.rerun)) && '0' || '1' }}
      TT_MUTATIONS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.mutations) && '0' || '1' }}
      TT_MUTATION_NAMES: ${{ inputs.mutation_names || '' }}
      TT_PUBLISH_REQUEST: ${{ inputs.publish_status && '1' || '0' }}
      # The pod's work volume is RAM-backed and /tmp is the host's shared disk. The path is too long for Codex's
      # bridge socket (107 bytes), so the run gives its shards a short link to it (short_scratch).
      TT_SCRATCH_ROOT: /home/runner/_work/tt
      GH_TOKEN: ${{ github.token }}
      CI_RECEIPTS_S3_ENDPOINT: ${{ secrets.CI_RECEIPTS_S3_ENDPOINT }}
      CI_RECEIPTS_S3_BUCKET: ${{ secrets.CI_RECEIPTS_S3_BUCKET }}
      CI_RECEIPTS_S3_PREFIX: ${{ secrets.CI_RECEIPTS_S3_PREFIX }}
      CI_RECEIPTS_S3_ACCESS_KEY_ID: ${{ secrets.CI_RECEIPTS_S3_ACCESS_KEY_ID }}
      CI_RECEIPTS_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_RECEIPTS_S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate inputs and decide what this run is
        run: |
          set -euo pipefail
          known=",codex,claude,opencode,pi,omp,antigravity,"
          providers="$TT_PROVIDER"
          if [[ "$providers" == all ]]; then
            providers="codex,claude,opencode,pi,omp,antigravity"
          fi
          if [[ ! "$providers" =~ ^[a-z,]+$ ]]; then
            echo "::error::Provider input contains unsafe characters." >&2
            exit 1
          fi
          IFS=',' read -r -a requested <<< "$providers"
          for provider in "${requested[@]}"; do
            if [[ -z "$provider" || "$known" != *",$provider,"* ]]; then
              echo "::error::Unsupported provider '$provider'; mock mode supports codex, claude, opencode, pi, omp, antigravity (cursor has no custom model endpoint)." >&2
              exit 1
            fi
          done
          case "$TT_MODE" in
            both|console|helm) ;;
            *) echo "::error::Unsupported mode: $TT_MODE" >&2; exit 1 ;;
          esac
          [[ "$TT_TOKENS" =~ ^[0-9]+$ ]] || { echo "::error::tokens must be an integer" >&2; exit 1; }
          [[ "$TT_RATE" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "::error::rate must be a number" >&2; exit 1; }
          [[ "$TT_REPEATS" =~ ^[0-9]+$ && "$TT_REPEATS" -ge 1 && "$TT_REPEATS" -le 30 ]] || { echo "::error::repeats must be 1 to 30" >&2; exit 1; }
          [[ "$TT_JOBS" =~ ^[0-9]+$ && "$TT_JOBS" -ge 1 && "$TT_JOBS" -le 32 ]] || { echo "::error::jobs must be 1 to 32" >&2; exit 1; }
          names_ok='^([a-z0-9-]+( [a-z0-9-]+)*)?$'
          [[ "$TT_MUTATION_NAMES" =~ $names_ok ]] || { echo "::error::mutation_names must be names separated by single spaces" >&2; exit 1; }
          # What narrows the run. Nothing here on a push or the nightly: they are the whole gate.
          narrow=""
          if [[ "$TT_PROVIDER" != all ]]; then
            for provider in "${requested[@]}"; do narrow+=" --provider $provider"; done
          fi
          if [[ "$TT_MODE" != both ]]; then narrow+=" --mode $TT_MODE"; fi
          if [[ "$TT_TOKENS" != 100 || "$TT_RATE" != 20 ]]; then narrow+=" --tokens $TT_TOKENS --rate $TT_RATE"; fi
          checks=""
          if [[ "$TT_MUTATIONS" != 1 ]]; then checks+=" --no-mutations"; fi
          for name in $TT_MUTATION_NAMES; do checks+=" --only $name"; done
          rerun=""
          if [[ "$TT_RERUN" != 1 ]]; then rerun=" --no-rerun"; fi
          # The commit status means "the whole gate passed on this commit". A push always is that; a dispatch only
          # when asked, on main, with nothing narrowed, one pass and reruns on.
          publish=0
          if [[ "$TT_EVENT" == push ]]; then
            publish=1
          elif [[ "$TT_EVENT" == workflow_dispatch && "$TT_PUBLISH_REQUEST" == 1 && "$GITHUB_REF" == refs/heads/main \
                  && -z "$narrow$checks$rerun" && "$TT_REPEATS" == 1 ]]; then
            publish=1
          elif [[ "$TT_PUBLISH_REQUEST" == 1 ]]; then
            echo "::warning::publish_status ignored: not main, or not the whole gate (every provider, both modes, 100 tokens at 20/s, one pass, every mutation check, reruns on)."
          fi
          # The caches are a hostPath shared by this pool's pods. Without it the run still works and builds everything.
          cache=/ci-cache/terminal-truth
          if ! { mkdir -p "$cache" 2>/dev/null && [[ -w "$cache" ]]; }; then cache="$RUNNER_TEMP/terminal-truth-cache"; fi
          mkdir -p artifacts/terminal-truth "$cache"
          {
            echo "TT_PROVIDERS=${providers}"
            echo "TT_PUBLISH=${publish}"
            echo "TT_NARROW_ARGS=${narrow}"
            echo "TT_CHECK_ARGS=${checks}"
            echo "TT_RERUN_ARGS=${rerun}"
            echo "TT_CACHE=${cache}"
            echo "TT_OUT=$GITHUB_WORKSPACE/artifacts/terminal-truth"
          } >> "$GITHUB_ENV"
          echo "this run: event=$TT_EVENT providers=$providers modes=$TT_MODE tokens=$TT_TOKENS rate=$TT_RATE repeats=$TT_REPEATS jobs=$TT_JOBS mutations=$TT_MUTATIONS rerun=$TT_RERUN narrowed='$narrow$checks' publish_status=$publish cache=$cache"

      - name: Status pending
        if: env.TT_PUBLISH == '1'
        run: |
          set -euo pipefail
          python3 scripts/ci/terminal_truth_status.py pending "terminal truth running"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Sync server environment
        run: uv sync --project server

      # The runner's own control: a fake TUI with a known schedule must be recovered by the screen reader,
      # a prompt stub lane must read as prompt and a late stub lane as late.
      - name: Harness self-check
        run: |
          set -euo pipefail
          make terminal-truth-selfcheck ARGS="--out $TT_OUT/selfcheck.json"

      # The engine and CLI the cells measure, built with the ci profile, or copied from the cache when a build of the
      # same engine sources, compiler, flags and release version is there (the build is two minutes of a run and seven
      # pushes in ten do not touch the engine).
      - name: Build engine and native longhouse CLI
        run: |
          set -euo pipefail
          make -s terminal-truth-engine ARGS="--out $RUNNER_TEMP/terminal-truth-engine --cache $TT_CACHE/engine" | tee "$TT_OUT/engine.txt"
          engine="$(sed -n 's/^engine=//p' "$TT_OUT/engine.txt")"
          cli="$(sed -n 's/^cli=//p' "$TT_OUT/engine.txt")"
          test -x "$engine"
          test -x "$cli"
          echo "TT_ENGINE=$engine" >> "$GITHUB_ENV"
          echo "TT_CLI=$cli" >> "$GITHUB_ENV"

      # Exactly the versions in scripts/ci/terminal-truth-providers.toml, in job-owned paths, installed with an
      # empty credential environment and a disposable HOME, or unpacked from the archive of that same install.
      # The path is fixed because it is part of the archive's key. `verify` fails the job if any binary reports a
      # different version.
      - name: Install pinned stock providers
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/terminal-truth-fixture"
          mkdir -p "$fixture_root/providers" "$fixture_root/home/.local/bin" "$fixture_root/bin"
          chmod 700 "$fixture_root"
          echo "TT_FIXTURE_ROOT=$fixture_root" >> "$GITHUB_ENV"
          python3 scripts/ci/terminal_truth_providers.py install --providers "$TT_PROVIDERS" \
            --root "$fixture_root/providers" --home "$fixture_root/home" --cache "$TT_CACHE/providers"
          install -m 755 "$TT_CLI" "$fixture_root/bin/longhouse"
          {
            echo "$fixture_root/bin"
            echo "$fixture_root/providers/node_modules/.bin"
            echo "$fixture_root/home/.local/bin"
          } >> "$GITHUB_PATH"

      - name: Verify provider versions match the pins
        run: |
          set -uo pipefail
          out="$TT_OUT/versions.txt"
          {
            echo "uname: $(uname -srm)"
            echo "cpus: $(nproc)  load: $(cut -d' ' -f1-3 /proc/loadavg)"
            echo "memory: $(free -m | awk '/^Mem:/ {print $2 " MB total, " $7 " MB available"}')"
            echo "pod limits: cpu $(cat /sys/fs/cgroup/cpu.max 2>/dev/null), memory $(cat /sys/fs/cgroup/memory.max 2>/dev/null)"
            echo "scratch: $(df -h --output=source,size,avail "$(dirname "$TT_SCRATCH_ROOT")" | tail -1)"
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "python: $(python3 --version 2>&1)"
            echo "node: $(node --version 2>&1)"
            echo "engine: $("$TT_ENGINE" --version 2>&1 | head -1)"
            echo "longhouse: $(longhouse --version 2>&1 | head -1)"
            sed -n 's/^cache=/engine build cache: /p' "$TT_OUT/engine.txt"
            python3 scripts/ci/terminal_truth_providers.py verify --providers "$TT_PROVIDERS"
            echo "verify-exit: $?"
          } 2>&1 | tee "$out"
          { echo "## Provider versions (pinned)"; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^verify-exit: 0$' "$out"; then exit 0; fi
          echo "::error::installed provider versions differ from scripts/ci/terminal-truth-providers.toml"
          exit 1

      # One command runs everything and judges it: every unmutated cell of all five scenarios side by side, each
      # group on its own scratch host, then per mutation the mutated half only. It builds the mutated engines that
      # are not in the cache, runs a row that came out wrong once more alone (never on the nightly), keeps the
      # scratch of every shard with a wrong row, and exits non-zero unless every planned item has a good verdict.
      # Its tables go to the job summary; its exit status is not trusted alone (Verdict reads the files).
      - name: Run every check
        run: |
          set +e
          mkdir -p "$TT_SCRATCH_ROOT"
          vmstat -t 1 > "$TT_OUT/vmstat.log" 2>&1 &
          sampler=$!
          start="$(date +%s)"
          make -s terminal-truth-all ARGS="--engine $TT_ENGINE --longhouse-cli $TT_CLI --out-dir $TT_OUT --jobs $TT_JOBS --mutation-cache $TT_CACHE/mutants --embed-model-cache $TT_CACHE/embedding-model$TT_NARROW_ARGS$TT_CHECK_ARGS$TT_RERUN_ARGS" \
            < /dev/null 2> "$TT_OUT/run.log" | tee "$TT_OUT/tables.md"
          rc="${PIPESTATUS[0]}"
          # The run's own log without the compiler's warnings: what was built, each shard's exit and time, what ran again.
          grep -aE '^(built |mutated engines|[0-9]+ cell runs|running |[0-9]+ rows|.*: exit )' "$TT_OUT/run.log"
          echo "the run exited $rc after $(( $(date +%s) - start )) s"
          # More passes of the reply cells, for the budget record: no other check and no rerun. Each writes its own
          # pass-<i>-<scenario>.json, which Verdict requires.
          for i in $(seq 2 "$TT_REPEATS"); do
            make -s terminal-truth-all ARGS="--engine $TT_ENGINE --longhouse-cli $TT_CLI --out-dir $TT_OUT/pass-$i --jobs $TT_JOBS --scenario long_reply --scenario two_message --no-mutations --no-rerun --pass-index $i --embed-model-cache $TT_CACHE/embedding-model$TT_NARROW_ARGS" \
              < /dev/null > "$TT_OUT/pass-$i.log" 2>&1
            echo "pass $i exited $?: $(tail -1 "$TT_OUT/pass-$i.log")"
            cp "$TT_OUT/pass-$i"/pass-"$i"-*.json "$TT_OUT/" 2>/dev/null
          done
          kill "$sampler" 2>/dev/null
          echo "TT_RC=$rc" >> "$GITHUB_ENV"
          if [[ "$rc" != 0 ]]; then echo "::error::the run exited $rc: the rows that are not good are in the job summary"; fi
          exit 0

      # Fail closed: the run's exit status alone is not trusted. fleet.json must exist, every cell it planned must
      # have a good verdict, every planned mutation check an ok row, every reply pass a result file, and every
      # measured reply cell's scripted model must have served a request. A push, the nightly and a status-publishing
      # run must be the whole gate. The previous nightly's verdict, when there is one, marks which failures are new.
      - name: Verdict
        id: verdict
        run: |
          set +e
          previous=()
          if [[ "$TT_EVENT" == schedule ]]; then
            mkdir -p "$RUNNER_TEMP/previous-nightly"
            if python3 scripts/ops/ci_receipts.py get terminal-truth-nightly nightly --file gate.json > "$RUNNER_TEMP/previous-nightly/gate.json" 2>/dev/null; then
              previous=(--previous "$RUNNER_TEMP/previous-nightly")
            fi
          fi
          whole=()
          if [[ "$TT_EVENT" != workflow_dispatch || "$TT_PUBLISH" == 1 ]]; then whole=(--gate-profile); fi
          python3 scripts/ci/terminal_truth_summary.py "$TT_OUT" --repeats "$TT_REPEATS" "${whole[@]}" "${previous[@]}"
          rc=$?
          { cat "$TT_OUT/summary.md"; echo; cat "$TT_OUT/tables.md" 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$rc" != 0 || "${TT_RC:-1}" != 0 ]]; then
            echo "TT_STATE=failure" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "TT_STATE=success" >> "$GITHUB_ENV"

      - name: Collect recordings and keep the results
        if: always()
        run: |
          set -uo pipefail
          # The scratch of every shard with a row that came out wrong: PTY recordings and host, model and engine logs;
          # never the provider home (h/), the scratch host's home (host-home/, which holds its generated key) or the
          # SQLite database. Then the Machine Agent's own logs from the provider
          # home (Codex bridge and Console worker stderr, launcher logs): the only record of why a provider launch or
          # a live-event POST stalled. Log files only.
          python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1])).get("kept_scratch", [])))' "$TT_OUT/fleet.json" 2>/dev/null \
            | sed "s|^$TT_SCRATCH_ROOT/||" | { grep -E '^[0-9a-f]+$' || true; } > "$TT_OUT/scratch-kept.txt"  # nothing kept is a clean run
          if [[ -s "$TT_OUT/scratch-kept.txt" ]]; then
            (cd "$TT_SCRATCH_ROOT" && tar --exclude='*/h' --exclude='*/host-home' --exclude='*.db' --exclude='*.db-*' -czf "$TT_OUT/scratch-recordings.tgz" -T "$TT_OUT/scratch-kept.txt")
            (cd "$TT_SCRATCH_ROOT" && while read -r d; do find "$d" -path '*/h/.longhouse/*' -name '*.log' -type f 2>/dev/null; done < "$TT_OUT/scratch-kept.txt" > "$TT_OUT/scratch-machine-logs.lst"
              if [[ -s "$TT_OUT/scratch-machine-logs.lst" ]]; then tar -czf "$TT_OUT/scratch-machine-logs.tgz" -T "$TT_OUT/scratch-machine-logs.lst"; fi)
          fi
          # Each shard's log and result rows.
          if [[ -d "$TT_OUT/shards" ]]; then tar -czf "$TT_OUT/shards.tgz" -C "$TT_OUT" shards; fi
          ls -la "$TT_OUT"
          files=()
          for f in "$TT_OUT"/*; do [[ -f "$f" && "$f" != *.lst ]] && files+=("$f"); done
          python3 scripts/ops/ci_receipts.py put terminal-truth "$GITHUB_SHA" "${files[@]}" || echo "::warning::receipt not stored"
          # The nightly's verdict is what the next nightly compares itself with.
          if [[ "$TT_EVENT" == schedule && -f "$TT_OUT/gate.json" ]]; then
            python3 scripts/ops/ci_receipts.py put terminal-truth-nightly nightly "$TT_OUT/gate.json" "$TT_OUT/summary.md" || echo "::warning::nightly receipt not stored"
          fi

      - name: Status result
        if: always() && env.TT_PUBLISH == '1'
        run: |
          set -uo pipefail
          state="${TT_STATE:-error}"
          [[ "$state" == success || "$state" == failure ]] || state=error
          description="terminal truth: $state"
          if [[ -f "$TT_OUT/gate.json" ]]; then
            description="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["description"][:140])' "$TT_OUT/gate.json")"
          fi
          python3 scripts/ci/terminal_truth_status.py "$state" "$description"

      - name: Remove owned state
        if: always()
        run: |
          set -uo pipefail
          # The step shell runs with errexit (bash -e), so a pkill that matches nothing must not end it. A Codex Helm
          # cell can leave its bridge (and the codex and channel processes under it) running; the run stops what each
          # shard left, and this stops whatever is left of this job's own binaries, scratch and fixture.
          if [[ -n "${TT_ENGINE:-}" ]]; then pkill -f "$TT_ENGINE (codex-bridge|claude-channel|omp-helm|pi-helm)" 2>/dev/null || true; fi
          if [[ -n "${TT_CACHE:-}" ]]; then pkill -f "$TT_CACHE/mutants/" 2>/dev/null || true; fi
          pkill -f "$TT_SCRATCH_ROOT/" 2>/dev/null || true
          # The run gives its shards a short link to the scratch root (/tmp/tt<4 hex>: Codex's socket path has to fit
          # in 107 bytes) and removes it at its end; a run that was killed leaves the link and processes named by it.
          for link in /tmp/tt[0-9a-f][0-9a-f][0-9a-f][0-9a-f]; do
            if [[ -L "$link" && "$(readlink "$link")" == "$TT_SCRATCH_ROOT" ]]; then
              pkill -f "$link/" 2>/dev/null || true
              rm -f -- "$link"
            fi
          done
          for dir in "$TT_SCRATCH_ROOT" "$(dirname "$TT_SCRATCH_ROOT")/tt-mut"; do
            if [[ "$dir" == /home/runner/_work/tt* ]]; then
              chmod -R u+w "$dir" 2>/dev/null || true
              rm -rf -- "$dir" || echo "::warning::could not remove $dir"
            fi
          done
          if [[ -n "${TT_FIXTURE_ROOT:-}" && "$TT_FIXTURE_ROOT" == "$RUNNER_TEMP"/* ]]; then
            pkill -f "$TT_FIXTURE_ROOT/" 2>/dev/null || true
            chmod -R u+w "$TT_FIXTURE_ROOT" 2>/dev/null || true
            rm -rf -- "$TT_FIXTURE_ROOT" || echo "::warning::could not remove $TT_FIXTURE_ROOT"
          fi
          exit 0
