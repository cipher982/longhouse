# ROLE: gate and nightly measurement of live reply text, terminal to client, for the stock provider CLIs
# in Console and Helm against the fake model on the Linux pool. Credential-free.
name: Terminal Truth

# How long after a provider paints (Helm) or the fake model writes (Console) a piece of reply text does
# that text reach a Longhouse client? server/zerg/qa/terminal_truth.py measures it and judges each cell
# (stage verdicts, a non-zero exit on any non-pass). Plan: control-plane/docs/specs/terminal-truth-ci-gate.md.
#
# Triggers
#   push to main, live-preview paths only   short pass of every declared cell; the verdict is the commit
#                                            status `longhouse/terminal-truth` and a CI receipt. Nothing
#                                            consumes the status yet (promotion is unchanged).
#   schedule (nightly)                       400 tokens at 5/s, one pass, long_reply and two_message
#                                            scenarios (about 50 minutes on the runner), then the mutation
#                                            tests. Five passes would hold the one runner slot for over four
#                                            hours (the first nightly, 2026-11-12, measured 51 and 49 minutes
#                                            for its first two), with every push run queued behind them and
#                                            about an hour of the job's 330-minute limit left for the mutation
#                                            tests. GitHub started that 07:43Z schedule at 16:17Z, so the
#                                            nightly cannot be assumed to run while nobody is pushing.
#                                            Repeats are for a dispatched run. A red run is the finding:
#                                            new failing cells are annotated as errors, and the Sauron job
#                                            ci-scheduled-red pages after three red nights in a row.
#   workflow_dispatch                        any of the above by hand (inputs below).
#
# Reruns (push and dispatch, never the nightly): a cell whose only failure is a slow live median, with every marker
# delivered in order and complete, is run once more alone, and the pass counts if the rerun passes. At most two cells a
# pass; both results are kept and gate.json lists them under passed_on_rerun. The rule and its reason are in
# scripts/ci/terminal_truth_summary.py.
#
# THE LIVE-PREVIEW PATH LIST BELOW IS THE ONE COPY. It is the push filter. When the promotion requirement is
# switched on (branch terminal-truth-promotion-gate), scripts/ops/dogfood-sensitive-paths.toml carries the same
# list in a marked block and a test fails if the two differ.
#
# No provider secret is passed to this job; every provider talks to the loopback scripted model and a cell
# fails closed if that model served no request. The only secrets in the environment are the CI receipt
# store's, used after the run. Provider versions are pinned in scripts/ci/terminal-truth-providers.toml and
# verified after install; a mismatch fails the job before any cell runs.
#
# Evidence: per-pass results JSON, logs, the verdict (gate.json) and, for the first pass and every failing
# pass, the provider PTY recordings and host logs are kept as a CI receipt (scripts/ops/ci_receipts.py), not
# GitHub artifact storage, which scripts/ci/check-actions-storage.py forbids.

on:
  push:
    branches: [main]
    paths:
      # --- engine: provider adapters and launchers, the runtime-event path (outbox, lanes, status slots)
      - "engine/src/*_print.rs"
      - "engine/src/*_helm_launcher.rs"
      - "engine/src/*_bridge.rs"
      - "engine/src/codex_exec.rs"
      - "engine/src/codex_ws_relay.rs"
      - "engine/src/opencode_run.rs"
      - "engine/src/console_sink.rs"
      - "engine/src/console_rpc.rs"
      - "engine/src/status_slot.rs"
      - "engine/src/outbox.rs"
      - "engine/src/daemon/status_slots.rs"
      - "engine/src/daemon/outbox_lanes.rs"
      - "engine/src/daemon/managed_observation.rs"
      # --- provider extensions and hooks
      - "engine/assets/longhouse-pi-helm.ts"
      - "engine/assets/longhouse-omp-helm.ts"
      - "engine/assets/claude-mod/**"
      - "server/zerg/services/antigravity_hook_inbox.py"
      # --- host: runtime ingest, live preview and stream
      - "server/zerg/routers/runtime.py"
      - "server/zerg/routers/timeline.py"
      - "server/zerg/services/session_live_previews.py"
      - "server/zerg/services/session_runtime.py"
      - "server/zerg/services/session_runtime_display.py"
      - "server/zerg/services/session_pubsub.py"
      - "server/zerg/services/session_workspace_revision.py"
      - "server/zerg/services/timeline_session_stream.py"
      # --- clients that render the live preview
      - "web/src/features/session/useSessionWorkspace.ts"
      - "web/src/features/session/sessionActivityFeed.ts"
      - "web/src/features/session/TimelinePane.tsx"
      - "web/src/features/session/SessionRuntimeStrip.tsx"
      - "ios/Sources/Shared/Streams/SessionWorkspaceStream.swift"
      - "ios/Sources/LonghouseApp/Session/Runtime/ActivityPulseStore.swift"
      # --- the harness, the scripted model, the ledger it reads, the pinned versions, the budget and this lane
      - "server/zerg/qa/terminal_truth*.py"
      - "server/zerg/qa/terminal_screen.py"
      - "server/zerg/qa/scripted_model_*.py"
      - "server/zerg/qa/pty_*.py"
      - "schemas/managed_providers.yml"
      - "schemas/terminal-truth-budget.json"
      - "scripts/ci/terminal-truth-*"
      - "scripts/ci/terminal_truth_*.py"
      - ".github/workflows/terminal-truth.yml"
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider (codex, claude, opencode, pi, omp, antigravity), a comma list, or 'all'"
        required: false
        default: "all"
        type: string
      mode:
        description: "Cells to run"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - console
          - helm
      tokens:
        description: "Tokens in the scripted reply"
        required: false
        default: "100"
        type: string
      rate:
        description: "Tokens per second"
        required: false
        default: "20"
        type: string
      repeats:
        description: "Consecutive passes in this one job (20 for the budget record)"
        required: false
        default: "1"
        type: string
      scenarios:
        description: "Scenarios per pass"
        required: false
        default: "long_reply"
        type: choice
        options:
          - long_reply
          - two_message
          - both
      mutations:
        description: "Also run the mutation tests (rebuilds the engine several times)"
        required: false
        default: false
        type: boolean
      publish_status:
        description: "Publish the commit status for this SHA (only honoured on main with all providers, both modes, the short stream, one pass, long_reply)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

concurrency:
  group: terminal-truth-${{ github.repository }}
  cancel-in-progress: false

jobs:
  terminal-truth:
    name: "terminal-truth"
    runs-on: grind-browser
    if: github.repository == 'cipher982/longhouse'
    timeout-minutes: 330
    env:
      TT_EVENT: ${{ github.event_name }}
      TT_PROVIDER: ${{ inputs.provider || 'all' }}
      TT_MODE: ${{ inputs.mode || 'both' }}
      TT_TOKENS: ${{ inputs.tokens || (github.event_name == 'schedule' && '400') || '100' }}
      TT_RATE: ${{ inputs.rate || (github.event_name == 'schedule' && '5') || '20' }}
      TT_REPEATS: ${{ inputs.repeats || '1' }}
      TT_RERUN: ${{ github.event_name != 'schedule' && '1' || '0' }}
      TT_SCENARIO_INPUT: ${{ inputs.scenarios || (github.event_name == 'schedule' && 'both') || 'long_reply' }}
      TT_MUTATIONS: ${{ (github.event_name == 'schedule' || inputs.mutations) && '1' || '0' }}
      TT_PUBLISH_REQUEST: ${{ inputs.publish_status && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
      CI_RECEIPTS_S3_ENDPOINT: ${{ secrets.CI_RECEIPTS_S3_ENDPOINT }}
      CI_RECEIPTS_S3_BUCKET: ${{ secrets.CI_RECEIPTS_S3_BUCKET }}
      CI_RECEIPTS_S3_PREFIX: ${{ secrets.CI_RECEIPTS_S3_PREFIX }}
      CI_RECEIPTS_S3_ACCESS_KEY_ID: ${{ secrets.CI_RECEIPTS_S3_ACCESS_KEY_ID }}
      CI_RECEIPTS_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_RECEIPTS_S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate inputs and decide what this run is
        run: |
          set -euo pipefail
          known=",codex,claude,opencode,pi,omp,antigravity,"
          providers="$TT_PROVIDER"
          if [[ "$providers" == all ]]; then
            providers="codex,claude,opencode,pi,omp,antigravity"
          fi
          if [[ ! "$providers" =~ ^[a-z,]+$ ]]; then
            echo "::error::Provider input contains unsafe characters." >&2
            exit 1
          fi
          IFS=',' read -r -a requested <<< "$providers"
          for provider in "${requested[@]}"; do
            if [[ -z "$provider" || "$known" != *",$provider,"* ]]; then
              echo "::error::Unsupported provider '$provider'; mock mode supports codex, claude, opencode, pi, omp, antigravity (cursor has no custom model endpoint)." >&2
              exit 1
            fi
          done
          case "$TT_MODE" in
            both|console|helm) ;;
            *) echo "::error::Unsupported mode: $TT_MODE" >&2; exit 1 ;;
          esac
          [[ "$TT_TOKENS" =~ ^[0-9]+$ ]] || { echo "::error::tokens must be an integer" >&2; exit 1; }
          [[ "$TT_RATE" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "::error::rate must be a number" >&2; exit 1; }
          [[ "$TT_REPEATS" =~ ^[0-9]+$ && "$TT_REPEATS" -ge 1 && "$TT_REPEATS" -le 30 ]] || { echo "::error::repeats must be 1 to 30" >&2; exit 1; }
          case "$TT_SCENARIO_INPUT" in
            both) scenarios="long_reply,two_message" ;;
            long_reply|two_message) scenarios="$TT_SCENARIO_INPUT" ;;
            *) echo "::error::Unsupported scenarios: $TT_SCENARIO_INPUT" >&2; exit 1 ;;
          esac
          # The commit status means "the gate profile passed on this commit": every provider, both modes,
          # the short stream, one pass, long_reply. A push always is that; a dispatch only when asked and
          # only on main with those settings.
          publish=0
          if [[ "$TT_EVENT" == push ]]; then
            publish=1
          elif [[ "$TT_EVENT" == workflow_dispatch && "$TT_PUBLISH_REQUEST" == 1 && "$GITHUB_REF" == refs/heads/main \
                  && "$TT_PROVIDER" == all && "$TT_MODE" == both && "$TT_TOKENS" == 100 && "$TT_RATE" == 20 \
                  && "$TT_REPEATS" == 1 && "$scenarios" == long_reply ]]; then
            publish=1
          elif [[ "$TT_PUBLISH_REQUEST" == 1 ]]; then
            echo "::warning::publish_status ignored: not main, or not the gate profile (all providers, both modes, 100 tokens at 20/s, one pass, long_reply)."
          fi
          # Providers and modes the pass covers: the harness runs every declared cell unless narrowed.
          provider_args=""
          if [[ "$TT_PROVIDER" != all ]]; then
            for provider in "${requested[@]}"; do provider_args+=" --provider $provider"; done
          fi
          mode_args=""
          if [[ "$TT_MODE" != both ]]; then mode_args=" --mode $TT_MODE"; fi
          {
            echo "TT_PROVIDERS=${providers}"
            echo "TT_SCENARIOS=${scenarios}"
            echo "TT_PUBLISH=${publish}"
            echo "TT_PROVIDER_ARGS=${provider_args}"
            echo "TT_MODE_ARGS=${mode_args}"
          } >> "$GITHUB_ENV"
          mkdir -p artifacts/terminal-truth
          echo "TT_OUT=$GITHUB_WORKSPACE/artifacts/terminal-truth" >> "$GITHUB_ENV"
          echo "this run: event=$TT_EVENT providers=$providers modes=$TT_MODE tokens=$TT_TOKENS rate=$TT_RATE repeats=$TT_REPEATS scenarios=$scenarios mutations=$TT_MUTATIONS publish_status=$publish"

      - name: Status pending
        if: env.TT_PUBLISH == '1'
        run: |
          set -euo pipefail
          python3 scripts/ci/terminal_truth_status.py pending "terminal truth running"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Sync server environment
        run: uv sync --project server

      # The runner's own control: a fake TUI with a known schedule must be recovered by the screen reader,
      # a prompt stub lane must read as prompt and a late stub lane as late.
      - name: Harness self-check
        run: |
          set -euo pipefail
          make terminal-truth-selfcheck ARGS="--out $TT_OUT/selfcheck.json"

      - name: Build engine and native longhouse CLI
        run: |
          set -euo pipefail
          # engine/build.rs requires the checkout-scoped identity before any cargo invocation.
          python3 scripts/build/generate_build_identity.py --output "$GITHUB_WORKSPACE/.build/build-identity.json"
          test -s "$GITHUB_WORKSPACE/.build/build-identity.json"
          python3 scripts/build/cargo.py exec -- \
            build --manifest-path "$GITHUB_WORKSPACE/engine/Cargo.toml" --profile ci --bin longhouse-engine --bin longhouse
          engine="$(python3 scripts/build/cargo.py artifact --profile ci --bin longhouse-engine)"
          cli="$(python3 scripts/build/cargo.py artifact --profile ci --bin longhouse)"
          test -x "$engine"
          test -x "$cli"
          echo "TT_ENGINE=$engine" >> "$GITHUB_ENV"
          echo "TT_CLI=$cli" >> "$GITHUB_ENV"

      # Exactly the versions in scripts/ci/terminal-truth-providers.toml, in job-owned paths, installed with an
      # empty credential environment and a disposable HOME. `verify` fails the job if any binary reports a
      # different version.
      - name: Install pinned stock providers
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d "$RUNNER_TEMP/terminal-truth-fixture.XXXXXX")"
          chmod 700 "$fixture_root"
          echo "TT_FIXTURE_ROOT=$fixture_root" >> "$GITHUB_ENV"
          mkdir -p "$fixture_root/providers" "$fixture_root/home/.local/bin" "$fixture_root/bin"
          python3 scripts/ci/terminal_truth_providers.py install --providers "$TT_PROVIDERS" \
            --root "$fixture_root/providers" --home "$fixture_root/home"
          install -m 755 "$TT_CLI" "$fixture_root/bin/longhouse"
          {
            echo "$fixture_root/bin"
            echo "$fixture_root/providers/node_modules/.bin"
            echo "$fixture_root/home/.local/bin"
          } >> "$GITHUB_PATH"

      - name: Verify provider versions match the pins
        run: |
          set -uo pipefail
          out="$TT_OUT/versions.txt"
          {
            echo "uname: $(uname -srm)"
            echo "cpus: $(nproc)  load: $(cut -d' ' -f1-3 /proc/loadavg)"
            echo "memory: $(free -m | awk '/^Mem:/ {print $2 " MB total, " $7 " MB available"}')"
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "python: $(python3 --version 2>&1)"
            echo "node: $(node --version 2>&1)"
            echo "engine: $("$TT_ENGINE" --version 2>&1 | head -1)"
            echo "longhouse: $(longhouse --version 2>&1 | head -1)"
            python3 scripts/ci/terminal_truth_providers.py verify --providers "$TT_PROVIDERS"
            echo "verify-exit: $?"
          } 2>&1 | tee "$out"
          { echo "## Provider versions (pinned)"; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^verify-exit: 0$' "$out"; then exit 0; fi
          echo "::error::installed provider versions differ from scripts/ci/terminal-truth-providers.toml"
          exit 1

      # One harness invocation per pass and scenario: a stable exit status per pass, and a failed pass does not
      # hide the passes after it. The harness judges every declared cell and exits non-zero on any non-pass, any
      # declared cell that did not run and any stale known-bad declaration. Scratch (PTY recordings, host logs)
      # is kept for the first pass and for every failing pass; other passes are deleted as they finish.
      - name: Run passes
        run: |
          set +e
          scratch="${TT_SCRATCH_ROOT:-/tmp/agents/tt}"
          mkdir -p "$scratch"
          find "$scratch" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$TT_OUT/scratch-before.txt"
          : > "$TT_OUT/scratch-kept.txt"
          timings="$TT_OUT/pass-timings.tsv"
          printf 'pass\tscenario\tstart_epoch\tend_epoch\texit\n' > "$timings"
          vmstat -t 1 > "$TT_OUT/vmstat.log" 2>&1 &
          sampler=$!
          failed=0
          for i in $(seq 1 "$TT_REPEATS"); do
            for scenario in ${TT_SCENARIOS//,/ }; do
              name="pass-$i-$scenario"
              echo "::group::$name"
              find "$scratch" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/before.txt"
              start="$(date +%s.%N)"
              make terminal-truth ARGS="run$TT_PROVIDER_ARGS$TT_MODE_ARGS --scenario $scenario --tokens $TT_TOKENS --rate $TT_RATE --engine $TT_ENGINE --longhouse-cli $TT_CLI --keep --out $TT_OUT/$name.json" 2>&1 | tee "$TT_OUT/$name.log"
              rc="${PIPESTATUS[0]}"
              end="$(date +%s.%N)"
              echo "::endgroup::"
              # A cell whose only failure is a slow live median (every marker arrived, in order, complete) is run
              # once more, alone: on this shared host about one cell in 240 is slowed by a neighbour's disk burst.
              # terminal_truth_summary.py names the cells (none if anything else failed, or more than two are slow)
              # and is also what accepts or refuses the reruns in the Verdict step. Never on the nightly, which
              # measures the raw rate.
              cleared=0
              if [[ "$rc" != 0 && "$TT_RERUN" == 1 ]]; then
                python3 scripts/ci/terminal_truth_summary.py --rerun-candidates "$TT_OUT/$name.json" > "$RUNNER_TEMP/rerun.txt"
                if [[ -s "$RUNNER_TEMP/rerun.txt" ]]; then
                  cleared=1
                  while read -r provider mode; do
                    again="$name.rerun-$provider-$mode"
                    echo "::group::$again"
                    make terminal-truth ARGS="run --provider $provider --mode $mode --scenario $scenario --tokens $TT_TOKENS --rate $TT_RATE --engine $TT_ENGINE --longhouse-cli $TT_CLI --keep --out $TT_OUT/$again.json" < /dev/null 2>&1 | tee "$TT_OUT/$again.log"
                    [[ "${PIPESTATUS[0]}" == 0 ]] || cleared=0
                    echo "::endgroup::"
                  done < "$RUNNER_TEMP/rerun.txt"
                fi
              fi
              # A Codex Helm cell leaves its bridge (and the codex and channel processes under it) running after
              # the pass (seen on the Mac, parent pid 1). Stop what this job's own binaries left behind so passes
              # do not accumulate them: only processes whose executable is this job's engine or fixture root.
              pkill -f "$TT_ENGINE (codex-bridge|claude-channel|omp-helm|pi-helm)" 2>/dev/null || true
              pkill -f "$TT_FIXTURE_ROOT/" 2>/dev/null || true
              printf '%s\t%s\t%s\t%s\t%s\n' "$i" "$scenario" "$start" "$end" "$rc" >> "$timings"
              find "$scratch" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | comm -13 "$RUNNER_TEMP/before.txt" - > "$TT_OUT/$name.scratch"
              if [[ "$rc" != 0 && "$cleared" == 1 ]]; then
                echo "::warning::$name exited $rc on a slow live median and passed on a rerun: $(tr '\n' ' ' < "$RUNNER_TEMP/rerun.txt")"
              elif [[ "$rc" != 0 ]]; then
                echo "::error::$name exited $rc"
                failed=1
              fi
              if [[ "$rc" != 0 || "$i" == 1 ]]; then
                sed "s|^|$name |" "$TT_OUT/$name.scratch" >> "$TT_OUT/scratch-kept.txt"
              else
                while IFS= read -r dir; do
                  [[ "$dir" =~ ^[0-9a-f]{4}$ ]] && rm -rf -- "${scratch:?}/$dir"
                done < "$TT_OUT/$name.scratch"
              fi
            done
          done
          kill "$sampler" 2>/dev/null
          echo "TT_FAILED=$failed" >> "$GITHUB_ENV"

      # The mutation tests put each 2026-11-11 defect back and require the gate to fail it. They rebuild the
      # engine in a scratch worktree, so they run in the nightly (or when asked), not on every push.
      - name: Mutation tests
        if: env.TT_MUTATIONS == '1'
        run: |
          set +e
          make terminal-truth-mutations ARGS="--engine $TT_ENGINE --longhouse-cli $TT_CLI" 2>&1 | tee "$TT_OUT/mutations.log"
          rc="${PIPESTATUS[0]}"
          echo "TT_MUTATIONS_RC=$rc" >> "$GITHUB_ENV"
          if [[ "$rc" != 0 ]]; then echo "::error::mutation tests exited $rc (the gate no longer fails a defect it must fail)"; fi

      # Fail closed: the exit status alone is not trusted. Every pass must have a result file, every row a
      # verdict that is a pass or a declared known-bad, and every measured cell's scripted model must have
      # served a request. The previous nightly's verdict, when there is one, marks which failures are new.
      - name: Verdict
        id: verdict
        run: |
          set +e
          previous=()
          if [[ "$TT_EVENT" == schedule ]]; then
            mkdir -p "$RUNNER_TEMP/previous-nightly"
            if python3 scripts/ops/ci_receipts.py get terminal-truth-nightly nightly --file gate.json > "$RUNNER_TEMP/previous-nightly/gate.json" 2>/dev/null; then
              previous=(--previous "$RUNNER_TEMP/previous-nightly")
            fi
          fi
          reruns=()
          [[ "$TT_RERUN" == 1 ]] && reruns=(--allow-reruns)
          python3 scripts/ci/terminal_truth_summary.py "$TT_OUT" --repeats "$TT_REPEATS" --scenarios "$TT_SCENARIOS" "${previous[@]}" "${reruns[@]}"
          rc=$?
          cat "$TT_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$rc" != 0 || "${TT_FAILED:-0}" != 0 || "${TT_MUTATIONS_RC:-0}" != 0 ]]; then
            echo "TT_STATE=failure" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "TT_STATE=success" >> "$GITHUB_ENV"

      - name: Collect recordings and keep the results
        if: always()
        run: |
          set -uo pipefail
          scratch="${TT_SCRATCH_ROOT:-/tmp/agents/tt}"
          if [[ -s "$TT_OUT/scratch-kept.txt" ]]; then
            # PTY recordings and host/model/engine logs; never the provider home (h/) or the SQLite database.
            awk '{print $2}' "$TT_OUT/scratch-kept.txt" | sort -u > "$TT_OUT/scratch-new.txt"
            (cd "$scratch" && xargs -a "$TT_OUT/scratch-new.txt" tar --exclude='*/h' --exclude='*.db' --exclude='*.db-*' -czf "$TT_OUT/scratch-recordings.tgz")
            # The Machine Agent's own logs from the provider home (Codex bridge and Console worker stderr, launcher
            # logs): the only record of why a provider launch or a live-event POST stalled. Log files only.
            (cd "$scratch" && while read -r d; do find "$d/h/.longhouse" -name '*.log' -type f 2>/dev/null; done < "$TT_OUT/scratch-new.txt" > "$TT_OUT/scratch-machine-logs.lst"
              if [[ -s "$TT_OUT/scratch-machine-logs.lst" ]]; then tar -czf "$TT_OUT/scratch-machine-logs.tgz" -T "$TT_OUT/scratch-machine-logs.lst"; fi)
          fi
          ls -la "$TT_OUT"
          files=()
          for f in "$TT_OUT"/*; do [[ -f "$f" && "$f" != *.scratch ]] && files+=("$f"); done
          python3 scripts/ops/ci_receipts.py put terminal-truth "$GITHUB_SHA" "${files[@]}" || echo "::warning::receipt not stored"
          if [[ "$TT_EVENT" == schedule ]]; then
            python3 scripts/ops/ci_receipts.py put terminal-truth-nightly nightly "$TT_OUT/gate.json" "$TT_OUT/summary.md" || echo "::warning::nightly receipt not stored"
          fi

      - name: Status result
        if: always() && env.TT_PUBLISH == '1'
        run: |
          set -uo pipefail
          state="${TT_STATE:-error}"
          [[ "$state" == success || "$state" == failure ]] || state=error
          description="terminal truth: $state"
          if [[ -f "$TT_OUT/gate.json" ]]; then
            description="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["description"][:140])' "$TT_OUT/gate.json")"
          fi
          python3 scripts/ci/terminal_truth_status.py "$state" "$description"

      - name: Remove owned state
        if: always()
        run: |
          set -uo pipefail
          scratch="${TT_SCRATCH_ROOT:-/tmp/agents/tt}"
          if [[ -s "${TT_OUT:-/nonexistent}/scratch-before.txt" || -d "$scratch" ]]; then
            for dir in "$scratch"/*; do
              name="$(basename "$dir")"
              [[ "$name" =~ ^[0-9a-f]{4}$ ]] || continue
              grep -qxF "$name" "$TT_OUT/scratch-before.txt" 2>/dev/null || rm -rf -- "$dir"
            done
          fi
          # The step shell runs with errexit (bash -e), so a pkill that matches nothing must not end it.
          if [[ -n "${TT_ENGINE:-}" ]]; then pkill -f "$TT_ENGINE (codex-bridge|claude-channel|omp-helm|pi-helm)" 2>/dev/null || true; fi
          if [[ -n "${TT_FIXTURE_ROOT:-}" && "$TT_FIXTURE_ROOT" == "$RUNNER_TEMP"/* ]]; then
            pkill -f "$TT_FIXTURE_ROOT/" 2>/dev/null || true
            chmod -R u+w "$TT_FIXTURE_ROOT" 2>/dev/null || true
            rm -rf -- "$TT_FIXTURE_ROOT" || echo "::warning::could not remove $TT_FIXTURE_ROOT"
          fi
          exit 0
