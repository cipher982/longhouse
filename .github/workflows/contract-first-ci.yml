name: CI

on:
  push:
    paths-ignore:
      - "blog/**"
      - "tools/check-static-blog.py"
      - ".github/workflows/blog-publish.yml"
  pull_request:
    paths-ignore:
      - "blog/**"
      - "tools/check-static-blog.py"
      - ".github/workflows/blog-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  # A new commit has a different identity and must not cancel the gates for an
  # older release candidate. Reruns of the same commit may still coalesce.
  group: ci-${{ github.repository }}-${{ github.event.pull_request.head.sha || github.sha }}
  # A main run is a deploy candidate: the gate that produces its deployment
  # receipt must not disappear because a branch push of the same commit, or a
  # rerun, arrived afterwards. Main runs therefore queue; branch and PR runs
  # stay cancellable, where losing a superseded run costs nothing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

env:
  # Self-hosted runners can have global pip config pointing at private indexes.
  # Force public PyPI for CI so setup-python's pip step doesn't fail.
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: ""

jobs:
  # -----------------------------------------------------------------------
  # Path detection — skip jobs whose code hasn't changed
  # Skipped jobs don't block workflow success.
  # -----------------------------------------------------------------------
  changes:
    timeout-minutes: 10
    runs-on: cube
    name: "Changed paths"
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      engine: ${{ steps.filter.outputs.engine }}
      schemas: ${{ steps.filter.outputs.schemas }}
      ci_plumbing: ${{ steps.filter.outputs.ci_plumbing }}
      packaging: ${{ steps.filter.outputs.packaging }}
      runner: ${{ steps.filter.outputs.runner }}
      ios: ${{ steps.filter.outputs.ios }}
      e2e: ${{ steps.filter.outputs.e2e }}
      models: ${{ steps.filter.outputs.models }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  fork-qualification:
    name: "Fork PR requires trusted replay"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: cube-fast
    steps:
      - run: |
          echo "::error::Portable CI has a writable self-hosted runner cache. Fork code cannot execute there; replay the patch on a trusted branch before merge."
          exit 1

  prepare-test-image:
    name: "Prepare immutable fixture image"
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-maint
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      cache_hit: ${{ steps.resolve.outputs.cache_hit }}
      preparation_seconds: ${{ steps.resolve.outputs.preparation_seconds }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Identify dependency manifests and existing image
        id: key
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/longhouse-test
        run: |
          set -euo pipefail
          key="$(python3 scripts/qa/test-isolation.py --print-image-key)"
          tag="$(jq -r '.tag' <<< "$key")"
          manifest_sha="$(jq -r '.manifest_sha256' <<< "$key")"
          context="$RUNNER_TEMP/longhouse-test-image-context"
          while IFS= read -r path; do
            mkdir -p "$context/$(dirname "$path")"
            cp -- "$path" "$context/$path"
          done < <(jq -r '.manifests[]' <<< "$key")
          image="${IMAGE_NAME}:${tag}"
          {
            echo "context=$context"
            echo "image=$image"
            echo "manifest_sha=$manifest_sha"
            echo "started_at=$(date +%s)"
          } >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Fixture dependency image already published: $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Fixture dependency image absent; building once for this manifest hash"
          fi
      - name: Build and publish fixture dependency image
        if: ${{ steps.key.outputs.exists != 'true' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.key.outputs.context }}
          file: ${{ steps.key.outputs.context }}/docker/test.dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.key.outputs.image }}
          build-args: TEST_MANIFEST_SHA=${{ steps.key.outputs.manifest_sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=longhouse-test-deps
          cache-to: type=gha,mode=max,scope=longhouse-test-deps
      - name: Resolve exact image digest and preparation timing
        id: resolve
        env:
          IMAGE: ${{ steps.key.outputs.image }}
          EXISTED: ${{ steps.key.outputs.exists }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          STARTED_AT: ${{ steps.key.outputs.started_at }}
        run: |
          set -euo pipefail
          if [[ "$EXISTED" == "true" ]]; then
            digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          else
            # A concurrent run may move the tag; this run consumes its own
            # published digest, never a mutable tag read after publication.
            digest="$BUILD_DIGEST"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Build returned no immutable fixture image digest" >&2
              exit 1
            }
          fi
          {
            echo "image_ref=${IMAGE%:*}@${digest}"
            echo "cache_hit=$EXISTED"
            echo "preparation_seconds=$(($(date +%s) - STARTED_AT))"
          } >> "$GITHUB_OUTPUT"
          echo "Fixture image ${IMAGE%:*}@${digest}, existing=$EXISTED"

  validate:
    # No path gate for `make validate` itself: it is cross-cutting by
    # construction -- it checks the engine's generated provider contract, the web
    # capability bundle, the iOS DTOs, the public surface, the runner, and E2E
    # test patterns -- so any subset of paths is another list to drift out of
    # date, which is exactly how twelve of its members went dark. The live proof
    # below is the one member with a real dependency boundary, and it is gated.
    needs: [changes, prepare-test-image]
    # !cancelled() and not the default `success()`: `Changed paths` runs a git
    # fetch against GitHub, and a network timeout there used to fail it -- which
    # would now skip this whole job, because it needs that job's outputs. When the
    # filter cannot tell, the gated live proof below is skipped and everything
    # else still runs.
    if: ${{ !cancelled() && needs.prepare-test-image.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-fast
    name: "Validation"
    # Must exceed the sum of the step budgets below, or the job kills a healthy
    # run before any step reaches its own limit.
    timeout-minutes: 50

    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Restore Bun download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: longhouse-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            longhouse-bun-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Validate contracts
        # make validate builds its isolated image and then runs every contract
        # check; on 2026-09-17 it reached its last check at 9m45s under normal
        # runner load, so 10 minutes failed healthy runs.
        #
        # Runner pods are ephemeral, so the image build starts from a cold
        # layer cache every time: bun install plus the cargo fetch took 16m
        # alone in run 35289932123 (00:12:58 -> 00:29:00), leaving the checks
        # no room inside 20. The step was building the whole time -- nothing
        # hung -- so the budget has to cover a cold build plus the checks.
        timeout-minutes: 30
        # One step, because two lists drift. This job used to enumerate a subset
        # of `make validate` by hand, and twelve of its members -- including
        # validate-session-state-contract, the drift check for the very
        # vocabulary a Console phase mismatch went dark on -- ran in no workflow
        # at all, reachable only by manual dispatch. Add a target to `validate`
        # and CI runs it; there is no second list to remember.
        #
        # Members worth knowing about when this fails: the engine include_str!s
        # the generated provider contract JSON, so the Rust-side provider
        # authority rests on validate-managed-provider-contracts matching
        # schemas/managed_providers.yml; and validate-provider-census keeps the
        # census artifact from silently going stale.
        run: make validate

      - name: Managed launch lifecycle against a real Runtime Host
        # Gated on the surfaces that can invalidate it. This proof starts a real
        # Runtime Host, real SQLite, real device-token auth and scripted provider
        # binaries, so only a change to those surfaces can fail it; a docs,
        # iOS-only or web-only push cannot, and paid ~6 minutes for the privilege
        # until 2026-09-24. `make validate` above stays ungated on purpose.
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.schemas == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci_plumbing == 'true' }}
        timeout-minutes: 15
        # Real FastAPI server, real SQLite, real device-token auth, real request
        # validation, scripted provider binaries. The installer smoke's fake
        # Runtime Host answers every request identically and therefore cannot
        # catch a provider gate -- the exact hole the cursor outage fell through.
        run: make test-managed-launch-lifecycle

      - name: Produce executable provider capability proof bundle
        timeout-minutes: 3
        run: |
          make provider-capability-coordination-proof \
            STORE_ROOT="/work/artifacts/provider-capability-proof/store" \
            BUNDLE_OUTPUT="/work/artifacts/provider-capability-proof/bundle.json" \
            PRODUCER_CLASS=release_ci \
            INVOCATION_ID="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            RUN_REFERENCE="github-actions://${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            LONGHOUSE_GIT_SHA="$GITHUB_SHA" \
            PROVIDER_VERSION=hermetic-fixture \
            PROVIDER_EXECUTABLE_IDENTITY=sha256:hermetic-fixture

      - name: Upload provider capability proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-capability-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-isolation/**/files/1/provider-capability-proof/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload provider release proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-release-proof-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-isolation/**/files/1/provider-release-proof-universal-smoke/**
            artifacts/test-isolation/**/files/1/reliability-kernel/managed-launch-lifecycle-failure.*/**
          if-no-files-found: ignore
          retention-days: 7

  backend-tests:
    timeout-minutes: 30
    needs: [changes, prepare-test-image]
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-fast
    name: "Backend tests"
    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Run Python Backend Tests
        run: make test

      - name: Run Hosted-Instance Helper Tests
        run: make test-hosted-instance

      - name: Run iOS simulator helper tests
        run: make test-ios-helper

  provider-contract-tests:
    # Always run: Loop 2 accepts an exact Longhouse SHA only after this job
    # proves the source-only provider assertions that do not belong in the
    # provider-launch factory matrix.
    timeout-minutes: 15
    needs: prepare-test-image
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: cube-fast
    name: "Provider contract tests"
    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Run exact-SHA provider contract assertions
        run: make test-provider-contract

  engine-tests:
    timeout-minutes: 45
    needs: [changes, prepare-test-image]
    if: ${{ (needs.changes.outputs.engine == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-fast
    name: "Engine tests"
    env:
      CARGO_PROFILE: ci
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"


      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Run engine and shipper suite in one isolated container
        if: ${{ needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' }}
        run: make test-shipper-premerge

      - name: Run Shipper Pipeline E2E (fixture → engine ship → API → DB)
        if: ${{ needs.changes.outputs.engine != 'true' && github.event_name != 'workflow_dispatch' }}
        run: make test-shipper-e2e


  frontend-tests:
    timeout-minutes: 20
    needs: [changes, prepare-test-image]
    if: ${{ (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-fast
    name: "Frontend + runner tests"
    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Restore Bun download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: longhouse-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            longhouse-bun-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Run Frontend Tests
        run: make test-frontend

      - name: Run Runner Unit Tests
        run: make test-runner

  ios-tests:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 25
    name: "iOS tests"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run iOS fixture in the isolated GitHub-hosted macOS VM
        env:
          NATIVE_OPTIONS_JSON: "{}"
        run: python3 scripts/qa/native-test-bootstrap.py --target test-ios

      - name: Upload native iOS evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcresult
          if-no-files-found: ignore
          path: ${{ runner.temp }}/native-isolation-evidence
          retention-days: 1

  wheel-package:
    timeout-minutes: 20
    needs: [changes, prepare-test-image]
    if: ${{ (needs.changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-fast
    name: "CLI wheel packaging"
    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Verify CLI wheel packaging
        run: make test-wheel-package

  e2e-core:
    timeout-minutes: 30
    needs: [changes, prepare-test-image]
    if: ${{ (needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-browser
    name: "Core E2E tests"
    env:
      CI: "1"
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Run Core E2E Tests in the portable isolation boundary
        run: make test-e2e-core

      - name: Upload isolated E2E artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-e2e-artifacts
          path: artifacts/test-isolation
          retention-days: 1

  e2e-a11y:
    timeout-minutes: 30
    needs: [changes, prepare-test-image]
    if: ${{ (needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-browser
    name: "Accessibility E2E tests"
    env:
      CI: "1"
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Run Accessibility E2E Tests in the portable isolation boundary
        run: make test-e2e-a11y

      - name: Upload isolated E2E artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-e2e-artifacts
          path: artifacts/test-isolation
          retention-days: 1

  model-smoke:
    timeout-minutes: 20
    needs: changes
    if: ${{ (needs.changes.outputs.models == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-maint
    name: "Model smoke tests"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Smoke test all models
        run: uv run --with openai --with anthropic python scripts/qa/smoke_models.py --ci

  oss-qa:
    timeout-minutes: 30
    needs: [changes, prepare-test-image]
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: cube-browser
    name: "OSS onboarding smoke"
    env:
      CI: "1"
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run OSS onboarding fixture in the portable isolation boundary
        run: |
          python3 scripts/qa/test-isolation.py \
            --target qa-oss \
            --command env ONBOARDING_PLAYWRIGHT_PROJECT=onboarding-chromium \
              ./scripts/qa/qa-oss.sh --workdir /work --no-unit --no-e2e

      - name: Upload OSS isolation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-isolation-evidence
          path: artifacts/test-isolation
          if-no-files-found: ignore
          retention-days: 1
