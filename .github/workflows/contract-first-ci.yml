name: CI

on:
  push:
    paths-ignore:
      - "blog/**"
      - "scripts/ci/check-static-blog.py"
      - ".github/workflows/blog-publish.yml"
  pull_request:
    paths-ignore:
      - "blog/**"
      - "scripts/ci/check-static-blog.py"
      - ".github/workflows/blog-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  # Pushes to main share one group. A running main CI always finishes, but a
  # queued one is dropped when a newer main push arrives: only the newest
  # verified main commit deploys, and it contains the older ones. (Per-SHA
  # groups queued every commit; on 2026-09-24 that was 15 runs for commits
  # already behind main head on a saturated cube pool.) A dropped run is
  # "superseded", not failed: Deploy and Verify stands down green for it
  # (wait-for-ci superseded_branch), and make ship follows the covering
  # commit. Branch and PR runs keep a per-SHA group and stay cancellable.
  group: ci-${{ github.repository }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || (github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

env:
  # A runner's global pip config can point at a private index. Pin public PyPI
  # so setup-python's pip step doesn't fail.
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: ""
  # Test jobs run on the crunch VM (runs-on: crunch: 14 vCPU, 3 runner slots for this
  # repo; control-plane docs/specs/build-compute-pipeline.md 6.2). The
  # repository is private, where GitHub-hosted runners are 2-CPU and metered, and no
  # job here uploads an Actions artifact: receipts go to the object store
  # (scripts/ops/ci_receipts.py) and evidence stays on the runner. Each isolated
  # guest gets 4 CPUs / 8 GiB; three at once fit crunch-docker.slice (30 GiB).
  LONGHOUSE_TEST_CPUS: "4"
  LONGHOUSE_TEST_MEMORY: "8g"
  # CI receipts live in the artifact object store (scripts/ops/ci_receipts.py).
  CI_RECEIPTS_S3_ENDPOINT: ${{ secrets.CI_RECEIPTS_S3_ENDPOINT }}
  CI_RECEIPTS_S3_BUCKET: ${{ secrets.CI_RECEIPTS_S3_BUCKET }}
  CI_RECEIPTS_S3_PREFIX: ${{ secrets.CI_RECEIPTS_S3_PREFIX }}
  CI_RECEIPTS_S3_ACCESS_KEY_ID: ${{ secrets.CI_RECEIPTS_S3_ACCESS_KEY_ID }}
  CI_RECEIPTS_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_RECEIPTS_S3_SECRET_ACCESS_KEY }}
  # One Cargo profile for every engine build in this workflow (Engine tests and
  # the Validation job's managed-launch lifecycle proof): an unoptimized engine
  # crate over opt-3 dependencies (engine/Cargo.toml). The fixture image ships
  # exactly those dependencies precompiled, so each job compiles one crate.
  CARGO_PROFILE: ci-test

jobs:
  # -----------------------------------------------------------------------
  # Path detection — skip jobs whose code hasn't changed
  # Skipped jobs don't block workflow success.
  # -----------------------------------------------------------------------
  changes:
    timeout-minutes: 10
    runs-on: crunch
    name: "Changed paths"
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      engine: ${{ steps.filter.outputs.engine }}
      schemas: ${{ steps.filter.outputs.schemas }}
      ci_plumbing: ${{ steps.filter.outputs.ci_plumbing }}
      packaging: ${{ steps.filter.outputs.packaging }}
      runner: ${{ steps.filter.outputs.runner }}
      ios: ${{ steps.filter.outputs.ios }}
      e2e: ${{ steps.filter.outputs.e2e }}
      models: ${{ steps.filter.outputs.models }}
      scripts: ${{ steps.filter.outputs.scripts }}
      ui_sweep: ${{ steps.filter.outputs.ui_sweep }}
      image_tag: ${{ steps.image.outputs.tag }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml
          # `!` patterns in the filters exclude (ios: a release's version bump).
          predicate-quantifier: some-with-excludes
          # A branch push qualifies that push, not every commit since main.
          # PRs still use GitHub's changed-file API against their base branch.
          base: ${{ github.ref_name }}
      - name: Fixture image key
        id: image
        run: echo "tag=$(python3 scripts/qa/test-isolation.py --print-image-key | jq -r '.tag')" >> "$GITHUB_OUTPUT"

  # The fixture image (docker/test.dockerfile) is built once on this runner by
  # test-isolation's own local-build path and kept in the runner's Docker image
  # cache, so every test job on the machine starts from it without a pull. Cube's
  # amd64 lanes (Hosted Live QA) pull the same image by tag from GHCR, so it is
  # also published there when the tag is absent (only after a dependency change).
  test-image:
    name: "Fixture image"
    needs: changes
    runs-on: crunch
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - name: Build or reuse the fixture image on this runner
        id: prepare
        run: echo "ref=$(python3 scripts/qa/test-isolation.py --prepare)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the image for cube's lanes when its tag is absent
        env:
          LOCAL_REF: ${{ steps.prepare.outputs.ref }}
          PUBLISHED: ghcr.io/${{ github.repository_owner }}/longhouse-test:${{ needs.changes.outputs.image_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$PUBLISHED" >/dev/null 2>&1; then
            echo "$PUBLISHED is already published."
          else
            docker tag "$LOCAL_REF" "$PUBLISHED"
            docker push "$PUBLISHED"
          fi

  validate:
    # No path gate for `make validate` itself: it is cross-cutting by
    # construction -- it checks the engine's generated provider contract, the web
    # capability bundle, the iOS DTOs, the public surface, the runner, and E2E
    # test patterns -- so any subset of paths is another list to drift out of
    # date, which is exactly how twelve of its members went dark. The live
    # lifecycle proof has a real dependency boundary, so it is gated and runs as
    # its own job ("Managed launch lifecycle") in parallel with this one.
    needs: [changes, test-image]
    # !cancelled() and not the default `success()`: `Changed paths` runs a git
    # fetch against GitHub, and a network timeout there used to fail it -- which
    # would now skip this whole job, because it needs that job's outputs.
    if: ${{ !cancelled() && needs.test-image.result == 'success' }}
    runs-on: crunch
    name: "Validation"
    # Must exceed the sum of the step budgets below, or the job kills a healthy
    # run before any step reaches its own limit.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Validate contracts
        # The producer above passes an exact digest; this runs from the offline
        # fixture image instead of rebuilding apt/Bun/uv/Cargo in each pod.
        timeout-minutes: 30
        # One step, because two lists drift. This job used to enumerate a subset
        # of `make validate` by hand, and twelve of its members -- including
        # validate-session-state-contract, the drift check for the very
        # vocabulary a Console phase mismatch went dark on -- ran in no workflow
        # at all, reachable only by manual dispatch. Add a target to `validate`
        # and CI runs it; there is no second list to remember.
        #
        # Members worth knowing about when this fails: the engine include_str!s
        # the generated provider contract JSON, so the Rust-side provider
        # authority rests on validate-managed-provider-contracts matching
        # schemas/managed_providers.yml; and validate-provider-census keeps the
        # census artifact from silently going stale.
        run: make validate

      - name: Verifier boundary allowlist only shrinks
        # `make validate` proves the allowlist matches the tree, in a guest with no git history.
        # This proves it did not grow: every entry must already be in the allowlist of the commit
        # this push or PR is based on (scripts/ci/verifier_boundary.py; control-plane spec
        # provider-factory-findings-loop.md, 3.3a). A new branch or a manual run has no base, and
        # there is nothing to compare. A base that exists but cannot be fetched fails the step:
        # skipping would let an entry and its import land together.
        timeout-minutes: 3
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "::notice::no base commit; the only-shrinks comparison was skipped"
            exit 0
          fi
          for attempt in 1 2 3; do
            if git fetch --quiet --no-tags --depth=1 origin "$base"; then
              python3 scripts/ci/verifier_boundary.py check --base FETCH_HEAD
              exit $?
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not fetch base commit $base; the only-shrinks comparison cannot run"
          exit 1

      - name: Isolation wrapper fails when the guest fails
        # Every CI test lane trusts scripts/qa/test-isolation.py to return the
        # guest's exit status. When it returned None instead, failing backend
        # tests reported green (2026-09-24). The image is already local here.
        timeout-minutes: 3
        run: |
          set +e
          python3 scripts/qa/test-isolation.py --target isolation-exit-probe --command sh -c 'exit 3'
          status=$?
          set -e
          if [[ "$status" -ne 3 ]]; then
            echo "::error::test-isolation.py returned $status for a guest that exited 3"
            exit 1
          fi

      - name: Produce executable provider capability proof bundle
        timeout-minutes: 3
        run: |
          make provider-capability-coordination-proof \
            STORE_ROOT="/work/artifacts/provider-capability-proof/store" \
            BUNDLE_OUTPUT="/work/artifacts/provider-capability-proof/bundle.json" \
            PRODUCER_CLASS=release_ci \
            INVOCATION_ID="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            RUN_REFERENCE="github-actions://${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            LONGHOUSE_GIT_SHA="$GITHUB_SHA" \
            PROVIDER_VERSION=hermetic-fixture \
            PROVIDER_EXECUTABLE_IDENTITY=sha256:hermetic-fixture

  lifecycle:
    # Split out of Validation, where it ran serially after `make validate` and
    # was the longest single stretch of the CI critical path (~73 s of a 161 s
    # job). As its own job it runs alongside Validation for one extra image pull.
    needs: [changes, test-image]
    # Gated on the surfaces that can invalidate it. This proof starts a real
    # Runtime Host, real SQLite, real device-token auth and scripted provider
    # binaries, so only a change to those surfaces can fail it; a docs,
    # iOS-only or web-only push cannot, and paid ~6 minutes for the privilege
    # until 2026-09-24.
    if: ${{ !cancelled() && needs.test-image.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.schemas == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci_plumbing == 'true') }}
    runs-on: crunch
    name: "Managed launch lifecycle"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Managed launch lifecycle against a real Runtime Host
        timeout-minutes: 15
        # Real FastAPI server, real SQLite, real device-token auth, real request
        # validation, scripted provider binaries. The installer smoke's fake
        # Runtime Host answers every request identically and therefore cannot
        # catch a provider gate -- the exact hole the cursor outage fell through.
        run: make test-managed-launch-lifecycle

  backend-shards:
    timeout-minutes: 30
    needs: [changes, test-image]
    # !cancelled(): an image build skipped upstream (tag already published)
    # must not skip this job; the prepare result is the real gate.
    if: ${{ !cancelled() && needs.test-image.result == 'success' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: crunch
    name: "Backend tests shard ${{ matrix.shard }}/3"
    # A hosted runner's four vCPUs take ~5 min for the whole suite even under
    # xdist; three runners take ~2. "Backend tests" below is the one name that
    # Deploy and Verify and ship tooling wait on.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      LONGHOUSE_TEST_SHARD: ${{ matrix.shard }}/3
      PYTEST_ADDOPTS: "--durations=25 --durations-min=2.0"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run Python Backend Tests
        run: make test

      - name: Run Hosted-Instance Helper Tests
        if: ${{ matrix.shard == 0 }}
        run: make test-hosted-instance

      - name: Run iOS simulator helper tests
        if: ${{ matrix.shard == 0 }}
        run: make test-ios-helper

  backend-tests:
    name: "Backend tests"
    needs: backend-shards
    # Skipped shards (backend unchanged) leave this skipped too, as before.
    if: ${{ !cancelled() && needs.backend-shards.result != 'skipped' }}
    runs-on: grind-gate
    timeout-minutes: 5
    steps:
      - name: Every backend shard passed
        env:
          SHARDS: ${{ needs.backend-shards.result }}
        run: |
          echo "backend shards: $SHARDS"
          [[ "$SHARDS" == "success" ]]

  provider-contract-tests:
    # Always run: Loop 2 accepts an exact Longhouse SHA only after this job
    # proves the source-only provider assertions that do not belong in the
    # provider-launch factory matrix.
    timeout-minutes: 15
    needs: [changes, test-image]
    if: ${{ !cancelled() && needs.test-image.result == 'success' }}
    runs-on: crunch
    name: "Provider contract tests"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run exact-SHA provider contract assertions
        env:
          PYTEST_ADDOPTS: "--durations=40"
        run: make test-provider-contract

  engine-tests:
    timeout-minutes: 45
    needs: [changes, test-image]
    if: ${{ !cancelled() && needs.test-image.result == 'success' && (needs.changes.outputs.engine == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: crunch
    name: "Engine tests"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Rust toolchain for the format gate
        if: ${{ needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05
        with:
          components: rustfmt

      - name: Engine rustfmt gate
        # The suite below runs in a container that never checked formatting, so
        # main drifted (15 files on 2026-10-10). Enforced here, not in
        # pre-commit: rustfmt walks mod children, which the self-staging
        # autofix wrapper cannot put back safely.
        if: ${{ needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Run engine and shipper suite in one isolated container
        if: ${{ needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' }}
        run: make test-shipper-premerge

      - name: Run Shipper Pipeline E2E (fixture → engine ship → API → DB)
        if: ${{ needs.changes.outputs.engine != 'true' && github.event_name != 'workflow_dispatch' }}
        run: make test-shipper-e2e

  frontend-tests:
    timeout-minutes: 20
    needs: [changes, test-image]
    if: ${{ !cancelled() && needs.test-image.result == 'success' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: crunch
    name: "Frontend + runner tests"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run Frontend and Runner Tests in one isolated container
        run: make test-frontend-runner

  ui-sweep:
    timeout-minutes: 15
    needs: [changes, test-image]
    if: ${{ !cancelled() && needs.test-image.result == 'success' && (needs.changes.outputs.ui_sweep == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: crunch
    # Opens every menu on every fixture scene at three sizes and fails when one
    # lands off-screen, covered or clipped (scripts/ui/popover-sweep.ts). A
    # browser check verifies after the fact: it is not in Deploy and Verify's
    # required_jobs, like Core E2E. One job per viewport: all three in one
    # guest took 19m24s with 3 Chromiums on 4 vCPUs and timed a screenshot out.
    # A shard (37 captures, 2 at a time) took 5m48s on crunch; this runner ran
    # the sweep 1.8x slower than crunch, so ~10.5 min, and 15 min is the cap.
    #
    # A push sweeps the desktop size only. All three sizes held three of this
    # repo's three crunch slots for about 4.7 minutes each on every frontend or
    # scripts push (155 slot-minutes a day on 2026-11-11/12) for a result
    # nothing reads, and its one red streak that week hit every size at once.
    # It runs for the web app and scripts/ui only (the ui_sweep path filter), not
    # for every scripts/ change. ui-sweep-nightly.yml runs all three once a day
    # whatever changed, where Sauron's
    # ci-scheduled-red watches it; a manual run here also does all three.
    strategy:
      fail-fast: false
      matrix:
        viewport: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["desktop","wide","mobile"]' || '["desktop"]') }}
    name: "UI popover sweep (${{ matrix.viewport }})"
    env:
      # The hosted arm64 runner has 4 vCPUs; the guest defaults to 2.
      LONGHOUSE_TEST_CPUS: "4"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Open every menu at this size
        run: make test-ui-sweep ARGS=--viewports=${{ matrix.viewport }}

  ios-tests:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch' }}
    # The wisp bench Mac: hosted macOS is metered 10x for a private repository. The runner takes
    # one job at a time, so the two lanes below run back to back. Measured on wisp, warm: compile
    # 31 s, unit 32 s, all 35 UI tests 398 s.
    runs-on: wisp
    # One hosted VM ran both merge schemes back to back: 10 to 25 minutes depending on
    # the hosted VM (measured 2026-09-20..29: 106 successes, median 17.7 min, max
    # 24.8). Two lanes: the unit scheme plus the small UI test classes, and
    # SessionChatUITests (26 of the 35 enabled UI tests, about 75% of their time) by itself.
    # `skip` and `only` name the same class, so a test added anywhere else runs in
    # the first lane. Any command-line filter replaces the test plan's own skippedTests
    # (run 36653276780 ran the four screenshot-capture tests the plan skips), so each
    # lane repeats them; the lanes test reads the plan and fails if one is missed. Splitting a scheme's tests one by one (an enumeration and a
    # stride) cost each lane 3.5 minutes to enumerate them; three lanes needed a
    # third macOS runner, and this account's 5 macOS jobs at once were often taken
    # by other CI runs and agents' dispatches: lanes waited 5 to 15 minutes to
    # start. A VM cannot overlap its own steps (booting the simulator during the
    # compile made both slower on a 3-core VM).
    # scripts/tests/ios-test-lanes.test.py fails if these lanes stop covering
    # IOS_MERGE_TEST_SCHEMES in the Makefile.
    # The timeout was 25 and cancelled healthy runs (the v0.1.56 and v0.1.58
    # release gates); 40 leaves headroom over the slowest success.
    timeout-minutes: 40
    name: "iOS tests (${{ matrix.lane }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit + ui
            schemes: "Longhouse LonghouseSmoke"
            filter: "LonghouseSmoke:skip:LonghouseIOSUITests/SessionChatUITests LonghouseSmoke:skip:LonghouseIOSUITests/InboxCaptureUITests/testCaptureInboxGalleryLight LonghouseSmoke:skip:LonghouseIOSUITests/InboxCaptureUITests/testCaptureInboxGalleryDark"
          - lane: ui chat
            schemes: LonghouseSmoke
            filter: "LonghouseSmoke:only:LonghouseIOSUITests/SessionChatUITests LonghouseSmoke:skip:LonghouseIOSUITests/SessionChatUITests/testCaptureToolsTranscriptLightScreenshot LonghouseSmoke:skip:LonghouseIOSUITests/SessionChatUITests/testCaptureToolsTranscriptDarkScreenshot"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

          persist-credentials: false

      - name: Install XcodeGen
        run: scripts/ci/install_xcodegen.sh

      # The other place this runs (test-ios-helper) is gated on backend paths, so
      # an edit to only this matrix or the Makefile would skip it.
      - name: Check these lanes cover the merge gate
        run: python3 scripts/tests/ios-test-lanes.test.py

      - name: Run iOS fixture on the wisp bench runner
        env:
          NATIVE_OPTIONS_JSON: >-
            {"IOS_TEST_SCHEMES": "${{ matrix.schemes }}", "IOS_TEST_FILTER": "${{ matrix.filter }}"}
        run: python3 scripts/qa/native-test-bootstrap.py --target test-ios

  e2e-core:
    timeout-minutes: 30
    needs: [changes, test-image]
    if: ${{ !cancelled() && needs.test-image.result == 'success' && (needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: crunch
    name: "Core E2E tests"
    env:
      CI: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run Core E2E Tests in the portable isolation boundary
        run: make test-e2e-core

  model-smoke:
    timeout-minutes: 20
    needs: changes
    if: ${{ (needs.changes.outputs.models == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: crunch
    name: "Model smoke tests"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1


      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Smoke test all models
        run: uv run --with openai python scripts/qa/smoke_models.py --ci

  small-checks:
    # Four checks that each take under a minute, in one job. As four jobs they
    # each waited for one of this repo's three crunch slots (median 2.6 to 4.0
    # minutes of waiting for 0.3 to 0.7 minutes of work, 2026-11-11/12) and
    # paid a checkout and a guest start apiece. None of them is in Deploy and
    # Verify's required_jobs, and none is now: a failure here does not hold a
    # deploy. Every step runs whatever the earlier ones did, so one failure
    # does not hide another; the job is red if any step is.
    needs: [changes, test-image]
    if: ${{ !cancelled() && needs.test-image.result == 'success' }}
    runs-on: crunch
    name: "Small checks"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # release-rings.md change 5 -- the server keeps accepting the engine that
      # is actually running on users' laptops right now. Runs on every push
      # (cheap: no cargo build, no fixture image) rather than gating on engine/
      # backend paths, because a server-only change can just as easily break
      # what an old engine expects from it.
      - name: Ship a transcript with the last released engine against the candidate server
        # `make engine-compat` downloads the newest published release that
        # isn't the candidate's own version (via `gh`, using this job's
        # token) and skips cleanly when none exists for this platform yet.
        id: engine_compat
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: make engine-compat

      # `make promote-production` reads this receipt per commit (kind engine-compat,
      # scripts/ops/promotion_gates.py). `passed` needs a test that ran; a skip is
      # recorded as skipped and no promotion accepts it (scripts/qa/engine_compat_receipt.py).
      - name: Record the engine-compat receipt
        if: ${{ !cancelled() && steps.engine_compat.outcome == 'success' && github.event_name != 'pull_request' }}
        run: python3 scripts/ops/ci_receipts.py put engine-compat "$GITHUB_SHA" .build/engine-compat/receipt.json

      - name: Verify CLI wheel packaging
        if: ${{ !cancelled() && (needs.changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 20
        run: make test-wheel-package

      - name: Run OSS onboarding fixture in the portable isolation boundary
        env:
          CI: "1"
        if: ${{ !cancelled() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 30
        run: |
          python3 scripts/qa/test-isolation.py \
            --target qa-oss \
            --command env ONBOARDING_PLAYWRIGHT_PROJECT=onboarding-chromium \
              ./scripts/qa/qa-oss.sh --workdir /work --no-unit --no-e2e

      # Replays content changes (history arriving, images, streaming, keyboard,
      # rotation) against the iOS transcript document in WebKit and fails when
      # the row being read moves (specs/ios-transcript-stability.md, L1).
      - name: Replay content changes against the iOS transcript document
        if: ${{ !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 15
        run: make test-ios-transcript-stability

      # Replays streaming, tool collapse, and prepend updates against the web
      # SessionDetailPage in headless Chromium and fails on layout/scroll drift.
      - name: Replay content changes against the web transcript timeline
        if: ${{ !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci_plumbing == 'true' || github.event_name == 'workflow_dispatch') }}
        timeout-minutes: 15
        run: make test-web-transcript-stability
