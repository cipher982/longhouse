name: CI

on:
  push:
    paths-ignore:
      - "blog/**"
      - "tools/check-static-blog.py"
      - ".github/workflows/blog-publish.yml"
  pull_request:
    paths-ignore:
      - "blog/**"
      - "tools/check-static-blog.py"
      - ".github/workflows/blog-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  # Pushes to main share one group. A running main CI always finishes, but a
  # queued one is dropped when a newer main push arrives: only the newest
  # verified main commit deploys, and it contains the older ones. (Per-SHA
  # groups queued every commit; on 2026-09-24 that was 15 runs for commits
  # already behind main head on a saturated cube pool.) A dropped run is
  # "superseded", not failed: Deploy and Verify stands down green for it
  # (wait-for-ci superseded_branch), and make ship follows the covering
  # commit. Branch and PR runs keep a per-SHA group and stay cancellable.
  group: ci-${{ github.repository }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || (github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

env:
  # Self-hosted runners can have global pip config pointing at private indexes.
  # Force public PyPI for CI so setup-python's pip step doesn't fail.
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: ""
  # Test jobs run on GitHub-hosted arm64 runners (ubuntu-24.04-arm): free for
  # this public repo, no queue, a whole 4-core VM per job, and measured ~2x
  # the per-core speed of ubuntu-latest's x64 vCPUs on this suite. The
  # isolated guest gets the whole VM (test-isolation.py defaults to 2 CPU /
  # 4 GiB for shared machines). Deploy, gate and image-publish work stays on
  # cube. Profile of 2026-09-25: Linux CI ~3 min from first job to last.
  LONGHOUSE_TEST_CPUS: "4"
  LONGHOUSE_TEST_MEMORY: "13g"
  # One Cargo profile for every engine build in this workflow (Engine tests and
  # the Validation job's managed-launch lifecycle proof): an unoptimized engine
  # crate over opt-3 dependencies (engine/Cargo.toml). The fixture image ships
  # exactly those dependencies precompiled, so each job compiles one crate.
  CARGO_PROFILE: ci-test

jobs:
  # -----------------------------------------------------------------------
  # Path detection — skip jobs whose code hasn't changed
  # Skipped jobs don't block workflow success.
  # -----------------------------------------------------------------------
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-24.04-arm
    name: "Changed paths"
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      engine: ${{ steps.filter.outputs.engine }}
      schemas: ${{ steps.filter.outputs.schemas }}
      ci_plumbing: ${{ steps.filter.outputs.ci_plumbing }}
      packaging: ${{ steps.filter.outputs.packaging }}
      runner: ${{ steps.filter.outputs.runner }}
      ios: ${{ steps.filter.outputs.ios }}
      e2e: ${{ steps.filter.outputs.e2e }}
      models: ${{ steps.filter.outputs.models }}
      scripts: ${{ steps.filter.outputs.scripts }}
      image_tag: ${{ steps.image.outputs.tag }}
      image_manifest: ${{ steps.image.outputs.manifest_sha }}
      image_arm64_exists: ${{ steps.image.outputs.arm64_exists }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_ref_lean: ${{ steps.image.outputs.image_ref_lean }}
      image_index_complete: ${{ steps.image.outputs.index_complete }}
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml
          # A branch push qualifies that push, not every commit since main.
          # PRs still use GitHub's changed-file API against their base branch.
          base: ${{ github.ref_name }}
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Which fixture image variants are already published?
        # Here rather than in its own job: these answers gate the native image
        # builds, and every extra job in the chain costs a runner start.
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/longhouse-test
        run: |
          set -euo pipefail
          key="$(python3 scripts/qa/test-isolation.py --print-image-key)"
          tag="$(jq -r '.tag' <<< "$key")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(jq -r '.manifest_sha256' <<< "$key")" >> "$GITHUB_OUTPUT"
          # CI tests run on arm64 and wait only for that arch: the full image
          # and the lean one (docker/test.dockerfile), which are built together.
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null \
              | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))'
          }
          if digest="$(digest_of "$IMAGE_NAME:$tag-arm64")" && lean="$(digest_of "$IMAGE_NAME:$tag-lean-arm64")"; then
            echo "arm64_exists=true" >> "$GITHUB_OUTPUT"
            # The common case resolves the pinned digests right here, so tests
            # start without waiting on a separate prepare job.
            echo "image_ref=$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
            echo "image_ref_lean=$IMAGE_NAME@$lean" >> "$GITHUB_OUTPUT"
            echo "fixture images $IMAGE_NAME@$digest, lean $IMAGE_NAME@$lean (arm64, already published)"
          else
            echo "arm64_exists=false" >> "$GITHUB_OUTPUT"
          fi
          # The plain tag is the multi-arch index cube's amd64 lanes pull.
          platforms="$(docker buildx imagetools inspect --raw "$IMAGE_NAME:$tag" 2>/dev/null \
            | jq -r '[.manifests[]?.platform | select(.os == "linux") | .architecture] | sort | join(",")' || true)"
          if [[ "$platforms" == "amd64,arm64" ]]; then
            echo "index_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "index_complete=false" >> "$GITHUB_OUTPUT"
          fi
          echo "fixture image $IMAGE_NAME:$tag index platforms: ${platforms:-none}"

  fork-qualification:
    name: "Fork PR requires trusted replay"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          echo "::error::Portable CI has a writable self-hosted runner cache. Fork code cannot execute there; replay the patch on a trusted branch before merge."
          exit 1

  # Only when the dependency manifests changed. CI tests wait only for arm64;
  # amd64 and the joined multi-arch tag (pulled by cube's amd64 lanes, e.g.
  # hosted-live-qa) finish off the critical path in test-image-index.
  test-image-arm64:
    name: "Build fixture image (arm64)"
    needs: changes
    if: ${{ needs.changes.outputs.image_arm64_exists != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/build-test-image
        with:
          arch: arm64
          lean: "true"
          tag: ${{ needs.changes.outputs.image_tag }}
          manifest_sha: ${{ needs.changes.outputs.image_manifest }}

  test-image-amd64:
    name: "Build fixture image (amd64)"
    needs: changes
    if: ${{ needs.changes.outputs.image_index_complete != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/build-test-image
        with:
          arch: amd64
          tag: ${{ needs.changes.outputs.image_tag }}
          manifest_sha: ${{ needs.changes.outputs.image_manifest }}

  test-image-index:
    name: "Publish multi-arch fixture tag"
    needs: [changes, test-image-arm64, test-image-amd64]
    # The arm64 tag may predate this run (skipped build); amd64 must be fresh.
    if: ${{ !cancelled() && needs.test-image-amd64.result == 'success' && needs.test-image-arm64.result != 'failure' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Join the per-arch tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/longhouse-test:${{ needs.changes.outputs.image_tag }}
        run: docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"

  prepare-test-image:
    name: "Prepare immutable fixture image"
    # Waits for the arm64 build only; the amd64 build never delays tests.
    needs: [changes, test-image-arm64]
    # Only after a fresh arm64 build; otherwise Changed paths already
    # resolved the digest and this job is skipped (Deploy and Verify treats a
    # skipped required job as passed).
    if: ${{ !cancelled() && needs.test-image-arm64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      image_ref_lean: ${{ steps.resolve.outputs.image_ref_lean }}
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the arm64 fixture image digest
        id: resolve
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/longhouse-test:${{ needs.changes.outputs.image_tag }}-arm64
          LEAN: ghcr.io/${{ github.repository_owner }}/longhouse-test:${{ needs.changes.outputs.image_tag }}-lean-arm64
        run: |
          set -euo pipefail
          # Pin the digest: a concurrent tag update cannot change this run's input.
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          lean="$(docker buildx imagetools inspect "$LEAN" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          echo "image_ref=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref_lean=${LEAN%:*}@$lean" >> "$GITHUB_OUTPUT"
          echo "Lean fixture image ${LEAN%:*}@$lean"
          echo "Fixture image ${IMAGE%:*}@$digest"

  validate:
    # No path gate for `make validate` itself: it is cross-cutting by
    # construction -- it checks the engine's generated provider contract, the web
    # capability bundle, the iOS DTOs, the public surface, the runner, and E2E
    # test patterns -- so any subset of paths is another list to drift out of
    # date, which is exactly how twelve of its members went dark. The live
    # lifecycle proof has a real dependency boundary, so it is gated and runs as
    # its own job ("Managed launch lifecycle") in parallel with this one.
    needs: [changes, prepare-test-image]
    # !cancelled() and not the default `success()`: `Changed paths` runs a git
    # fetch against GitHub, and a network timeout there used to fail it -- which
    # would now skip this whole job, because it needs that job's outputs.
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "Validation"
    # Must exceed the sum of the step budgets below, or the job kills a healthy
    # run before any step reaches its own limit.
    timeout-minutes: 50

    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref || needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Validate contracts
        # The producer above passes an exact digest; this runs from the offline
        # fixture image instead of rebuilding apt/Bun/uv/Cargo in each pod.
        timeout-minutes: 30
        # One step, because two lists drift. This job used to enumerate a subset
        # of `make validate` by hand, and twelve of its members -- including
        # validate-session-state-contract, the drift check for the very
        # vocabulary a Console phase mismatch went dark on -- ran in no workflow
        # at all, reachable only by manual dispatch. Add a target to `validate`
        # and CI runs it; there is no second list to remember.
        #
        # Members worth knowing about when this fails: the engine include_str!s
        # the generated provider contract JSON, so the Rust-side provider
        # authority rests on validate-managed-provider-contracts matching
        # schemas/managed_providers.yml; and validate-provider-census keeps the
        # census artifact from silently going stale.
        run: make validate

      - name: Isolation wrapper fails when the guest fails
        # Every CI test lane trusts scripts/qa/test-isolation.py to return the
        # guest's exit status. When it returned None instead, failing backend
        # tests reported green (2026-09-24). The image is already local here.
        timeout-minutes: 3
        run: |
          set +e
          python3 scripts/qa/test-isolation.py --target isolation-exit-probe --command sh -c 'exit 3'
          status=$?
          set -e
          if [[ "$status" -ne 3 ]]; then
            echo "::error::test-isolation.py returned $status for a guest that exited 3"
            exit 1
          fi

      - name: Produce executable provider capability proof bundle
        timeout-minutes: 3
        run: |
          make provider-capability-coordination-proof \
            STORE_ROOT="/work/artifacts/provider-capability-proof/store" \
            BUNDLE_OUTPUT="/work/artifacts/provider-capability-proof/bundle.json" \
            PRODUCER_CLASS=release_ci \
            INVOCATION_ID="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            RUN_REFERENCE="github-actions://${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            LONGHOUSE_GIT_SHA="$GITHUB_SHA" \
            PROVIDER_VERSION=hermetic-fixture \
            PROVIDER_EXECUTABLE_IDENTITY=sha256:hermetic-fixture

      - name: Upload provider capability proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-capability-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-isolation/**/files/1/provider-capability-proof/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload provider release proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-release-proof-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-isolation/**/files/1/provider-release-proof-universal-smoke/**
          if-no-files-found: ignore
          retention-days: 7

  lifecycle:
    # Split out of Validation, where it ran serially after `make validate` and
    # was the longest single stretch of the CI critical path (~73 s of a 161 s
    # job). As its own job it runs alongside Validation for one extra image pull.
    needs: [changes, prepare-test-image]
    # Gated on the surfaces that can invalidate it. This proof starts a real
    # Runtime Host, real SQLite, real device-token auth and scripted provider
    # binaries, so only a change to those surfaces can fail it; a docs,
    # iOS-only or web-only push cannot, and paid ~6 minutes for the privilege
    # until 2026-09-24.
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.schemas == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci_plumbing == 'true') }}
    runs-on: ubuntu-24.04-arm
    name: "Managed launch lifecycle"
    timeout-minutes: 20
    env:
      # Lean fixture: no browsers or node_modules (docker/test.dockerfile).
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref_lean || needs.prepare-test-image.outputs.image_ref_lean }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Managed launch lifecycle against a real Runtime Host
        timeout-minutes: 15
        # Real FastAPI server, real SQLite, real device-token auth, real request
        # validation, scripted provider binaries. The installer smoke's fake
        # Runtime Host answers every request identically and therefore cannot
        # catch a provider gate -- the exact hole the cursor outage fell through.
        run: make test-managed-launch-lifecycle

      - name: Upload lifecycle failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-launch-lifecycle-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-isolation/**/files/1/reliability-kernel/managed-launch-lifecycle-failure.*/**
          if-no-files-found: ignore
          retention-days: 7

  backend-shards:
    timeout-minutes: 30
    needs: [changes, prepare-test-image]
    # !cancelled(): an image build skipped upstream (tag already published)
    # must not skip this job; the prepare result is the real gate.
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "Backend tests shard ${{ matrix.shard }}/3"
    # A hosted runner's four vCPUs take ~5 min for the whole suite even under
    # xdist; three runners take ~2. "Backend tests" below is the one name that
    # Deploy and Verify and ship tooling wait on.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      LONGHOUSE_TEST_SHARD: ${{ matrix.shard }}/3
      PYTEST_XDIST_WORKERS: "4"
      PYTEST_ADDOPTS: "--durations=25 --durations-min=2.0"
      # Lean fixture: no browsers or node_modules (docker/test.dockerfile).
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref_lean || needs.prepare-test-image.outputs.image_ref_lean }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Run Python Backend Tests
        run: make test

      - name: Run Hosted-Instance Helper Tests
        if: ${{ matrix.shard == 0 }}
        run: make test-hosted-instance

      - name: Run iOS simulator helper tests
        if: ${{ matrix.shard == 0 }}
        run: make test-ios-helper

  backend-tests:
    name: "Backend tests"
    needs: backend-shards
    # Skipped shards (backend unchanged) leave this skipped too, as before.
    if: ${{ !cancelled() && needs.backend-shards.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Every backend shard passed
        env:
          SHARDS: ${{ needs.backend-shards.result }}
        run: |
          echo "backend shards: $SHARDS"
          [[ "$SHARDS" == "success" ]]

  provider-contract-tests:
    # Always run: Loop 2 accepts an exact Longhouse SHA only after this job
    # proves the source-only provider assertions that do not belong in the
    # provider-launch factory matrix.
    timeout-minutes: 15
    needs: [changes, prepare-test-image]
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "Provider contract tests"
    env:
      # Lean fixture: no browsers or node_modules (docker/test.dockerfile).
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref_lean || needs.prepare-test-image.outputs.image_ref_lean }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Run exact-SHA provider contract assertions
        env:
          PYTEST_ADDOPTS: "--durations=40"
        run: make test-provider-contract

  engine-tests:
    timeout-minutes: 45
    needs: [changes, prepare-test-image]
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (needs.changes.outputs.engine == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "Engine tests"
    env:
      # Lean fixture: no browsers or node_modules (docker/test.dockerfile).
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref_lean || needs.prepare-test-image.outputs.image_ref_lean }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Run engine and shipper suite in one isolated container
        if: ${{ needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' }}
        run: make test-shipper-premerge

      - name: Run Shipper Pipeline E2E (fixture → engine ship → API → DB)
        if: ${{ needs.changes.outputs.engine != 'true' && github.event_name != 'workflow_dispatch' }}
        run: make test-shipper-e2e

  engine-compat:
    # No `needs`: this reads public release metadata over the network, not the
    # fixture image, so nothing here waits on `changes` or vice versa.
    # release-rings.md change 5 -- the server keeps accepting the engine that
    # is actually running on users' laptops right now. Runs on every push
    # (cheap: no cargo build, no fixture image) rather than gating on engine/
    # backend paths, because a server-only change can just as easily break
    # what an old engine expects from it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04-arm
    name: "Engine compatibility (previous release)"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Ship a transcript with the last released engine against the candidate server
        # `make engine-compat` downloads the newest published release that
        # isn't the candidate's own version (via `gh`, using this job's
        # token) and skips cleanly when none exists for this platform yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: make engine-compat

  frontend-tests:
    timeout-minutes: 20
    needs: [changes, prepare-test-image]
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "Frontend + runner tests"
    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref || needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Run Frontend and Runner Tests in one isolated container
        run: make test-frontend-runner

  ios-tests:
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 25
    name: "iOS tests"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

          persist-credentials: false

      - name: Install XcodeGen
        run: scripts/ci/install_xcodegen.sh

      - name: Run iOS fixture in the isolated GitHub-hosted macOS VM
        env:
          NATIVE_OPTIONS_JSON: "{}"
        run: python3 scripts/qa/native-test-bootstrap.py --target test-ios

      - name: Upload native iOS evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcresult
          if-no-files-found: ignore
          path: ${{ runner.temp }}/native-isolation-evidence
          retention-days: 1

  wheel-package:
    timeout-minutes: 20
    needs: [changes, prepare-test-image]
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (needs.changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "CLI wheel packaging"
    env:
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref || needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Verify CLI wheel packaging
        run: make test-wheel-package

  e2e-core:
    timeout-minutes: 30
    needs: [changes, prepare-test-image]
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (needs.changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "Core E2E tests"
    env:
      CI: "1"
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref || needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Run Core E2E Tests in the portable isolation boundary
        run: make test-e2e-core

      - name: Upload isolated E2E artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-e2e-artifacts
          path: artifacts/test-isolation
          retention-days: 1

  model-smoke:
    timeout-minutes: 20
    needs: changes
    if: ${{ (needs.changes.outputs.models == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "Model smoke tests"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1


      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Smoke test all models
        run: uv run --with openai python scripts/qa/smoke_models.py --ci

  oss-qa:
    timeout-minutes: 30
    needs: [changes, prepare-test-image]
    if: ${{ !cancelled() && (needs.changes.outputs.image_ref != '' || needs.prepare-test-image.result == 'success') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    name: "OSS onboarding smoke"
    env:
      CI: "1"
      LONGHOUSE_TEST_IMAGE_REF: ${{ needs.changes.outputs.image_ref || needs.prepare-test-image.outputs.image_ref }}
      LONGHOUSE_TEST_PULL_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/hosted-docker-disk

      - name: Run OSS onboarding fixture in the portable isolation boundary
        run: |
          python3 scripts/qa/test-isolation.py \
            --target qa-oss \
            --command env ONBOARDING_PLAYWRIGHT_PROJECT=onboarding-chromium \
              ./scripts/qa/qa-oss.sh --workdir /work --no-unit --no-e2e

      - name: Upload OSS isolation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-isolation-evidence
          path: artifacts/test-isolation
          if-no-files-found: ignore
          retention-days: 1
