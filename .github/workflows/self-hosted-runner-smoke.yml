name: Self-hosted Runner Smoke Test

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ci-runner-canary
  cancel-in-progress: true

jobs:
  smoke:
    name: "Canary (${{ matrix.lane }})"
    strategy:
      fail-fast: false
      matrix:
        lane: [ci-fast, ci-browser, ci-maint, ci-gate, ci-deploy]
    runs-on: ${{ matrix.lane }}
    timeout-minutes: 10
    if: ${{ github.event_name != 'schedule' || vars.GRIND_RUNNER_CANARY_ENABLED != 'false' }}

    steps:
      - name: Basic host info
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Arch: $RUNNER_ARCH"
          uname -a
          id
          nproc || true
          df -h /

      - name: Docker availability
        run: |
          set -euo pipefail
          command -v docker
          docker version
