# ROLE: product acceptance on the browser-served surface, supported mock-mode providers
# on the Linux pool against the canary ring. Assertions here are served-state, not per-cell receipts.
name: Console Served State

# One signal, one meaning: can a person who opens Longhouse in a browser
# actually run a Console turn and see it finish, on every provider that offers
# one?
#
# This is deliberately its own workflow rather than a step inside Hosted Live
# QA. That workflow has failed 34 of its last 40 runs on unrelated checks, so a
# red there means nothing and a new red would be invisible. A check nobody can
# read is not a check -- the same failure this repo already paid for when the
# 2026-08-23 Console wedge sat unnoticed for two days while a monitor mailed
# about it twice.
#
# Every other Console check asserts machine-side. All of them stayed green
# through that wedge, because none of them looked at what the browser is handed.
# This runs real stock CLI turns through a local fake model and asserts the result
# on the served surface. Schedule runs use mock mode; workflow dispatch can use
# live mode for real provider/model coverage.

# Mock-mode custom-endpoint support and protocol sources:
# - Codex: CODEX_HOME/config.toml openai_base_url routes the built-in OpenAI
#   provider through Responses; mock mode signs in only a disposable dummy key.
#   https://developers.openai.com/codex/config-advanced
#   https://developers.openai.com/codex/auth
# - Claude Code: ANTHROPIC_BASE_URL; the endpoint also handles Messages/count_tokens
#   https://code.claude.com/docs/en/llm-gateway-protocol
# - OpenCode: provider.*.options.baseURL in ~/.config/opencode/opencode.json
#   https://opencode.ai/docs/providers/
# - Pi: ~/.pi/agent/models.json baseUrl + api=openai-completions
#   https://pi.dev/docs/latest/models
# - OMP: ~/.omp/agent/models.yml baseUrl + api=openai-completions
#   https://github.com/can1357/oh-my-pi/blob/main/docs/providers.md
# - Antigravity: GOOGLE_GEMINI_BASE_URL; the fake serves Gemini generateContent SSE
#   https://www.antigravity.google/docs/cli/install
# Gemini wire protocol: https://ai.google.dev/api/generate-content
# Cursor is excluded: cursor-agent has no supported custom model base-URL setting.
# Mock mode exposes no provider secrets; live mode retains all seven providers.
# Claude Code's unauthenticated startup checks are public health probes, not
# model requests (https://github.com/anthropics/claude-code/issues/81611).
# Its Messages/count_tokens model API requests use the loopback base URL.


on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "mock (local fake LLM) or live (real provider calls)"
        required: false
        default: "mock"
        type: choice
        options:
          - mock
          - live
      provider:
        description: "Provider to prove, or 'all'"
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: console-served-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  console-served-state:
    name: "console-served-state"
    runs-on: cube-browser
    if: github.repository == 'cipher982/longhouse'
    timeout-minutes: 60
    env:
      LONGHOUSE_MACHINE_TOKEN: ${{ secrets.HOSTED_CANARY_RUNTIME_TOKEN }}
      INSTANCE_SUBDOMAIN: ${{ vars.HOSTED_CANARY_SUBDOMAIN }}
      LONGHOUSE_API_URL: https://${{ vars.HOSTED_CANARY_SUBDOMAIN }}.longhouse.ai
      LONGHOUSE_QA_HOSTED_TARGET: https://${{ vars.HOSTED_CANARY_SUBDOMAIN }}.longhouse.ai
      CONSOLE_QA_MODE: ${{ inputs.mode || 'mock' }}
      CONSOLE_QA_PROVIDER: ${{ inputs.provider || 'all' }}
      CODEX_API_KEY: ${{ inputs.mode == 'live' && secrets.LONGHOUSE_CI_OPENAI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ inputs.mode == 'live' && secrets.LONGHOUSE_CI_ANTHROPIC_API_KEY || '' }}
      CURSOR_API_KEY: ${{ inputs.mode == 'live' && secrets.LONGHOUSE_CI_CURSOR_API_KEY || '' }}
      GEMINI_API_KEY: ${{ inputs.mode == 'live' && secrets.LONGHOUSE_CI_GEMINI_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ inputs.mode == 'live' && secrets.LONGHOUSE_CI_OPENCODE_OPENROUTER_API_KEY || '' }}
      CODEX_MODEL: ${{ vars.CONSOLE_QA_CODEX_MODEL }}
      ANTHROPIC_MODEL: ${{ vars.CONSOLE_QA_ANTHROPIC_MODEL }}
      CURSOR_MODEL: ${{ vars.CONSOLE_QA_CURSOR_MODEL }}
      LONGHOUSE_OPENCODE_QUALIFICATION_MODEL: ${{ vars.CONSOLE_QA_OPENCODE_MODEL }}
      LONGHOUSE_PI_QUALIFICATION_MODEL: ${{ vars.CONSOLE_QA_PI_MODEL }}
      LONGHOUSE_OMP_QUALIFICATION_MODEL: ${{ vars.CONSOLE_QA_OMP_MODEL }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate isolated canary configuration
        run: |
          set -euo pipefail
          case "${INSTANCE_SUBDOMAIN,,}" in
            ""|david010|demo)
              echo "::error::Configure a dedicated HOSTED_CANARY_SUBDOMAIN; refusing personal dogfood or demo." >&2
              exit 1
              ;;
          esac
          if [[ -z "$LONGHOUSE_MACHINE_TOKEN" ]]; then
            echo "::error::Missing HOSTED_CANARY_RUNTIME_TOKEN; refusing unauthenticated Console coverage." >&2
            exit 1
          fi
          case "$CONSOLE_QA_MODE" in
            mock|live) ;;
            *) echo "::error::Unsupported Console mode: $CONSOLE_QA_MODE" >&2; exit 1 ;;
          esac
          if [[ "$CONSOLE_QA_MODE" == live ]]; then
            for required_credential in CODEX_API_KEY ANTHROPIC_API_KEY CURSOR_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY; do
              if [[ -z "${!required_credential:-}" ]]; then
                echo "::error::Missing scoped CI provider credential: $required_credential" >&2
                exit 1
              fi
            done
          fi
          if [[ ! "$CONSOLE_QA_PROVIDER" =~ ^[A-Za-z0-9,_-]+$ ]]; then
            echo "::error::Console provider input contains unsafe characters." >&2
            exit 1
          fi
          if [[ "$CONSOLE_QA_MODE" == mock && "$CONSOLE_QA_PROVIDER" != all ]]; then
            mock_providers=",codex,claude,opencode,pi,omp,antigravity,"
            IFS=',' read -r -a requested_providers <<< "$CONSOLE_QA_PROVIDER"
            for provider in "${requested_providers[@]}"; do
              if [[ -z "$provider" || "$mock_providers" != *",$provider,"* ]]; then
                echo "::error::Mock mode supports only codex, claude, opencode, pi, omp, and antigravity; cursor requires live mode." >&2
                exit 1
              fi
            done
          fi
          if [[ "$CONSOLE_QA_MODE" == live ]]; then
            for required_model in CODEX_MODEL ANTHROPIC_MODEL CURSOR_MODEL \
              LONGHOUSE_OPENCODE_QUALIFICATION_MODEL LONGHOUSE_PI_QUALIFICATION_MODEL \
              LONGHOUSE_OMP_QUALIFICATION_MODEL; do
              if [[ -z "${!required_model:-}" ]]; then
                echo "::error::Missing canonical provider model binding: $required_model" >&2
                exit 1
              fi
            done
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05

      - name: Stage stock providers and native engine in job-owned paths
        id: fixture
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d "$RUNNER_TEMP/console-served-state-fixture.XXXXXX")"
          staging_ok=0
          trap 'if [[ "$staging_ok" != 1 ]]; then rm -rf -- "$fixture_root"; fi' EXIT INT TERM
          chmod 700 "$fixture_root"
          provider_root="$fixture_root/providers"
          home="$fixture_root/home"
          # Discovery admits only canonical roots that already exist at Agent
          # startup. Create every root used by the seven Console adapters so a
          # stock provider's first turn cannot race root creation and disappear
          # from the served transcript.
          mkdir -p \
            "$provider_root" "$home" "$fixture_root/bin" "$fixture_root/workspace" \
            "$home/.claude/projects" "$home/.codex/sessions" \
            "$home/.pi/agent/sessions" \
            "$home/.gemini/antigravity-cli/brain" "$home/.gemini/antigravity/brain" "$home/.gemini/tmp" \
            "$home/.local/share/opencode" "$home/.local/share/omp/sessions" \
            "$home/.longhouse/agent/pi-console" "$home/.longhouse/agent/cursor-acp-source" \
            "$home/.config/cursor/chats" "$home/.cursor/chats" "$home/.cursor/projects"
          git init --quiet "$fixture_root/workspace"
          echo "CONSOLE_QA_CWD=$fixture_root/workspace" >> "$GITHUB_ENV"
          echo "CONSOLE_FIXTURE_ROOT=$fixture_root" >> "$GITHUB_ENV"
          printf '%s\n' '{"modelProvider":"gemini"}' > "$home/.gemini/antigravity-cli/settings.json"
          chmod 600 "$home/.gemini/antigravity-cli/settings.json"
          # engine/build.rs requires the checkout-scoped identity before any
          # cargo invocation. This lane builds from a fresh checkout, so the
          # ignored identity must be generated in this same step and verified
          # before cargo performs its preflight.
          python3 "$GITHUB_WORKSPACE/scripts/build/generate_build_identity.py" \
            --output "$GITHUB_WORKSPACE/.build/build-identity.json"
          test -s "$GITHUB_WORKSPACE/.build/build-identity.json"
          python3 "$GITHUB_WORKSPACE/scripts/build/cargo.py" exec -- \
            build --manifest-path "$GITHUB_WORKSPACE/engine/Cargo.toml" --profile ci --bin longhouse-engine --bin longhouse
          engine="$(python3 "$GITHUB_WORKSPACE/scripts/build/cargo.py" artifact --profile ci --bin longhouse-engine)"
          cli="$(python3 "$GITHUB_WORKSPACE/scripts/build/cargo.py" artifact --profile ci --bin longhouse)"
          test -x "$engine"
          test -x "$cli"
          export HOME="$home"
          export XDG_CONFIG_HOME="$home/.config"
          export XDG_DATA_HOME="$home/.local/share"
          export PATH="$fixture_root/bin:$home/.local/bin:$PATH"
          export LONGHOUSE_ENGINE_BIN="$engine"
          install -m 755 "$cli" "$fixture_root/bin/longhouse"
          # Claude Console admission is deliberately gated on its lifecycle
          # hook. Configure the disposable profile with the paired engine
          # before the Machine Agent computes its capabilities.
          "$fixture_root/bin/longhouse" claude configure --claude-dir "$home/.claude"
          export PATH="$fixture_root/bin:$home/.local/bin:$PATH"
          # Installation scripts are untrusted network inputs; never expose
          # provider credentials while they run. The next step receives the
          # job-scoped secrets again from the workflow environment.
          unset CODEX_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN \
            CLAUDE_CODE_OAUTH_TOKEN CURSOR_API_KEY CURSOR_ACCESS_TOKEN GEMINI_API_KEY \
            GOOGLE_API_KEY OPENROUTER_API_KEY PI_OPENROUTER_API_KEY OMP_OPENROUTER_API_KEY \
            LONGHOUSE_MACHINE_TOKEN
          # These are upstream package/install surfaces, staged below the
          # disposable fixture root. Nothing is written to the runner's user
          # profile or PATH.
          npm install --prefix "$provider_root" --no-save \
            @openai/codex \
            @anthropic-ai/claude-code \
            opencode-ai \
            @earendil-works/pi-coding-agent
          curl -fsSL https://omp.sh/install | sh -s -- --binary
          curl -fsSL https://cursor.com/install -o "$fixture_root/cursor-install.sh"
          bash "$fixture_root/cursor-install.sh"
          curl -fsSL https://antigravity.google/cli/install.sh -o "$fixture_root/antigravity-install.sh"
          bash "$fixture_root/antigravity-install.sh" --dir "$home/.local/bin"
          # Keep the disposable home explicit across steps. Live mode logs in
          # with its scoped key; mock mode uses only a non-secret dummy key.
          echo "HOME=$home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$home/.config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$home/.local/share" >> "$GITHUB_ENV"
          echo "PATH=$fixture_root/bin:$home/.local/bin:$PATH" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$home/.codex" >> "$GITHUB_ENV"
          echo "LONGHOUSE_CLI_BIN=$fixture_root/bin/longhouse" >> "$GITHUB_ENV"
          echo "LONGHOUSE_ENGINE_BIN=$engine" >> "$GITHUB_ENV"
          echo "CONSOLE_FIXTURE_ENGINE=$engine" >> "$GITHUB_ENV"
          for pair in \
            "LONGHOUSE_CODEX_BIN=$provider_root/node_modules/.bin/codex" \
            "LONGHOUSE_CLAUDE_BIN=$provider_root/node_modules/.bin/claude" \
            "LONGHOUSE_OPENCODE_BIN=$provider_root/node_modules/.bin/opencode" \
            "LONGHOUSE_PI_BIN=$provider_root/node_modules/.bin/pi" \
            "LONGHOUSE_OMP_BIN=$home/.local/bin/omp" \
            "LONGHOUSE_CURSOR_BIN=$home/.local/bin/cursor-agent" \
            "LONGHOUSE_ANTIGRAVITY_BIN=$home/.local/bin/agy"; do
            name="${pair%%=*}"
            path="${pair#*=}"
            if [[ -x "$path" ]]; then
              echo "$name=$path" >> "$GITHUB_ENV"
            else
              echo "::warning::Owned Console fixture lacks $name; all-provider report will retain it as unavailable."
            fi
          done
          staging_ok=1


      - name: Start loopback fake LLM and configure disposable profiles
        if: env.CONSOLE_QA_MODE == 'mock'
        run: |
          set -euo pipefail
          port_file="$CONSOLE_FIXTURE_ROOT/mock-llm.port"
          owner_file="$CONSOLE_FIXTURE_ROOT/mock-llm.owner"
          log_file="$CONSOLE_FIXTURE_ROOT/mock-llm.log"
          # One process with no children: ownership is its PID, which cleanup
          # re-checks against the script name before signalling.
          nohup python3 "$GITHUB_WORKSPACE/scripts/qa/console-served-state-mock-llm.py" \
            --port-file "$port_file" > "$log_file" 2>&1 < /dev/null &
          endpoint_pid=$!
          printf '%s\n' "$endpoint_pid" > "$owner_file"
          for attempt in {1..40}; do
            if [[ -s "$port_file" ]]; then
              break
            fi
            if ! kill -0 "$endpoint_pid" 2>/dev/null; then
              cat "$log_file" >&2
              echo "::error::Loopback fake LLM exited before binding." >&2
              exit 1
            fi
            sleep 0.25
          done
          if [[ ! -s "$port_file" ]]; then
            cat "$log_file" >&2
            echo "::error::Loopback fake LLM did not bind in time." >&2
            exit 1
          fi
          mock_port="$(cat "$port_file")"
          if [[ ! "$mock_port" =~ ^[0-9]+$ ]]; then
            echo "::error::Loopback fake LLM returned an invalid port." >&2
            exit 1
          fi
          mock_url="http://127.0.0.1:$mock_port"
          export MOCK_LLM_BASE_URL="$mock_url"
          curl --retry 20 --retry-connrefused --retry-delay 0 --max-time 2 -fsS \
            "$mock_url/healthz" >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          home = Path(os.environ["HOME"])
          base = os.environ["MOCK_LLM_BASE_URL"]
          openai_base = f"{base}/v1"

          codex = home / ".codex" / "config.toml"
          codex.parent.mkdir(parents=True, exist_ok=True)
          codex.write_text(
              'model_provider = "openai"\n'
              'model = "mock-model"\n'
              f'openai_base_url = "{openai_base}"\n',
              encoding="utf-8",
          )
          codex.chmod(0o600)

          opencode = home / ".config" / "opencode" / "opencode.json"
          opencode.parent.mkdir(parents=True, exist_ok=True)
          opencode.write_text(
              json.dumps(
                  {
                      "$schema": "https://opencode.ai/config.json",
                      "provider": {
                          "longhouse-mock": {
                              "npm": "@ai-sdk/openai-compatible",
                              "name": "Longhouse mock",
                              "options": {"baseURL": openai_base, "apiKey": "longhouse-mock-key"},
                              "models": {"mock-model": {"name": "Longhouse mock"}},
                          }
                      },
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          opencode.chmod(0o600)

          pi = home / ".pi" / "agent" / "models.json"
          pi.parent.mkdir(parents=True, exist_ok=True)
          custom_model = {
              "id": "mock-model",
              "name": "Longhouse mock",
              "contextWindow": 200000,
              "maxTokens": 8192,
          }
          pi.write_text(
              json.dumps(
                  {
                      "providers": {
                          "longhouse-mock": {
                              "baseUrl": openai_base,
                              "api": "openai-completions",
                              "apiKey": "longhouse-mock-key",
                              "models": [custom_model],
                          }
                      }
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          pi.chmod(0o600)

          omp = home / ".omp" / "agent" / "models.yml"
          omp.parent.mkdir(parents=True, exist_ok=True)
          omp.write_text(
              "providers:\n"
              "  longhouse-mock:\n"
              f'    baseUrl: "{openai_base}"\n'
              "    api: openai-completions\n"
              "    apiKey: longhouse-mock-key\n"
              "    models:\n"
              "      - id: mock-model\n"
              "        name: Longhouse mock\n"
              "        contextWindow: 200000\n"
              "        maxTokens: 8192\n",
              encoding="utf-8",
          )
          omp.chmod(0o600)
          PY
          {
            echo "MOCK_LLM_BASE_URL=$mock_url"
            echo "ANTHROPIC_API_KEY=longhouse-mock-key"
            echo "ANTHROPIC_BASE_URL=$mock_url"
            echo "OPENROUTER_API_KEY=longhouse-mock-key"
            echo "GEMINI_API_KEY=longhouse-mock-key"
            echo "GOOGLE_GEMINI_BASE_URL=$mock_url"
            echo "DISABLE_AUTOUPDATER=1"
            echo "CODEX_MODEL=mock-model"
            echo "LONGHOUSE_OPENCODE_QUALIFICATION_MODEL=longhouse-mock/mock-model"
            echo "LONGHOUSE_PI_QUALIFICATION_MODEL=longhouse-mock/mock-model"
            echo "LONGHOUSE_OMP_QUALIFICATION_MODEL=longhouse-mock/mock-model"
          } >> "$GITHUB_ENV"

      - name: Prove Console on the browser-served surface
        id: served_state
        run: |
          set -euo pipefail
          if [[ "$CONSOLE_QA_MODE" == live ]]; then
            # Authenticate stock Codex in the disposable profile through its
            # supported stdin login path. The helper removes both internal and
            # ambient OpenAI credential variables from the child process.
            PYTHONPATH="$GITHUB_WORKSPACE/server" python3 -c \
              'import os,sys; from pathlib import Path; from zerg.qa.codex_auth import login_with_api_key; print(login_with_api_key(Path(sys.argv[1]), api_key=os.environ["CODEX_API_KEY"], environment=os.environ, cwd=Path(sys.argv[2])))' \
              "$LONGHOUSE_CODEX_BIN" "$CONSOLE_QA_CWD" > "$CONSOLE_FIXTURE_ROOT/codex-auth-receipt.txt"
          else
            # Satisfy the Machine Agent's native Codex readiness probe with a
            # dummy key stored only in this disposable profile.
            PYTHONPATH="$GITHUB_WORKSPACE/server" python3 -c \
              'import os,sys; from pathlib import Path; from zerg.qa.codex_auth import login_with_api_key; print(login_with_api_key(Path(sys.argv[1]), api_key="mock-not-a-key", environment=os.environ, cwd=Path(sys.argv[2])))' \
              "$LONGHOUSE_CODEX_BIN" "$CONSOLE_QA_CWD" > "$CONSOLE_FIXTURE_ROOT/codex-auth-receipt.txt"
          fi
          # The child now uses only the isolated Codex auth.json; never pass
          # the Longhouse binding or an ambient OpenAI key to Console.
          unset CODEX_API_KEY OPENAI_API_KEY
          if [[ "$CONSOLE_QA_MODE" == mock ]]; then
            unset ANTHROPIC_AUTH_TOKEN ANTHROPIC_OAUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN \
              CURSOR_ACCESS_TOKEN GOOGLE_API_KEY OPENAI_CODEX_OAUTH_TOKEN \
              PI_OPENROUTER_API_KEY OMP_OPENROUTER_API_KEY
          fi
          provider_arg="$CONSOLE_QA_PROVIDER"
          if [[ "$CONSOLE_QA_MODE" == mock && "$provider_arg" == all ]]; then
            provider_arg="codex,claude,opencode,pi,omp,antigravity"
          fi
          mkdir -p artifacts
          result="artifacts/console-served-state.json"
          uv run --project server python scripts/qa/console-served-state-e2e.py \
            --owned-machine-agent \
            --engine "$CONSOLE_FIXTURE_ENGINE" \
            --provider "$provider_arg" \
            --cwd "$CONSOLE_QA_CWD" \
            --api-url "$LONGHOUSE_API_URL" \
            --json-out "$result"
          verdict="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("verdict", ""))' "$result" 2>/dev/null || echo "")"
          case "$verdict" in
            green) echo "Console proved on the served surface." ;;
            unqualified) echo "::error::No machine could serve a Console turn; nothing was proved."; exit 1 ;;
            *) echo "::error::Console served-state verdict: ${verdict:-unknown}"; exit 1 ;;
          esac

      - name: Summarise
        if: always()
        run: |
          result="artifacts/console-served-state.json"
          if [[ -n "$result" && -s "$result" ]]; then
            python3 scripts/qa/summarise-console-served-state.py "$result" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Console served state" >> "$GITHUB_STEP_SUMMARY"
            echo "No artifact produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain fixture diagnostics
        if: always()
        run: |
          set -euo pipefail
          diagnostics="artifacts/console-fixture"
          mkdir -p "$diagnostics"
          fixture_root="${CONSOLE_FIXTURE_ROOT:-}"
          if [[ -n "$fixture_root" && "$fixture_root" == "$RUNNER_TEMP"/* ]]; then
            if [[ -f "$fixture_root/codex-auth-receipt.txt" ]]; then
              cp -- "$fixture_root/codex-auth-receipt.txt" "$diagnostics/codex-auth-receipt.txt"
            fi
            if [[ -f "$fixture_root/mock-llm.log" ]]; then
              cp -- "$fixture_root/mock-llm.log" "$diagnostics/mock-llm.log"
            fi
            antigravity_logs="$fixture_root/home/.longhouse/agent/antigravity-console"
            if [[ -d "$antigravity_logs" ]]; then
              mkdir -p "$diagnostics/antigravity-console"
              cp -R -- "$antigravity_logs/." "$diagnostics/antigravity-console/"
            fi
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-served-state-${{ github.run_id }}
          path: |
            artifacts/console-served-state.json
            artifacts/console-fixture
          if-no-files-found: ignore


      - name: Stop loopback fake LLM
        if: always()
        run: |
          set -euo pipefail
          fixture_root="${CONSOLE_FIXTURE_ROOT:-}"
          if [[ -n "$fixture_root" ]]; then
            owner_file="$fixture_root/mock-llm.owner"
            if [[ -f "$owner_file" ]]; then
              read -r endpoint_pid < "$owner_file"
              if [[ "$endpoint_pid" =~ ^[0-9]+$ ]] &&
                grep -qa console-served-state-mock-llm.py "/proc/$endpoint_pid/cmdline" 2>/dev/null; then
                kill -TERM "$endpoint_pid" 2>/dev/null || true
                for attempt in {1..20}; do
                  if ! kill -0 "$endpoint_pid" 2>/dev/null; then
                    break
                  fi
                  sleep 0.1
                done
                if kill -0 "$endpoint_pid" 2>/dev/null; then
                  kill -KILL "$endpoint_pid" 2>/dev/null || true
                  for attempt in {1..20}; do
                    if ! kill -0 "$endpoint_pid" 2>/dev/null; then
                      break
                    fi
                    sleep 0.1
                  done
                fi
                if kill -0 "$endpoint_pid" 2>/dev/null; then
                  echo "::error::Loopback fake LLM process survived cleanup." >&2
                  exit 1
                fi
              fi
            fi
          fi
      - name: Remove owned fixture state
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CONSOLE_FIXTURE_ROOT:-}" && "$CONSOLE_FIXTURE_ROOT" == "$RUNNER_TEMP"/* ]]; then
            rm -rf -- "$CONSOLE_FIXTURE_ROOT"
          fi
