name: Console Served State

# One signal, one meaning: can a person who opens Longhouse in a browser
# actually run a Console turn and see it finish, on every provider that offers
# one?
#
# This is deliberately its own workflow rather than a step inside Hosted Live
# QA. That workflow has failed 34 of its last 40 runs on unrelated checks, so a
# red there means nothing and a new red would be invisible. A check nobody can
# read is not a check -- the same failure this repo already paid for when the
# 2026-08-23 Console wedge sat unnoticed for two days while a monitor mailed
# about it twice.
#
# Every other Console check asserts machine-side. All of them stayed green
# through that wedge, because none of them looked at what the browser is handed.
# This one drives a real turn and asserts on the served surface.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to prove, or 'all'"
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: console-served-state-${{ github.repository }}
  cancel-in-progress: true

jobs:
  console-served-state:
    name: "console-served-state"
    runs-on: ubuntu-latest
    if: github.repository == 'cipher982/longhouse'
    timeout-minutes: 20
    env:
      # The harness reads these two names; the repo secret is called something
      # else. Getting this wrong is silent -- it produced six "provider
      # unavailable" results that looked like a broken product and were really
      # an unauthenticated client.
      LONGHOUSE_MACHINE_TOKEN: ${{ secrets.LONGHOUSE_DEVICE_TOKEN }}
      LONGHOUSE_API_URL: https://${{ vars.HOSTED_CANARY_SUBDOMAIN || 'david010' }}.longhouse.ai
      # "all" enumerates every connected machine and asks each only about the
      # providers it advertises. Pinning one device is how a second machine rots
      # unnoticed: the always-on box sat with a dead Claude credential while this
      # check stayed green, because the check only ever asked the laptop -- and
      # an always-on box is precisely the one nobody is sitting in front of.
      LONGHOUSE_DEVICE_ID: ${{ vars.CONSOLE_QA_DEVICE_ID || 'all' }}
      # The turn runs on the target machine, so the working directory must exist
      # THERE. The harness default is derived from the caller's home, which on a
      # CI runner is a path the machine has never heard of -- every turn came
      # back state=failed until this was explicit.
      CONSOLE_QA_CWD: ${{ vars.CONSOLE_QA_CWD || '/Users/davidrose/git/zerg' }}
      QA_HOME: /tmp/console-served-state-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Prepare isolated QA home
        run: mkdir -p "$QA_HOME"

      - name: Prove Console on the browser-served surface
        id: served_state
        env:
          HOME: ${{ env.QA_HOME }}
        run: |
          if [[ -z "$LONGHOUSE_MACHINE_TOKEN" ]]; then
            echo "::error::No device token configured; cannot reach the served surface."
            exit 1
          fi
          set +e
          make test-console-served-state-e2e \
            ARGS="--provider ${{ github.event.inputs.provider || 'all' }} --device-id $LONGHOUSE_DEVICE_ID --cwd $CONSOLE_QA_CWD --json-out $GITHUB_WORKSPACE/console-served-state.json"
          set -e
          # Red and unqualified are different facts and must not share an exit
          # code. Red means a Console turn broke on a machine that could run it.
          # Unqualified means no machine could run one, which says nothing about
          # Console -- failing on it would cry wolf nightly and teach everyone
          # to ignore the one signal that is supposed to mean something.
          verdict="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("verdict",""))' console-served-state.json 2>/dev/null || echo "")"
          case "$verdict" in
            green) echo "Console proved on the served surface." ;;
            unqualified) echo "::warning::No machine could serve a Console turn; nothing was proved." ;;
            *) echo "::error::Console served-state verdict: ${verdict:-unknown}"; exit 1 ;;
          esac

      - name: Summarise
        if: always()
        run: |
          if [[ -s console-served-state.json ]]; then
            python3 scripts/qa/summarise-console-served-state.py console-served-state.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Console served state" >> "$GITHUB_STEP_SUMMARY"
            echo "No artifact produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-served-state-${{ github.run_id }}
          path: console-served-state.json
          if-no-files-found: ignore
