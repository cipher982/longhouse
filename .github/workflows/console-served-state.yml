name: Console Served State

# One signal, one meaning: can a person who opens Longhouse in a browser
# actually run a Console turn and see it finish, on every provider that offers
# one?
#
# This is deliberately its own workflow rather than a step inside Hosted Live
# QA. That workflow has failed 34 of its last 40 runs on unrelated checks, so a
# red there means nothing and a new red would be invisible. A check nobody can
# read is not a check -- the same failure this repo already paid for when the
# 2026-08-23 Console wedge sat unnoticed for two days while a monitor mailed
# about it twice.
#
# Every other Console check asserts machine-side. All of them stayed green
# through that wedge, because none of them looked at what the browser is handed.
# This one drives a real turn and asserts on the served surface.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to prove, or 'all'"
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: console-served-state-${{ github.repository }}
  cancel-in-progress: true

jobs:
  console-served-state:
    name: "console-served-state"
    runs-on: ubuntu-latest
    if: github.repository == 'cipher982/longhouse'
    timeout-minutes: 20
    env:
      LONGHOUSE_MACHINE_TOKEN: ${{ secrets.HOSTED_CANARY_RUNTIME_TOKEN }}
      INSTANCE_SUBDOMAIN: ${{ vars.HOSTED_CANARY_SUBDOMAIN }}
      LONGHOUSE_API_URL: https://${{ vars.HOSTED_CANARY_SUBDOMAIN }}.longhouse.ai
      LONGHOUSE_DEVICE_ID: ${{ vars.CONSOLE_QA_DEVICE_ID || 'all' }}
      CONSOLE_QA_CWD: ${{ vars.CONSOLE_QA_CWD }}
      CONSOLE_QA_PROVIDER: ${{ inputs.provider || 'all' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate isolated canary configuration
        run: |
          set -euo pipefail
          case "${INSTANCE_SUBDOMAIN,,}" in
            ""|david010|demo)
              echo "::error::Configure a dedicated HOSTED_CANARY_SUBDOMAIN; refusing personal dogfood or demo." >&2
              exit 1
              ;;
          esac
          if [[ -z "$LONGHOUSE_MACHINE_TOKEN" ]]; then
            echo "::error::Missing HOSTED_CANARY_RUNTIME_TOKEN; refusing unauthenticated Console coverage." >&2
            exit 1
          fi
          if [[ -z "$CONSOLE_QA_CWD" || ! "$CONSOLE_QA_CWD" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::CONSOLE_QA_CWD must be an explicit absolute canary-machine path." >&2
            exit 1
          fi
          if [[ ! "$CONSOLE_QA_PROVIDER" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Console provider input contains unsafe characters." >&2
            exit 1
          fi
          if [[ ! "$LONGHOUSE_DEVICE_ID" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "::error::Console device target contains unsafe characters." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare credential-free isolation image
        id: prepare
        run: |
          set -euo pipefail
          echo "image=$(python3 scripts/qa/test-isolation.py --prepare)" >> "$GITHUB_OUTPUT"

      - name: Prove Console on the browser-served surface
        id: served_state
        run: |
          set -euo pipefail
          credentials="$(mktemp "$RUNNER_TEMP/console-served-state-credentials.XXXXXX.json")"
          trap 'rm -f "$credentials"' EXIT INT TERM
          chmod 600 "$credentials"
          python3 - "$credentials" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"LONGHOUSE_MACHINE_TOKEN": os.environ["LONGHOUSE_MACHINE_TOKEN"]}, stream)
          PY
          python3 scripts/qa/test-isolation.py \
            --live \
            --image "${{ steps.prepare.outputs.image }}" \
            --credentials "$credentials" \
            --target test-console-served-state-e2e \
            --set "ARGS=--provider $CONSOLE_QA_PROVIDER --device-id $LONGHOUSE_DEVICE_ID --cwd $CONSOLE_QA_CWD --json-out /work/artifacts/console-served-state.json" \
            --set "LONGHOUSE_API_URL=$LONGHOUSE_API_URL" \
            --set "LONGHOUSE_DEVICE_ID=$LONGHOUSE_DEVICE_ID" \
            --set "CONSOLE_QA_PROVIDER=$CONSOLE_QA_PROVIDER" \
            --set "CONSOLE_QA_CWD=$CONSOLE_QA_CWD"
          result="$(python3 - <<'PY'
          from pathlib import Path

          matches = sorted(
              Path("artifacts/test-isolation").glob(
                  "*/files/1/console-served-state.json"
              )
          )
          print(matches[0] if matches else "")
          PY
          )"
          if [[ -z "$result" ]]; then
            echo "::error::Console served-state produced no collected result." >&2
            exit 1
          fi
          # Green means the served surface completed a real Console turn.
          # Unqualified means the canary could not run one; it is not evidence
          # of success and must fail the check so release qualification cannot
          # publish a green result for an empty machine directory.
          verdict="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("verdict",""))' "$result" 2>/dev/null || echo "")"
          case "$verdict" in
            green) echo "Console proved on the served surface." ;;
            unqualified) echo "::error::No machine could serve a Console turn; nothing was proved."; exit 1 ;;
            *) echo "::error::Console served-state verdict: ${verdict:-unknown}"; exit 1 ;;
          esac

      - name: Summarise
        if: always()
        run: |
          result="$(python3 - <<'PY'
          from pathlib import Path

          matches = sorted(
              Path("artifacts/test-isolation").glob(
                  "*/files/1/console-served-state.json"
              )
          )
          print(matches[0] if matches else "")
          PY
          )"
          if [[ -n "$result" && -s "$result" ]]; then
            python3 scripts/qa/summarise-console-served-state.py "$result" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Console served state" >> "$GITHUB_STEP_SUMMARY"
            echo "No artifact produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-served-state-${{ github.run_id }}
          path: artifacts/test-isolation/**/files/1/console-served-state.json
          if-no-files-found: ignore
