name: Installer Validation Ring

on:
  push:
    branches:
      - '**'
    paths:
      - 'scripts/install.sh'
      - 'scripts/ci/installer-first-run.sh'
      - 'scripts/ci/native-installer-smoke.sh'
      - 'scripts/qa/test-local-runtime-packaging.sh'
      - 'scripts/resolve-swift-product-path.sh'
      - 'server/pyproject.toml'
      - 'server/zerg/cli/**'
      - 'server/zerg/__main__.py'
      - 'desktop/LonghouseMenuBarHarness/**'
      - 'engine/**'
      - 'runner/**'
      - 'swift/**'
      - '.github/workflows/test-install.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/ci/installer-first-run.sh'
      - 'scripts/ci/native-installer-smoke.sh'
      - 'scripts/qa/test-local-runtime-packaging.sh'
      - 'scripts/resolve-swift-product-path.sh'
      - 'server/pyproject.toml'
      - 'server/zerg/cli/**'
      - 'server/zerg/__main__.py'
      - 'desktop/LonghouseMenuBarHarness/**'
      - 'engine/**'
      - 'runner/**'
      - 'swift/**'
      - '.github/workflows/test-install.yml'
  schedule:
    - cron: '11 9 * * *'
  workflow_dispatch:
    inputs:
      run_public_canary:
        description: 'Also run the published installer canary against the default branch'
        required: false
        default: false
        type: boolean

jobs:
  runtime-packaging-macos:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: macos-latest
    timeout-minutes: 20
    name: "runtime-packaging--macos-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run canonical macOS app packaging smoke
        run: make test-runtime-packaging-macos

      - name: Upload packaging artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packaging-macos
          if-no-files-found: ignore
          path: artifacts/runtime-packaging

  installer-first-run-local:
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell_path: /bin/bash
            menubar_smoke: '0'
          - os: macos-latest
            shell_path: /bin/zsh
            menubar_smoke: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: "installer-happy-path--${{ matrix.os }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05

      - name: Run hermetic native installer smoke
        run: bash scripts/ci/native-installer-smoke.sh

  installer-first-run-remote:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_public_canary) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell_path: /bin/bash
          - os: macos-latest
            shell_path: /bin/zsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: "installer-public-canary--${{ matrix.os }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run public installer smoke
        run: |
          chmod +x scripts/ci/native-installer-smoke.sh
          chmod +x scripts/ci/check-public-installer-sync.sh
          release_json="$(gh release view --json tagName)"
          release_tag="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tagName"])' <<< "$release_json")"
          export LONGHOUSE_NATIVE_SMOKE_REMOTE=1
          export LONGHOUSE_NATIVE_SMOKE_EXPECTED_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" --jq .sha)"
          export LONGHOUSE_NATIVE_SMOKE_EXPECTED_VERSION="${release_tag#v}"
          ./scripts/ci/native-installer-smoke.sh
