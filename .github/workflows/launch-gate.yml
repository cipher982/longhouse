name: Launch Gate

# The one ring for install and onboarding. It used to be three workflows
# (Launch Gate, Installer Validation Ring, Runner Onboarding Validation Ring)
# on three crons within an hour of each other, running the same native
# installer smoke twice and the same fresh-clone onboarding funnel twice.

on:
  push:
    tags-ignore:
      - 'v*'
    paths:
      - '.github/workflows/launch-gate.yml'
      - '.github/workflows/local-runtime-release.yml'
      - 'server/pyproject.toml'
      - 'server/zerg/cli/connect.py'
      - 'server/zerg/cli/codex.py'
      - 'server/zerg/cli/doctor.py'
      - 'server/zerg/cli/onboard.py'
      - 'server/zerg/cli/serve.py'
      - 'server/zerg/services/local_runtime_installer.py'
      - 'server/zerg/services/runtime_artifacts.py'
      - 'server/zerg/routers/runners.py'
      - 'server/zerg/routers/templates/install.sh'
      - 'web/src/components/AddRunnerModal.tsx'
      - 'web/src/components/chat/RunnerSetupCard.tsx'
      - 'web/src/lib/runnerInstallCommands.ts'
      - 'web/src/pages/RunnersPage.tsx'
      - 'desktop/LonghouseMenuBarHarness/**'
      - 'e2e/**'
      - 'engine/**'
      - 'runner/**'
      - 'swift/**'
      - 'scripts/install.sh'
      - 'scripts/ci/native-installer-smoke.sh'
      - 'scripts/ci/runtime-artifact-smoke.py'
      - 'scripts/ops/run-onboarding-funnel.sh'
      - 'scripts/qa/qa-oss.sh'
      - 'scripts/qa/test-local-runtime-packaging.sh'
      - 'scripts/resolve-swift-product-path.sh'
      - 'Makefile'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/launch-gate.yml'
      - '.github/workflows/local-runtime-release.yml'
      - 'server/pyproject.toml'
      - 'server/zerg/cli/connect.py'
      - 'server/zerg/cli/codex.py'
      - 'server/zerg/cli/doctor.py'
      - 'server/zerg/cli/onboard.py'
      - 'server/zerg/cli/serve.py'
      - 'server/zerg/services/local_runtime_installer.py'
      - 'server/zerg/services/runtime_artifacts.py'
      - 'server/zerg/routers/runners.py'
      - 'server/zerg/routers/templates/install.sh'
      - 'web/src/components/AddRunnerModal.tsx'
      - 'web/src/components/chat/RunnerSetupCard.tsx'
      - 'web/src/lib/runnerInstallCommands.ts'
      - 'web/src/pages/RunnersPage.tsx'
      - 'desktop/LonghouseMenuBarHarness/**'
      - 'e2e/**'
      - 'engine/**'
      - 'runner/**'
      - 'swift/**'
      - 'scripts/install.sh'
      - 'scripts/ci/native-installer-smoke.sh'
      - 'scripts/ci/runtime-artifact-smoke.py'
      - 'scripts/ops/run-onboarding-funnel.sh'
      - 'scripts/qa/qa-oss.sh'
      - 'scripts/qa/test-local-runtime-packaging.sh'
      - 'scripts/resolve-swift-product-path.sh'
      - 'Makefile'
      - 'README.md'
  release:
    types: [published]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      run_public_canary:
        description: 'Also run the published installer canary against the default branch'
        required: false
        default: false
        type: boolean
      run_extended_hosted_matrix:
        description: 'Run the extra hosted ARM/macOS onboarding jobs'
        required: false
        default: true
        type: boolean
      run_cube_self_hosted:
        description: 'Run cube self-hosted Linux x64 smoke'
        required: false
        default: true
        type: boolean
      run_linux_x64:
        description: 'Run Linux x64 self-hosted smoke'
        required: false
        default: false
        type: boolean
      linux_x64_runner_label:
        description: 'Optional label for a Linux x64 self-hosted runner'
        required: false
        default: ''
        type: string
      run_macos_self_hosted:
        description: 'Run macOS arm64 self-hosted smoke'
        required: false
        default: false
        type: boolean
      macos_runner_label:
        description: 'Label for the macOS arm64 self-hosted runner'
        required: false
        default: ''
        type: string

env:
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: ""
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  installer-smoke:
    # Scheduled runs get the public canary below instead: building the pair
    # locally proves nothing new once a release is out.
    if: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell_path: /bin/bash
          - os: macos-latest
            shell_path: /bin/zsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: "launch-gate--install--${{ matrix.os }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head 2026-08-05

      - name: Wait for released runtime artifacts
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          deadline=$((SECONDS + 900))
          required_assets=("local-runtime-checksums.txt")
          case "$MATRIX_OS" in
            macos-latest)
              required_assets+=(
                "longhouse-engine-darwin-arm64"
                "Longhouse-macos-arm64.zip"
              )
              ;;
            ubuntu-latest)
              required_assets+=(
                "longhouse-engine-linux-x64"
              )
              ;;
          esac

          while (( SECONDS < deadline )); do
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            missing=""

            for asset in "${required_assets[@]}"; do
              if ! grep -Fx "$asset" <<<"$assets" >/dev/null; then
                missing="$asset"
                break
              fi
            done

            if [[ -z "$missing" ]]; then
              echo "Release assets are available for $RELEASE_TAG."
              exit 0
            fi

            echo "Waiting for release asset on $RELEASE_TAG: $missing"
            sleep 15
          done

          echo "Timed out waiting for release assets on $RELEASE_TAG." >&2
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >&2
          exit 1

      - name: Wait for released CLI wheel on PyPI
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          deadline=$((SECONDS + 900))

          while (( SECONDS < deadline )); do
            if python3 -c 'import json, sys, urllib.request; release_version = sys.argv[1]; payload = json.load(urllib.request.urlopen("https://pypi.org/pypi/longhouse/json", timeout=10)); raise SystemExit(0 if release_version in payload.get("releases", {}) and payload["releases"][release_version] else 1)' "$release_version"
            then
              echo "PyPI longhouse==$release_version is available."
              exit 0
            fi

            echo "Waiting for PyPI release longhouse==$release_version"
            sleep 15
          done

          echo "Timed out waiting for PyPI release longhouse==$release_version." >&2
          python3 -c 'import json, urllib.request; payload = json.load(urllib.request.urlopen("https://pypi.org/pypi/longhouse/json", timeout=10)); print("Latest PyPI versions:"); [print(version) for version in list(payload.get("releases", {}).keys())[-10:]]' >&2 || true
          exit 1

      - name: Run disposable installer smoke
        run: |
          chmod +x scripts/ci/native-installer-smoke.sh
          if [[ "${{ github.event_name }}" == "release" ]]; then
            export LONGHOUSE_NATIVE_SMOKE_REMOTE=1
            export LONGHOUSE_NATIVE_SMOKE_EXPECTED_COMMIT="$(git rev-parse HEAD)"
            release_version="${{ github.event.release.tag_name }}"
            export LONGHOUSE_NATIVE_SMOKE_EXPECTED_VERSION="${release_version#v}"
          fi
          ./scripts/ci/native-installer-smoke.sh

  installer-public-canary:
    # Installs what the world actually gets: the latest published release,
    # against the default branch, with no locally built pair.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_public_canary) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell_path: /bin/bash
          - os: macos-latest
            shell_path: /bin/zsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: "launch-gate--public-canary--${{ matrix.os }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run public installer smoke
        run: |
          chmod +x scripts/ci/native-installer-smoke.sh
          release_json="$(gh release view --json tagName)"
          release_tag="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tagName"])' <<< "$release_json")"
          export LONGHOUSE_NATIVE_SMOKE_REMOTE=1
          export LONGHOUSE_NATIVE_SMOKE_EXPECTED_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" --jq .sha)"
          export LONGHOUSE_NATIVE_SMOKE_EXPECTED_VERSION="${release_tag#v}"
          ./scripts/ci/native-installer-smoke.sh

  runtime-packaging-macos:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: macos-latest
    timeout-minutes: 20
    name: "launch-gate--runtime-packaging--macos-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run canonical macOS app packaging smoke
        run: make test-runtime-packaging-macos

      - name: Upload packaging artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packaging-macos
          if-no-files-found: ignore
          path: artifacts/runtime-packaging

  onboarding-browsers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: all
            browsers: 'chromium firefox webkit'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: "launch-gate--onboarding--${{ matrix.os }}--${{ matrix.project }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'e2e/package.json') }}
          restore-keys: |
            launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Install Playwright browsers
        run: |
          (cd e2e && bun install --silent)
          ./scripts/ci/install-playwright.sh ${{ matrix.browsers }}

      - name: Run onboarding browser ring
        run: |
          if [[ "${{ matrix.project }}" == "all" ]]; then
            make test-e2e-onboarding
          else
            make test-e2e-onboarding PROJECT=${{ matrix.project }}
          fi

      - name: Upload onboarding artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-artifacts-${{ matrix.os }}-${{ matrix.project }}
          if-no-files-found: ignore
          path: |
            e2e/test-results
            e2e/playwright-report
            qa-oss-server.log

  onboarding-browsers-extended:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_extended_hosted_matrix) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            project: onboarding-chromium
            browsers: 'chromium'
          - os: macos-latest
            project: onboarding-webkit
            browsers: 'chromium firefox webkit'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: "launch-gate--onboarding--${{ matrix.os }}--${{ matrix.project }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'e2e/package.json') }}
          restore-keys: |
            launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Install Playwright browsers
        run: |
          (cd e2e && bun install --silent)
          ./scripts/ci/install-playwright.sh ${{ matrix.browsers }}

      - name: Run onboarding browser ring
        run: make test-e2e-onboarding PROJECT=${{ matrix.project }}

      - name: Upload onboarding artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-artifacts-${{ matrix.os }}-${{ matrix.project }}
          if-no-files-found: ignore
          path: |
            e2e/test-results
            e2e/playwright-report
            qa-oss-server.log

  onboarding-funnel:
    # `make onboarding-funnel` always git-clones the repo into the README
    # contract's workdir, so this is the fresh-clone first-user path. Launch
    # Gate and the onboarding ring each used to run it; once is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: "launch-gate--onboarding-funnel"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'e2e/package.json') }}
          restore-keys: |
            launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Install Playwright Chromium shell
        run: |
          (cd e2e && bun install --silent)
          # The README onboarding contract runs the onboarding-chromium project only.
          LONGHOUSE_PLAYWRIGHT_ONLY_SHELL=1 ./scripts/ci/install-playwright.sh chromium

      - name: Run fresh-clone onboarding funnel
        run: make onboarding-funnel

      - name: Upload onboarding funnel artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-funnel-artifacts
          if-no-files-found: ignore
          path: |
            /tmp/longhouse-onboarding/e2e/test-results
            /tmp/longhouse-onboarding/e2e/playwright-report
            /tmp/longhouse-onboarding/onboarding-diagnostics

  self-hosted-cube-linux-x64:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_cube_self_hosted) }}
    runs-on: cube
    timeout-minutes: 30
    name: "launch-gate--self-hosted-onboarding--linux-x64--cube"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'e2e/package.json') }}
          restore-keys: |
            launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Install Playwright Chromium shell
        run: |
          (cd e2e && bun install --silent)
          # This lane runs the onboarding-chromium project only.
          LONGHOUSE_PLAYWRIGHT_ONLY_SHELL=1 ./scripts/ci/install-playwright.sh chromium

      - name: Run onboarding smoke on cube
        run: make test-e2e-onboarding PROJECT=onboarding-chromium

      - name: Upload self-hosted cube Linux x64 artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-self-hosted-cube-linux-x64
          if-no-files-found: ignore
          path: |
            e2e/test-results
            e2e/playwright-report
            qa-oss-server.log

  self-hosted-linux-x64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_linux_x64 && inputs.linux_x64_runner_label != '' }}
    runs-on: ${{ inputs.linux_x64_runner_label }}
    timeout-minutes: 30
    name: "launch-gate--self-hosted-onboarding--linux-x64--${{ inputs.linux_x64_runner_label }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'e2e/package.json') }}
          restore-keys: |
            launch-gate-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Ensure make available
        run: ./scripts/ci/ensure-make.sh

      - name: Install Playwright Chromium shell
        run: |
          (cd e2e && bun install --silent)
          # This lane runs the onboarding-chromium project only.
          LONGHOUSE_PLAYWRIGHT_ONLY_SHELL=1 ./scripts/ci/install-playwright.sh chromium

      - name: Run onboarding smoke on Linux x64
        run: make test-e2e-onboarding PROJECT=onboarding-chromium

      - name: Upload self-hosted Linux x64 artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-self-hosted-linux-x64
          if-no-files-found: ignore
          path: |
            e2e/test-results
            e2e/playwright-report
            qa-oss-server.log

  self-hosted-macos-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_self_hosted && inputs.macos_runner_label != '' }}
    runs-on: ${{ inputs.macos_runner_label }}
    timeout-minutes: 30
    name: "launch-gate--self-hosted-onboarding--macos-arm64--${{ inputs.macos_runner_label }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.20'

      - name: Install Playwright browsers
        run: |
          cd e2e
          bun install --silent
          bunx playwright install chromium firefox webkit

      - name: Run onboarding smoke on macOS arm64
        run: make test-e2e-onboarding PROJECT=onboarding-webkit

      - name: Upload self-hosted macOS ARM64 artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-self-hosted-macos-arm64
          if-no-files-found: ignore
          path: |
            e2e/test-results
            e2e/playwright-report
            qa-oss-server.log
