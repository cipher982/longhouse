name: Web Quality

on:
  push:
    paths:
      - 'web/**'
      - 'video/src/**'
      - 'video/package.json'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'video/src/**'
      - 'video/package.json'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch: {}

jobs:
  build-frontend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    name: "🏗️ Build frontend once"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: cd web && bun run build

      - name: Upload built frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist
          retention-days: 3

  lighthouse:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    name: "🔦 Lighthouse CI"
    needs: build-frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: lhci autorun
        working-directory: web

  bundle-size:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    name: "📦 Bundle Size"
    needs: build-frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist

      - name: Check bundle size
        run: cd web && node ./scripts/check-bundle-size.mjs

  image-size:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    name: "🖼️ Image Size Check"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for oversized images (>2MB)
        run: |
          MAX_BYTES=2097152  # 2MB in bytes
          FOUND_OVERSIZED=0

          echo "Checking images in web/public..."

          while IFS= read -r -d '' file; do
            size_bytes=$(stat -c%s "$file")
            size_kb=$((size_bytes / 1024))

            if [ "$size_bytes" -gt "$MAX_BYTES" ]; then
              size_mb=$(awk "BEGIN {printf \"%.2f\", $size_bytes/1048576}")
              echo "❌ $file: ${size_mb}MB (max: 2MB)"
              FOUND_OVERSIZED=1
            fi
          done < <(find web/public -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" -o -name "*.gif" \) -print0)

          if [ "$FOUND_OVERSIZED" -eq 1 ]; then
            echo ""
            echo "🚨 Found oversized images! Compress them before merging."
            exit 1
          fi

          echo "✅ All images under 2MB"
