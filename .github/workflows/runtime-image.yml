name: Publish Runtime Image

on:
  push:
    branches: [main]
    tags:
      - "runtime-v*"
    paths:
      - '.dockerignore'
      - 'bun.lock'
      - 'package.json'
      - 'e2e/package.json'
      - 'runner/package.json'
      - 'config/**'
      - 'docker/entrypoint.sh'
      - 'docker/runtime.dockerfile'
      - 'engine/**'
      - 'schemas/**'
      - 'server/**'
      - 'web/**'
      # video/src is a web-runtime input: the landing hero imports the demo
      # script + recordings from @longhouse/video (workspace source).
      - 'video/src/**'
      - 'video/scripts/**'
      - 'video/package.json'
      - 'scripts/ops/runtime-schema.py'
      - 'scripts/ops/release-artifacts.py'
      - '.github/workflows/runtime-image.yml'
  workflow_dispatch: {}

concurrency:
  # Image preparation is immutable per source SHA. Pushes to main share one
  # group so a queued build for a commit main has already moved past is
  # dropped (only the newest verified main commit deploys, and it contains the
  # older ones); a running build always finishes. Tags and manual runs keep
  # their own per-SHA group. Deploy and Verify treats a dropped prerequisite
  # as superseded, not failed (wait-for-ci superseded_branch).
  group: runtime-image-${{ github.repository }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    timeout-minutes: 10
    name: "Detect runtime image scope"
    runs-on: ubuntu-24.04-arm
    outputs:
      runtime_image: ${{ steps.decide.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ github.event_name == 'push' }}
        id: filter
        with:
          filters: .github/path-filters.yml
      - name: Resolve runtime image scope
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "runtime_image=${{ steps.filter.outputs.runtime_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "runtime_image=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    timeout-minutes: 45
    runs-on: cube-maint
    needs: changes
    env:
      # Only the publishing job receives the scoped archive authority, as
      # ordinary environment values. Public code never names a secret manager.
      RUNTIME_ARTIFACT_S3_ENDPOINT: ${{ secrets.RUNTIME_ARTIFACT_S3_ENDPOINT }}
      RUNTIME_ARTIFACT_S3_BUCKET: ${{ secrets.RUNTIME_ARTIFACT_S3_BUCKET }}
      RUNTIME_ARTIFACT_S3_PREFIX: ${{ secrets.RUNTIME_ARTIFACT_S3_PREFIX }}
      RUNTIME_ARTIFACT_S3_ACCESS_KEY_ID: ${{ secrets.RUNTIME_ARTIFACT_S3_ACCESS_KEY_ID }}
      RUNTIME_ARTIFACT_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNTIME_ARTIFACT_S3_SECRET_ACCESS_KEY }}
    if: ${{ needs.changes.outputs.runtime_image == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0


      - name: Stage build identity for runtime image
        run: python3 scripts/build/generate_build_identity.py

      - name: Resolve exact candidate catalog schema
        id: schema
        run: python3 scripts/ops/runtime-schema.py --source-root . --github-output "$GITHUB_OUTPUT"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/longhouse-runtime
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${HEAD_SHA}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "$DEFAULT_BRANCH" ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/runtime.dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.longhouse.catalog-schema.version=${{ steps.schema.outputs.schema_version }}
            org.longhouse.catalog-schema.min-reader=${{ steps.schema.outputs.schema_min_reader }}
            org.longhouse.catalog-schema.max-reader=${{ steps.schema.outputs.schema_max_reader }}
          # Keep the layer cache on cube's disk. type=gha shares GitHub's 10 GB
          # per-repo cache with CI's fixture-image caches; once over the cap,
          # LRU eviction kept dropping this image's layers (the 600 MB model
          # re-downloaded on most builds) and the export itself took 55-216 s.
          # ci-cache-gc.timer on cube bounds the directory.
          cache-from: type=local,src=/ci-cache/buildkit/longhouse-runtime
          cache-to: type=local,dest=/ci-cache/buildkit/longhouse-runtime,mode=max,ignore-error=true

      - name: Write immutable qualification metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_WORKFLOW: ${{ github.workflow }}
          SOURCE_ORDER: ${{ github.run_number }}
          QUALIFICATION_ID: runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          SCHEMA_VERSION: ${{ steps.schema.outputs.schema_version }}
          SCHEMA_MIN_READER: ${{ steps.schema.outputs.schema_min_reader }}
          SCHEMA_MAX_READER: ${{ steps.schema.outputs.schema_max_reader }}
        run: |
          python3 - "$RUNNER_TEMP/qualification.json" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "source_workflow": os.environ["SOURCE_WORKFLOW"],
                      "source_order": int(os.environ["SOURCE_ORDER"]),
                      "source_sha": os.environ["SOURCE_SHA"],
                      "qualification_id": os.environ["QUALIFICATION_ID"],
                      "schema_version": int(os.environ["SCHEMA_VERSION"]),
                      "schema_min_reader": int(os.environ["SCHEMA_MIN_READER"]),
                      "schema_max_reader": int(os.environ["SCHEMA_MAX_READER"]),
                      "gates": {"image_build": "success"},
                  },
                  handle,
                  sort_keys=True,
              )
          PY

      - name: Publish immutable OCI archive
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/longhouse-runtime@${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --project server python scripts/ops/release-artifacts.py publish \
            --image "$IMAGE_REF" \
            --source-sha "$SOURCE_SHA" \
            --build-run-id "$BUILD_RUN_ID" \
            --build-attempt "$BUILD_ATTEMPT" \
            --build-identity .build/build-identity.json \
            --qualification-json "$RUNNER_TEMP/qualification.json" \
            --qualification-id "runtime-image-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Write immutable publication receipt
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_WORKFLOW: ${{ github.workflow }}
          SOURCE_ORDER: ${{ github.run_number }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION_ID: runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - "$RUNNER_TEMP/runtime-publication.json" <<'PY'
          import json
          import os
          import re
          import sys

          digest = os.environ["IMAGE_DIGEST"]
          source_sha = os.environ["SOURCE_SHA"]
          source_order = os.environ["SOURCE_ORDER"]
          build_run_id = os.environ["BUILD_RUN_ID"]
          build_attempt = os.environ["BUILD_ATTEMPT"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Build output did not provide an immutable image digest")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("Publication source is not a full commit SHA")
          if not source_order.isdigit() or int(source_order) < 1:
              raise SystemExit("Publication source order is not a positive workflow run number")
          if not build_run_id.isdigit() or not build_attempt.isdigit():
              raise SystemExit("Publication run identity is malformed")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schema": "longhouse.runtime-publication.v1",
                      "image_digest": digest,
                      "source_sha": source_sha,
                      "source_workflow": os.environ["SOURCE_WORKFLOW"],
                      "source_order": int(source_order),
                      "build_run_id": build_run_id,
                      "build_attempt": int(build_attempt),
                      "qualification_id": os.environ["QUALIFICATION_ID"],
                  },
                  handle,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
      - name: Upload immutable publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-publication.json
          if-no-files-found: error
          retention-days: 90
