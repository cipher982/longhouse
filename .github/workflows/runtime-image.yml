name: Publish Runtime Image

# "Published" means: the image is in GHCR by digest and this run uploaded its
# publication receipt. Deploy and Verify, Promote Rings (dogfood fast lane) and
# the promote scripts read exactly that. The OCI archive in the object store
# follows in Archive Runtime Image (runtime-image-archive.yml), off this path;
# production promotion requires it (scripts/ops/promotion_gates.py, gate
# `archive`). Timing and layer layout: control-plane
# docs/specs/runtime-image-build.md.

on:
  push:
    branches: [main]
    tags:
      - "runtime-v*"
    # This list is the whole scope check: a push that touches none of these
    # never starts a run (there is no separate scope-detection job).
    paths:
      - '.dockerignore'
      - 'bun.lock'
      - 'package.json'
      - 'e2e/package.json'
      - 'runner/package.json'
      - 'config/**'
      - 'docker/entrypoint.sh'
      - 'docker/runtime.dockerfile'
      - 'engine/**'
      - 'schemas/**'
      - 'server/**'
      - 'web/**'
      # video/src is a web-runtime input: the landing hero imports the demo
      # script + recordings from @longhouse/video (workspace source).
      - 'video/src/**'
      - 'video/scripts/**'
      - 'video/package.json'
      - 'scripts/ops/runtime-schema.py'
      - 'scripts/ops/release-artifacts.py'
      - '.github/workflows/runtime-image.yml'
  workflow_dispatch: {}

concurrency:
  # One group per source SHA: a newer push never waits behind an older build.
  # Builds may therefore finish out of order, and nothing depends on finish
  # order. Every receipt carries source_order = this run's number, which GitHub
  # assigns in push order; Promote Rings takes the highest-numbered successful
  # run and never moves dogfood to a commit that does not contain what it
  # serves; the control plane orders deployments by source_order; and `latest`
  # moves only for main's head, in Archive Runtime Image. A rerun of the same
  # SHA waits for the first.
  group: runtime-image-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    timeout-minutes: 45
    runs-on: cube-maint
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Stage build identity for runtime image
        run: python3 scripts/build/generate_build_identity.py

      - name: Resolve exact candidate catalog schema
        id: schema
        run: python3 scripts/ops/runtime-schema.py --source-root . --github-output "$GITHUB_OUTPUT"

      # The persistent BuildKit daemon on cube (me repo
      # domains/mytech/infrastructure/kube/buildkit/buildkitd.yaml) holds the
      # layer cache on cube's disk, shared safely by concurrent builds and
      # bounded by its own GC; a build imports and exports nothing.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/longhouse-runtime
          HEAD_SHA: ${{ github.sha }}
        run: |
          # `latest` is not set here: builds finish out of order, so Archive
          # Runtime Image moves it afterwards, only for main's head.
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${HEAD_SHA}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/runtime.dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.longhouse.catalog-schema.version=${{ steps.schema.outputs.schema_version }}
            org.longhouse.catalog-schema.min-reader=${{ steps.schema.outputs.schema_min_reader }}
            org.longhouse.catalog-schema.max-reader=${{ steps.schema.outputs.schema_max_reader }}

      # The receipt directory is uploaded as one artifact. runtime-publication.json
      # is what every consumer reads; build-identity.json and qualification.json
      # are the inputs Archive Runtime Image needs to seal the OCI archive.
      - name: Write immutable publication receipt
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_WORKFLOW: ${{ github.workflow }}
          SOURCE_ORDER: ${{ github.run_number }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          QUALIFICATION_ID: runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          SCHEMA_VERSION: ${{ steps.schema.outputs.schema_version }}
          SCHEMA_MIN_READER: ${{ steps.schema.outputs.schema_min_reader }}
          SCHEMA_MAX_READER: ${{ steps.schema.outputs.schema_max_reader }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-publication"
          cp .build/build-identity.json "$RUNNER_TEMP/runtime-publication/build-identity.json"
          python3 - "$RUNNER_TEMP/runtime-publication" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          digest = os.environ["IMAGE_DIGEST"]
          source_sha = os.environ["SOURCE_SHA"]
          source_order = os.environ["SOURCE_ORDER"]
          build_run_id = os.environ["BUILD_RUN_ID"]
          build_attempt = os.environ["BUILD_ATTEMPT"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Build output did not provide an immutable image digest")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("Publication source is not a full commit SHA")
          if not source_order.isdigit() or int(source_order) < 1:
              raise SystemExit("Publication source order is not a positive workflow run number")
          if not build_run_id.isdigit() or not build_attempt.isdigit():
              raise SystemExit("Publication run identity is malformed")
          with open(out / "qualification.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "source_workflow": os.environ["SOURCE_WORKFLOW"],
                      "source_order": int(source_order),
                      "source_sha": source_sha,
                      "qualification_id": os.environ["QUALIFICATION_ID"],
                      "schema_version": int(os.environ["SCHEMA_VERSION"]),
                      "schema_min_reader": int(os.environ["SCHEMA_MIN_READER"]),
                      "schema_max_reader": int(os.environ["SCHEMA_MAX_READER"]),
                      "gates": {"image_build": "success"},
                  },
                  handle,
                  sort_keys=True,
              )
          with open(out / "runtime-publication.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schema": "longhouse.runtime-publication.v1",
                      "image_digest": digest,
                      "source_sha": source_sha,
                      "source_workflow": os.environ["SOURCE_WORKFLOW"],
                      "source_order": int(source_order),
                      "build_run_id": build_run_id,
                      "build_attempt": int(build_attempt),
                      "qualification_id": os.environ["QUALIFICATION_ID"],
                  },
                  handle,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
      - name: Upload immutable publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-publication/
          if-no-files-found: error
          retention-days: 90
