name: Archive Runtime Image

# Copies every published runtime image's complete OCI closure (manifests, config,
# layers) into the immutable object store, then uploads the sealed archive
# receipt as `runtime-oci-archive-<source sha>`. It runs after Publish Runtime
# Image instead of inside it, so the archive is off the path to "published"
# (dogfood's fast lane and the canary need only the registry digest), and
# production promotion requires the receipt: scripts/ops/promotion_gates.py,
# gate `archive` (control-plane docs/specs/release-rings.md, "Production").
#
# Archive (or re-receipt) one publication by hand:
#   gh workflow run runtime-image-archive.yml --ref main -f publish_run_id=<run id>
# A publication from before this workflow existed was archived inside its own
# run and its receipt artifact has no build inputs; for it this reads the
# sealed manifest back from the store instead of publishing.

on:
  workflow_run:
    workflows: ["Publish Runtime Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: "Publish Runtime Image run id whose image to archive"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write  # moving `latest`

concurrency:
  group: runtime-image-archive-${{ github.event.workflow_run.id || inputs.publish_run_id }}
  cancel-in-progress: false

jobs:
  archive:
    name: Archive the published image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: cube-gate
    timeout-minutes: 30
    steps:
      # The archive tooling comes from this workflow's own commit (main), not
      # from the commit whose image is archived.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Resolve the publication and its receipt
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "publish run id must be a number: $PUBLISH_RUN_ID" >&2; exit 1; }
          api() {
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          run="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .name == "Publish Runtime Image" and .path == ".github/workflows/runtime-image.yml"
            and .status == "completed" and .conclusion == "success"
            and .repository.full_name == $repo and .head_repository.full_name == $repo' <<<"$run" >/dev/null || {
            echo "run $PUBLISH_RUN_ID is not a successful Publish Runtime Image run of $GITHUB_REPOSITORY" >&2
            exit 1
          }
          sha="$(jq -r '.head_sha' <<<"$run")"
          attempt="$(jq -r '.run_attempt' <<<"$run")"
          number="$(jq -r '.run_number' <<<"$run")"
          name="runtime-publication-${PUBLISH_RUN_ID}-${attempt}"
          artifact_id="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}/artifacts?per_page=100" \
            | jq -r --arg name "$name" '[.artifacts[] | select(.expired == false and .name == $name)] | if length == 1 then .[0].id else empty end')"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || { echo "run $PUBLISH_RUN_ID has no artifact $name" >&2; exit 1; }
          dir="$RUNNER_TEMP/publication"
          mkdir -p "$dir"
          api --output "$RUNNER_TEMP/publication.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          unzip -q -o "$RUNNER_TEMP/publication.zip" -d "$dir"
          [[ -s "$dir/runtime-publication.json" ]] || { echo "artifact $name has no runtime-publication.json" >&2; exit 1; }
          validated="$(python3 scripts/ops/release-artifacts.py verify-publication \
            --receipt "$dir/runtime-publication.json" \
            --source-sha "$sha" \
            --source-order "$number" \
            --build-run-id "$PUBLISH_RUN_ID" \
            --build-attempt "$attempt")"
          {
            echo "sha=$sha"
            echo "attempt=$attempt"
            echo "digest=$(jq -er '.image_digest' <<<"$validated")"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"

      - name: Publish immutable OCI archive
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/longhouse-runtime@${{ steps.pub.outputs.digest }}
          SOURCE_SHA: ${{ steps.pub.outputs.sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
          BUILD_ATTEMPT: ${{ steps.pub.outputs.attempt }}
          PUB_DIR: ${{ steps.pub.outputs.dir }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # The scoped archive authority, for this step only, as ordinary
          # environment values. Public code never names a secret manager.
          RUNTIME_ARTIFACT_S3_ENDPOINT: ${{ secrets.RUNTIME_ARTIFACT_S3_ENDPOINT }}
          RUNTIME_ARTIFACT_S3_BUCKET: ${{ secrets.RUNTIME_ARTIFACT_S3_BUCKET }}
          RUNTIME_ARTIFACT_S3_PREFIX: ${{ secrets.RUNTIME_ARTIFACT_S3_PREFIX }}
          RUNTIME_ARTIFACT_S3_ACCESS_KEY_ID: ${{ secrets.RUNTIME_ARTIFACT_S3_ACCESS_KEY_ID }}
          RUNTIME_ARTIFACT_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNTIME_ARTIFACT_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/runtime-oci-archive/runtime-oci-archive.json"
          mkdir -p "$(dirname "$out")"
          if [[ -s "$PUB_DIR/build-identity.json" && -s "$PUB_DIR/qualification.json" ]]; then
            uv run --project server python scripts/ops/release-artifacts.py publish \
              --image "$IMAGE_REF" \
              --source-sha "$SOURCE_SHA" \
              --build-run-id "$BUILD_RUN_ID" \
              --build-attempt "$BUILD_ATTEMPT" \
              --build-identity "$PUB_DIR/build-identity.json" \
              --qualification-json "$PUB_DIR/qualification.json" \
              --qualification-id "runtime-image-${BUILD_RUN_ID}-${BUILD_ATTEMPT}" \
              > "$out"
          else
            echo "The publication carries no archive inputs (it archived inside its own run); reading its sealed manifest back."
            uv run --project server python scripts/ops/release-artifacts.py receipt \
              --image-digest "${IMAGE_REF##*@}" > "$out"
          fi
          jq -e --arg digest "${IMAGE_REF##*@}" --arg sha "$SOURCE_SHA" '
            .schema == "longhouse.runtime-oci-archive.v1" and .sealed == true
            and .image_digest == $digest and .source_sha == $sha' "$out" >/dev/null || {
            echo "no sealed archive receipt for $IMAGE_REF" >&2
            exit 1
          }
          jq -c '{image_digest, source_sha, blob_count, blobs_written, manifest_reused, manifest_key}' "$out"

      - name: Upload the archive receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-oci-archive-${{ steps.pub.outputs.sha }}
          path: ${{ runner.temp }}/runtime-oci-archive/runtime-oci-archive.json
          if-no-files-found: error
          retention-days: 90
          # A re-run attempt of this run re-uploads the same name.
          overwrite: true

      # `latest` is a convenience tag (every ring deploys by digest). Builds
      # finish out of order, so it moves only to main's head, checked a moment
      # before the retag: a newer push cannot also be published within that
      # moment, since its own build takes over a minute. Its failure never
      # fails this run: production's archive gate needs this run to succeed.
      - name: Log in to GHCR
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.event == 'push'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to main's head
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.event == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/longhouse-runtime
          DIGEST: ${{ steps.pub.outputs.digest }}
          SOURCE_SHA: ${{ steps.pub.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head="$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}")"
          if [[ "$head" != "$SOURCE_SHA" ]]; then
            echo "${DEFAULT_BRANCH} is at $head, not $SOURCE_SHA; leaving latest to a newer publication."
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE_NAME}:latest" | jq -c '{digest, mediaType}'
