backend:
  - 'server/**'
  - 'config/**'

frontend:
  - 'web/**'
  - 'bun.lock'
  - 'package.json'

engine:
  - 'engine/**'
  # The Makefile decides which engine tests run, so a change to it must trigger
  # them. The ios: filter below already does this for the same reason.
  - 'Makefile'
  # The engine compiles this manifest in with include_str!.
  - 'server/zerg/config/managed_provider_contracts.json'

schemas:
  - 'schemas/**'
  - 'scripts/generate/**'
  - 'Makefile'

ci_plumbing:
  - '.github/path-filters.yml'
  - '.github/workflows/contract-first-ci.yml'

packaging:
  - 'server/hatch_build.py'
  - 'server/pyproject.toml'
  - 'server/setup.cfg'
  - 'server/zerg/**'
  - 'web/**'
  - 'scripts/qa/test-wheel-package.sh'

runner:
  - 'runner/**'

ios:
  - 'ios/**'
  # `make release` edits MARKETING_VERSION here and nothing else in ios/. That
  # bump commit is the exact SHA every release gate waits on, and the iOS lane
  # (15-20 min on a hosted macOS VM) was its long pole while proving nothing
  # about a version string. Readers of `ios` must pass predicate-quantifier:
  # some-with-excludes (contract-first-ci.yml does; scripts/ci/affected.py mirrors it).
  - '!ios/XcodeHarness/Configs/Version.xcconfig'
  - 'scripts/build/generate_build_identity.py'
  - 'scripts/build/stage_ios_build_identity.sh'
  - 'scripts/ci/run_ios_tests.sh'
  - 'scripts/ci/ios_test_slice.py'
  - 'scripts/ci/select_ios_simulator.py'
  # The Makefile now owns which schemes the merge gate runs, and this file plus
  # the workflow decide whether that gate runs at all. Without them a change to
  # what iOS testing means skips iOS testing and reports success.
  - 'Makefile'
  - '.github/path-filters.yml'
  - '.github/workflows/contract-first-ci.yml'

e2e:
  - 'e2e/**'
  - 'engine/**'
  - 'server/**'
  - 'web/**'
  - 'config/**'

models:
  - 'config/models.json'
  - 'server/zerg/llm/**'
  - 'scripts/qa/smoke_models.py'

scripts:
  - 'scripts/**'

runtime_image:
  - '.dockerignore'
  - 'bun.lock'
  - 'package.json'
  - 'e2e/package.json'
  - 'runner/package.json'
  - 'config/**'
  - 'docker/entrypoint.sh'
  - 'docker/runtime.dockerfile'
  - 'engine/**'
  - 'schemas/**'
  - 'server/**'
  - 'web/**'
  - 'video/src/**'
  - 'video/scripts/**'
  - 'video/package.json'
  - '.github/workflows/runtime-image.yml'
  - 'scripts/ops/runtime-schema.py'
  - 'scripts/ops/release-artifacts.py'

deploy_verify:
  - '.dockerignore'
  - 'bun.lock'
  - 'package.json'
  - 'e2e/package.json'
  - 'runner/package.json'
  - 'config/**'
  - 'docker/entrypoint.sh'
  - 'docker/runtime.dockerfile'
  - 'engine/**'
  - 'schemas/**'
  - 'server/**'
  - 'web/**'
  - 'video/src/**'
  - 'video/scripts/**'
  - 'video/package.json'
  - 'scripts/ci/setup-deploy-ssh.sh'
  - 'scripts/ci/wait-for-http.sh'
  - 'scripts/lib/hosted-instance.sh'
  - 'scripts/ops/runtime-deploy.sh'
  - 'deploy/zerg/**'
  - 'scripts/qa/**'
  - '.github/actions/wait-for-ci/**'
  - '.github/workflows/deploy-and-verify.yml'
  - 'scripts/ops/runtime-schema.py'
  - 'scripts/ops/release-artifacts.py'
  - '.github/workflows/runtime-image.yml'
