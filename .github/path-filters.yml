backend:
  - 'server/**'
  - 'config/**'

frontend:
  - 'web/**'
  - 'bun.lock'
  - 'package.json'

engine:
  - 'engine/**'
  # The Makefile decides which engine tests run, so a change to it must trigger
  # them. The ios: filter below already does this for the same reason.
  - 'Makefile'
  # The engine include_str!s engine/src/managed_provider_contracts.generated.json
  # (covered above), not the server manifest, whose source digests churn.

schemas:
  - 'schemas/**'
  - 'scripts/generate/**'
  - 'Makefile'

ci_plumbing:
  - '.github/path-filters.yml'
  - '.github/workflows/contract-first-ci.yml'

packaging:
  - 'server/hatch_build.py'
  - 'server/pyproject.toml'
  - 'server/setup.cfg'
  - 'server/zerg/**'
  - 'web/**'
  - 'scripts/qa/test-wheel-package.sh'

runner:
  - 'runner/**'

ios:
  - 'ios/**'
  # `make release` edits MARKETING_VERSION here and nothing else in ios/. That
  # bump commit is the exact SHA every release gate waits on, and the iOS lane
  # (15-20 min on a hosted macOS VM) was its long pole while proving nothing
  # about a version string. Readers of `ios` must pass predicate-quantifier:
  # some-with-excludes (contract-first-ci.yml does; scripts/ci/affected.py mirrors it).
  - '!ios/XcodeHarness/Configs/Version.xcconfig'
  - 'scripts/build/generate_build_identity.py'
  - 'scripts/build/stage_ios_build_identity.sh'
  - 'scripts/ci/run_ios_tests.sh'
  - 'scripts/ci/select_ios_simulator.py'
  # The Makefile now owns which schemes the merge gate runs, and this file plus
  # the workflow decide whether that gate runs at all. Without them a change to
  # what iOS testing means skips iOS testing and reports success.
  - 'Makefile'
  - '.github/path-filters.yml'
  - '.github/workflows/contract-first-ci.yml'

e2e:
  - 'e2e/**'
  - 'engine/**'
  - 'server/**'
  - 'web/**'
  - 'config/**'

models:
  - 'config/models.json'
  - 'server/zerg/llm/**'
  - 'scripts/qa/smoke_models.py'

scripts:
  - 'scripts/**'

# What the UI popover sweep renders and what drives it. The job used the frontend
# and scripts filters, so 18 of the 25 commits that started it on 2026-11-11/12
# changed only scripts/ci, scripts/qa, scripts/tests or scripts/ops.
ui_sweep:
  - 'web/**'
  - 'bun.lock'
  - 'package.json'
  - 'scripts/ui/**'

runtime_image:
  - '.dockerignore'
  - 'bun.lock'
  - 'package.json'
  - 'e2e/package.json'
  - 'runner/package.json'
  - 'config/**'
  - 'docker/entrypoint.sh'
  - 'docker/runtime.dockerfile'
  - 'engine/**'
  - 'schemas/**'
  - 'server/**'
  - 'web/**'
  - 'video/src/**'
  - 'video/scripts/**'
  - 'video/package.json'
  - 'scripts/ops/runtime-schema.py'
  - 'scripts/ops/release-artifacts.py'

# THE ONE COPY of what a Terminal Truth run measures: the CI job `terminal-truth` runs when any of these changed.
# scripts/ops/dogfood-sensitive-paths.toml carries the same list as live_preview_paths, which decides whose status
# the dogfood deploy requires, and scripts/tests/dogfood-sensitive-paths.test.py fails if the two differ. Keep one
# quoted path per line.
terminal_truth:
  # --- the Machine Agent and what it embeds; every mutated engine is rebuilt when these change
  - "engine/**"
  - "config/**"
  - "schemas/**"
  # --- the Runtime Host: ingest, live preview, stream, and the harness, scripted model and ledger under zerg/qa
  - "server/zerg/**"
  - "server/pyproject.toml"
  - "server/uv.lock"
  # --- clients that render the live preview
  - "web/src/features/session/useSessionWorkspace.ts"
  - "web/src/features/session/sessionActivityFeed.ts"
  - "web/src/features/session/TimelinePane.tsx"
  - "web/src/features/session/SessionRuntimeStrip.tsx"
  - "ios/Sources/Shared/Streams/SessionWorkspaceStream.swift"
  - "ios/Sources/LonghouseApp/Session/Runtime/ActivityPulseStore.swift"
  # --- the build wrapper, the pinned versions and the steps
  - "scripts/build/**"
  - "scripts/ci/terminal-truth-*"
  - "scripts/ci/terminal_truth_*.py"
  - ".github/actions/terminal-truth/**"

# The harness that judges the cells. A push that changes one of these also runs the 43 mutation checks, which prove the
# gate still fails each known defect; every other push runs the cells only, and the nightly runs the mutation checks.
terminal_truth_harness:
  - "server/zerg/qa/**"
  - "server/zerg/provider_contract/**"
  - "scripts/ci/terminal-truth-*"
  - "scripts/ci/terminal_truth_*.py"
  - ".github/actions/terminal-truth/**"
