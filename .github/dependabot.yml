version: 2

updates:
  # Workflow actions are pinned to commit SHAs so a moved tag can't ship a new
  # action into the release/deploy lanes. Dependabot moves the pins forward.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/check-freshness"
      - "/.github/actions/wait-for-ci"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
